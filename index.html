<script>
(function(){
"use strict";
/* ============================================================
   First Notes – beginner lessons for classical guitar and the
   Turkish G clarinet. Single file, no build step, no tracking.
   ============================================================ */

// ---------- storage ----------
const store={
  get(k,d){ try{ const v=localStorage.getItem(k); return v==null?d:JSON.parse(v); }catch(e){ return d; } },
  set(k,v){ try{ localStorage.setItem(k,JSON.stringify(v)); }catch(e){} }
};

// ---------- i18n ----------
const LANGS=[["en","EN"],["de","DE"],["tr","TR"]];
let lang=store.get("fn-lang","en"); if(!LANGS.some(l=>l[0]===lang)) lang="en";
/** Pick the current language from a {en,de,tr} object (falls back to English). */
const L=o=>(o&&typeof o==="object"&&!Array.isArray(o))?(o[lang]??o.en):o;
/** Inline translation: X("English","Deutsch","Türkçe"). */
const X=(en,de,tr)=>L({en,de,tr});
const fill=(s,p)=>s.replace(/\{(\w+)\}/g,(_,k)=>p[k]??"");

// ---------- note names ----------
const NAMES={
  en:["C","C♯","D","E♭","E","F","F♯","G","G♯","A","B♭","B"],
  de:["C","Cis","D","Es","E","F","Fis","G","Gis","A","B","H"],
  tr:["Do","Do♯","Re","Mi♭","Mi","Fa","Fa♯","Sol","Sol♯","La","Si♭","Si"]
};
const SOLF=NAMES.tr, LETTER_EN=NAMES.en;
const pc=m=>((m%12)+12)%12;
const noteName=m=>NAMES[lang][pc(m)];
/** Chord root names: German uses H/B, Turkish chord charts use English letters. */
const CHORD_ROOT={en:["C","C♯","D","E♭","E","F","F♯","G","G♯","A","B♭","B"],de:["C","Cis","D","Es","E","F","Fis","G","Gis","A","B","H"],tr:["C","C♯","D","E♭","E","F","F♯","G","G♯","A","B♭","B"]};
const chordName=(root,suffix)=>CHORD_ROOT[lang][pc(root)]+suffix;

// ---------- audio ----------
let actx=null;
function ctx(){ if(!actx) actx=new (window.AudioContext||window.webkitAudioContext)(); if(actx.state==="suspended") actx.resume(); return actx; }
const hz=m=>440*Math.pow(2,(m-69)/12);
/** Soft woodwind-like tone (odd harmonics). Returns a stop() function. */
function windTone(m,dur=1.4,vol=.22){
  try{
    const c=ctx(), t=c.currentTime, g=c.createGain(), oscs=[];
    const rel=Math.min(.25,dur*.3);
    g.gain.setValueAtTime(0,t); g.gain.linearRampToValueAtTime(vol,t+.04); g.gain.setValueAtTime(vol,t+dur-rel); g.gain.linearRampToValueAtTime(0,t+dur);
    g.connect(c.destination);
    [[1,1],[3,.35],[5,.15]].forEach(([h,a])=>{ const o=c.createOscillator(), og=c.createGain(); o.frequency.value=hz(m)*h; og.gain.value=a; o.connect(og); og.connect(g); o.start(t); o.stop(t+dur+.05); oscs.push(o); });
    return ()=>oscs.forEach(o=>{ try{o.stop();}catch(e){} });
  }catch(e){ return ()=>{}; }
}
/** Plucked nylon string (Karplus-Strong). Returns the source node. */
const pluckCache={};
function pluckBuffer(m){
  if(pluckCache[m]) return pluckCache[m];
  const c=ctx(), sr=c.sampleRate, len=Math.floor(sr*2.6), b=c.createBuffer(1,len,sr), d=b.getChannelData(0);
  const N=Math.max(2,Math.round(sr/hz(m))), r=new Float32Array(N);
  let prev=0; for(let i=0;i<N;i++){ const w=Math.random()*2-1; prev=prev*.6+w*.4; r[i]=prev; }
  const decay=m<50?.9975:.9965; let k=0;
  for(let i=0;i<len;i++){ const a=r[k], nb=r[(k+1)%N]; r[k]=decay*.5*(a+nb); d[i]=a*.6; k=(k+1)%N; }
  return pluckCache[m]=b;
}
function pluck(m,when=0,vol=.6){ try{ const c=ctx(), s=c.createBufferSource(), g=c.createGain(); s.buffer=pluckBuffer(m); g.gain.value=vol; s.connect(g); g.connect(c.destination); s.start(c.currentTime+when); return s; }catch(e){ return null; } }
function click(accent,when=0){ try{ const c=ctx(), t=c.currentTime+when, o=c.createOscillator(), g=c.createGain(); o.frequency.value=accent?1500:1000; g.gain.setValueAtTime(.12,t); g.gain.exponentialRampToValueAtTime(.001,t+.05); o.connect(g); g.connect(c.destination); o.start(t); o.stop(t+.06);}catch(e){} }

// ---------- pitch detection (autocorrelation) ----------
function detectPitch(buf,rate,minF,maxF){
  let rms=0; for(const v of buf) rms+=v*v; rms=Math.sqrt(rms/buf.length); if(rms<.011) return -1;
  const n=buf.length, minL=Math.floor(rate/maxF), maxL=Math.floor(rate/minF), c=new Float32Array(maxL+2);
  let e=0; for(let i=0;i<n;i++) e+=buf[i]*buf[i];
  for(let l=minL;l<=maxL+1;l++){ let s=0; for(let i=0;i<n-l;i++) s+=buf[i]*buf[i+l]; c[l]=s; }
  let best=-1,bv=0;
  for(let l=minL+1;l<=maxL;l++){ const v=c[l]/e; if(v>.5&&c[l]>c[l-1]&&c[l]>=c[l+1]){ if(v>bv){bv=v;best=l;} if(v>.85) break; } }
  if(best<0) return -1;
  const a=c[best-1],b=c[best],d=c[best+1],sh=(a-d)/(2*(a-2*b+d)||1);
  return rate/(best+(isFinite(sh)?sh:0));
}
const mic={stream:null,raf:0,
  async start(onPitch,minF,maxF){
    this.stop();
    try{ this.stream=await navigator.mediaDevices.getUserMedia({audio:{echoCancellation:false,noiseSuppression:false,autoGainControl:false}}); }
    catch(e){ return false; }
    const c=ctx(), an=c.createAnalyser(); an.fftSize=4096; c.createMediaStreamSource(this.stream).connect(an);
    const data=new Float32Array(an.fftSize);
    const loop=()=>{ an.getFloatTimeDomainData(data); onPitch(detectPitch(data,c.sampleRate,minF,maxF)); this.raf=requestAnimationFrame(loop); };
    loop(); return true;
  },
  stop(){ if(this.stream){ cancelAnimationFrame(this.raf); this.stream.getTracks().forEach(t=>t.stop()); this.stream=null; } },
  get on(){ return !!this.stream; }
};

/** Treble staff. items: [{w: written midi, label, color}] */
function staffSVG(items,sel,opts={}){
  const hs=7, bottom=118, x0=opts.octaveBelow?78:72, dx=opts.dx||42, W=x0+items.length*dx+10;
  const yOf=d=>bottom-(d-30)*hs;
  let o=`<svg viewBox="0 0 ${W} 200" width="${W}" role="img" aria-label="${X("Staff","Notenlinien","Porte")}">`;
  for(let i=0;i<5;i++){ const y=bottom-i*2*hs; o+=`<line x1="6" y1="${y}" x2="${W-6}" y2="${y}" stroke="var(--muted)" stroke-width="1.3"/>`; }
  o+=`<path d="${CLEF}" transform="translate(-1.88 115.07) scale(0.0823 -0.0823)" fill="var(--ink)"/>`;
  if(opts.octaveBelow) o+=`<text x="30" y="${bottom+34}" font-size="13" fill="var(--ink)">8</text>`;
  items.forEach((it,i)=>{
    const p=pc(it.w), oct=Math.floor(it.w/12)-1, d=DIA[p]+7*oct, x=x0+i*dx+16, y=yOf(d), on=i===sel;
    let g=`<g class="staff-note" data-i="${i}" tabindex="0" role="button" aria-label="${it.label}">`;
    g+=`<rect x="${x-19}" y="8" width="38" height="186" rx="8" fill="${on?"var(--accent-soft)":"transparent"}"/>`;
    for(let Ld=28;Ld>=d;Ld-=2) g+=`<line x1="${x-14}" y1="${yOf(Ld)}" x2="${x+14}" y2="${yOf(Ld)}" stroke="var(--muted)" stroke-width="1.3"/>`;
    for(let Ld=40;Ld<=d;Ld+=2) g+=`<line x1="${x-14}" y1="${yOf(Ld)}" x2="${x+14}" y2="${yOf(Ld)}" stroke="var(--muted)" stroke-width="1.3"/>`;
    if(ACC[p]) g+=`<text x="${x-22}" y="${y+6}" font-size="17" fill="var(--ink)">${ACC[p]}</text>`;
    g+=`<ellipse cx="${x}" cy="${y}" rx="8.5" ry="6.3" transform="rotate(-20 ${x} ${y})" fill="${it.color||"var(--ink)"}"/>`;
    g+=`<text x="${x}" y="190" font-size="12" font-weight="${on?700:400}" fill="var(--ink)" text-anchor="middle">${it.label}</text>`;
    o+=g+`</g>`;
  });
  return o+`</svg>`;
}

function bindPath(root,weeks,key){

function bindRoutine(root,steps){
  const total=steps.reduce((a,r)=>a+r.m,0)*60; let left=total, timer=null;
  const btn=root.querySelector('[data-role="rstart"]');
  const draw=()=>{ const el=total-left; let acc=0;
    root.querySelector('[data-role="rlist"]').innerHTML=steps.map(r=>{ const st=acc; acc+=r.m*60; const cls=el>=acc?"past":el>=st&&timer?"cur":""; return `<div class="rstep ${cls}"><span class="min">${r.m}′</span><div><b>${r.t}</b><span>${r.d}</span></div></div>`; }).join("");
    root.querySelector('[data-role="rclock"]').textContent=fmtTime(left); };
  const stop=()=>{ if(timer){clearInterval(timer); timer=null;} };
  btn.onclick=()=>{ if(timer){ stop(); btn.textContent=X("Resume","Weiter","Devam"); draw(); return; }
    ctx(); let prev=-1;
    timer=setInterval(()=>{ left--; const el=total-left; let acc=0,st=0; steps.forEach((r,i)=>{ if(el>=acc) st=i; acc+=r.m*60; });
      if(st!==prev){ if(prev>=0) click(true); prev=st; }
      if(left<=0){ stop(); left=0; btn.textContent=X("Start","Start","Başla"); click(true); click(true,.2); }
      draw(); },1000);
    running.add(stop); btn.textContent=X("Pause","Pause","Duraklat"); draw(); };
  root.querySelector('[data-role="rreset"]').onclick=()=>{ stop(); left=total; btn.textContent=X("Start","Start","Başla"); draw(); };
  draw();
}

  const idx=c.f.map((f,s)=>f>=0?s:-1).filter(s=>s>=0);
  const order=dir==="U"?idx.filter(s=>s>=2).reverse():idx;
  order.forEach((s,i)=>pluck(G.midi(s,c.f[s],capo),when+i*(dir==="U"?.012:.016),vol*(dir==="U"?.75:1)));
};

  <span class="k" style="background:var(--ink);color:var(--bg)">2</span><span><b>${X("Dot with number = which finger.","Punkt mit Zahl = welcher Finger.","Sayılı nokta = hangi parmak.")}</b> ${X("1 index, 2 middle, 3 ring, 4 little finger. Press just behind the fret.","1 Zeige-, 2 Mittel-, 3 Ring-, 4 kleiner Finger. Kurz vor dem Bundstäbchen drücken.","1 işaret, 2 orta, 3 yüzük, 4 serçe. Perde telinin hemen arkasına bas.")}</span>
  <span class="k" style="color:var(--accent);border-color:var(--accent)">O</span><span><b>${X("O = play open.","O = leer spielen.","O = boş çal.")}</b> ${X("Strike the string without pressing.","Saite anschlagen, aber nicht drücken.","Tele basmadan çal.")}</span>
  <span class="k" style="color:var(--warn);border-color:var(--warn)">×</span><span><b>${X("× = don't play.","× = nicht spielen.","× = çalma.")}</b> ${X("Leave this string out.","Diese Saite auslassen.","Bu teli atla.")}</span>
 </div>
 <div class="facts">
  <div><b>${X("String names","Saitennamen","Tel adları")}</b><span>${L({en:"Thick to thin: E – A – D – G – B – e. “Eddie Ate Dynamite, Good Bye Eddie.”",de:"Von dick nach dünn: E – A – D – G – H – e. „Eine Alte Dame Geht Heute einkaufen.“",tr:"Kalından inceye: E – A – D – G – B – e (Mi – La – Re – Sol – Si – Mi)."})}</span></div>
  <div><b>${X("Major and minor","Dur und Moll","Majör ve minör")}</b><span>${X("A letter alone (A) is major and sounds bright. With “m” (Am) it is minor and sounds sad. Turkish songs use a lot of minor.","Buchstabe allein (A) = Dur, klingt hell. Mit „m“ (Am) = Moll, klingt traurig. Türkische Lieder nutzen viel Moll.","Tek harf (A) majördür, parlak duyulur. “m” ile (Am) minördür, hüzünlü duyulur. Türkçe şarkılarda çok minör var.")}</span></div>
  <div><b>${X("The 7","Die 7","7'li akorlar")}</b><span>${X("A7, E7 etc. sound “unfinished” and want to move on. E7 leads nicely to Am.","A7, E7 usw. klingen „unfertig“ und wollen weiter. E7 führt schön nach Am.","A7, E7 vb. “bitmemiş” duyulur ve ilerlemek ister. E7 güzelce Am'ye gider.")}</span></div>
 </div></div></div>

strum:()=>`
<div class="panel"><h2>${X("Understanding strum patterns","Anschlagmuster verstehen","Ritim kalıplarını anlamak")}</h2><p class="lead">${X("A bar has 4 beats with an “and” between each. Count aloud: “1 and 2 and 3 and 4 and”. Your hand moves down and up all the time like a pendulum: down (↓) on numbers, up (↑) on “and”. At a gap (·) the hand still moves but misses the strings.","Ein Takt hat 4 Schläge, dazwischen jeweils ein „und“. Zähl laut: „1 und 2 und 3 und 4 und“. Die Hand geht die ganze Zeit auf und ab wie ein Pendel: runter (↓) auf den Zahlen, hoch (↑) auf dem „und“. Bei einer Lücke (·) bewegt sie sich trotzdem, trifft aber die Saiten nicht.","Bir ölçüde 4 vuruş ve aralarında “ve” var. Yüksek sesle say: “1 ve 2 ve 3 ve 4 ve”. Elin sarkaç gibi sürekli aşağı yukarı gider: sayılarda aşağı (↓), “ve”de yukarı (↑). Boşlukta (·) el yine hareket eder ama tellere değmez.")}</p>
 <div class="row"><label for="gPat">${X("Pattern","Muster","Kalıp")}</label><select id="gPat"></select><label for="gProg">${X("Chords","Akkorde","Akorlar")}</label><select id="gProg"></select></div>

<div class="two"><div class="panel"><h3 style="margin-top:0">${X("Current chord","Aktueller Akkord","Şu anki akor")}</h3><div class="diagram" id="gSDiag"></div></div>
 <div class="panel"><h3 style="margin-top:0">${X("How to practise a pattern","So übst du ein Muster","Bir kalıp nasıl çalışılır")}</h3><ol class="plain">
  <li>${X("First play the rhythm on muted strings (left hand resting lightly on them).","Erst den Rhythmus auf gedämpften Saiten spielen (linke Hand liegt locker drauf).","Önce ritmi susturulmuş tellerde çal (sol el hafifçe üstünde).")}</li>
  <li>${X("Then with one chord, without changing.","Dann mit einem Akkord, ohne zu wechseln.","Sonra tek akorla, değiştirmeden.")}</li>
  <li>${X("Then with changes, very slowly. Change already on the last “and” so beat 1 lands on time.","Dann mit Wechsel, ganz langsam. Schon auf dem letzten „und“ wechseln, damit die 1 pünktlich kommt.","Sonra geçişle, çok yavaş. 1 zamanında gelsin diye son “ve”de geçmeye başla.")}</li>

  <li>${X("On classical guitar: thumb strums down, index nail strums up, no pick.","Bei Klassikgitarre: Daumen schlägt runter, Zeigefinger-Nagel hoch, kein Plektrum.","Klasik gitarda: başparmak aşağı, işaret parmağı tırnağı yukarı, pena yok.")}</li></ol></div></div>`,

pick:()=>`
<div class="panel"><h2>${X("What does “pick a G” mean?","Was heißt „G picken“?","“G'yi parmakla çal” ne demek?")}</h2><p class="lead">${X("The left hand holds the chord (for example G) and simply stays. The right hand does not strike all strings at once, it plucks them one after another in a fixed pattern. That is picking. On classical guitar each finger has its own string:","Die linke Hand hält den Akkord (zum Beispiel G) und bleibt einfach liegen. Die rechte Hand schlägt nicht alle Saiten auf einmal an, sondern zupft sie einzeln nacheinander in einem festen Muster. Das ist Picking. Bei der klassischen Gitarre hat jeder Finger seine eigene Saite:","Sol el akoru (örneğin G) tutar ve öyle kalır. Sağ el tüm tellere birden vurmaz, belli bir kalıpla teker teker çeker. Buna parmakla çalma denir. Klasik gitarda her parmağın kendi teli vardır:")}</p>
 <div class="fingers">
  <div><i style="background:var(--p)">p</i><span><b>${X("Thumb","Daumen","Başparmak")}</b><br>${X("Bass string: E, A or D. Always the root of the chord.","Bass-Saite: E, A oder D. Immer der Grundton des Akkords.","Bas teli: E, A ya da D. Her zaman akorun kök sesi.")}</span></div>

 <p class="muted" style="margin-top:10px">${X("The letters come from Spanish: pulgar, índice, medio, anular. Almost every guitar book uses them.","Die Buchstaben kommen aus dem Spanischen: pulgar, índice, medio, anular. Fast jedes Gitarrenbuch nutzt sie.","Harfler İspanyolcadan gelir: pulgar, índice, medio, anular. Neredeyse her gitar kitabı bunları kullanır.")}</p></div>
<div class="panel"><div class="row"><label for="gPP">${X("Pattern","Muster","Kalıp")}</label><select id="gPP"></select><label for="gPC">${X("Chord","Akkord","Akor")}</label><select id="gPC"></select></div>
 <p class="muted" id="gPInfo" style="margin:8px 0 10px"></p>
 <h3>${X("As a tab","Als Tabulatur","Tab olarak")}</h3><p class="lead">${X("A tab shows the six strings as lines. The thin e string is on top, the thick E at the bottom, the opposite of a chord diagram. The number is the fret (0 = open). The coloured letter above tells which finger plucks. Read left to right.","Eine Tabulatur zeigt die 6 Saiten als Linien. Oben ist die dünne e-Saite, unten die dicke E-Saite, also umgekehrt wie im Griffbild. Die Zahl ist der Bund (0 = leer). Der farbige Buchstabe darüber sagt, welcher Finger zupft. Von links nach rechts lesen.","Tab altı teli çizgi olarak gösterir. İnce Mi üstte, kalın Mi altta, yani akor şemasının tersi. Sayı perdeyi gösterir (0 = boş). Üstteki renkli harf hangi parmağın çektiğini söyler. Soldan sağa oku.")}</p>
 <div class="scroll-x" id="gTab"></div>
 <div class="row" style="margin-top:12px"><label for="gPBpm">${X("Tempo","Tempo","Tempo")}</label><input type="range" id="gPBpm" min="40" max="140"><span class="muted" id="gPBpmVal"></span><button class="btn go" id="gPPlay">${X("Play","Abspielen","Çal")}</button><button class="btn alt" id="gPStop">${X("Stop","Stopp","Durdur")}</button></div></div>
<div class="two"><div class="panel"><h3 style="margin-top:0">${X("Chord","Akkord","Akor")}</h3><div class="diagram" id="gPDiag"></div></div>
 <div class="panel"><h3 style="margin-top:0">${X("Picking tips","Tipps fürs Zupfen","Parmakla çalma ipuçları")}</h3><ol class="plain">
  <li>${X("i, m and a rest ready on “their” strings, the thumb a bit further left on the bass strings.","i, m, a liegen schon auf „ihren“ Saiten bereit, der Daumen etwas weiter links auf den Bass-Saiten.","i, m ve a kendi tellerinde hazır bekler, başparmak biraz solda bas tellerinde.")}</li>
  <li>${X("Fingers pluck towards the palm, not upwards. The thumb pushes forward and down.","Die Finger zupfen zur Handfläche hin, nicht nach oben weg. Der Daumen drückt nach vorne-unten.","Parmaklar avuç içine doğru çeker, yukarı değil. Başparmak ileri-aşağı iter.")}</li>
  <li>${X("The hand stays still, only the fingers move.","Die Hand bleibt ruhig, nur die Finger bewegen sich.","El sabit kalır, sadece parmaklar hareket eder.")}</li>
  <li>${X("Very slow and even at first. Every note equally loud.","Erst ganz langsam und gleichmäßig. Jeder Ton gleich laut.","Önce çok yavaş ve düzenli. Her nota eşit yükseklikte.")}</li>
  <li>${X("The thumb changes string with the chord: A string for Am and C, low E for Em and G, D string for D and Dm.","Der Daumen wechselt je nach Akkord: A-Saite bei Am und C, tiefe E-Saite bei Em und G, D-Saite bei D und Dm.","Başparmak akora göre tel değiştirir: Am ve C'de La teli, Em ve G'de kalın Mi, D ve Dm'de Re teli.")}</li></ol></div></div>`,

capo:()=>`
<div class="panel"><h2>${X("What does a capo do?","Was macht ein Kapodaster?","Kapo ne işe yarar?")}</h2><p class="lead">${X("A capo is a clamp you put across all strings at one fret. It works like a new nut: all strings sound higher. Each fret raises everything by a half step. You keep playing the same easy shapes, they just sound higher.","Ein Kapodaster (Kapo) ist eine Klemme, die du quer über alle Saiten an einen Bund klemmst. Er wirkt wie ein neuer Sattel: Alle Saiten klingen höher. Jeder Bund macht alles einen Halbton höher. Du greifst weiter die gleichen einfachen Griffe, sie klingen nur höher.","Kapo, tüm tellerin üzerine bir perdede takılan bir kıskaçtır. Yeni bir eşik gibi çalışır: tüm teller daha tiz çalar. Her perde her şeyi yarım ses yükseltir. Aynı kolay akorları basmaya devam edersin, sadece daha tiz duyulur.")}</p>
 <div class="facts">
  <div><b>${X("What for?","Wozu?","Ne için?")}</b><span>${X("So a song fits your voice or the original recording without learning hard shapes.","Damit ein Lied zu deiner Stimme oder zur Original-Aufnahme passt, ohne schwere Griffe zu lernen.","Zor akorlar öğrenmeden şarkı sesine ya da orijinal kayda uysun diye.")}</span></div>
  <div><b>${X("Where to clamp?","Wo klemmen?","Nereye takılır?")}</b><span>${X("Just behind the fret wire, straight and firm enough that nothing buzzes. Retune afterwards.","Kurz vor dem Bundstäbchen, gerade und fest genug, dass nichts schnarrt. Danach kurz nachstimmen.","Perde telinin hemen arkasına, düz ve hiçbir şey cızırdamayacak kadar sıkı. Sonra akordu kontrol et.")}</span></div>
  <div><b>${X("How to count?","Wie zählen?","Nasıl sayılır?")}</b><span>${X("With a capo, count frets from the capo. The capo is now “0”. Diagrams apply from there.","Mit Kapo die Bünde ab dem Kapo neu zählen. Der Kapo ist jetzt „0“.","Kapoyla perdeleri kapodan itibaren say. Kapo artık “0”dır.")}</span></div>
  <div><b>${X("“Capo 3” on a sheet","„Kapo 3“ auf dem Blatt","Sayfada “Kapo 3”")}</b><span>${X("Capo at fret 3, then play the shapes shown above the lyrics. Don't convert anything.","Kapo in den 3. Bund, dann die Griffe spielen, die über dem Text stehen. Nicht umrechnen.","Kapo 3. perdeye, sonra sözlerin üstündeki akorları çal. Hiçbir şeyi dönüştürme.")}</span></div></div></div>
<div class="panel"><h2>${X("Capo calculator","Kapo-Rechner","Kapo hesaplayıcı")}</h2><p class="lead">${X("Choose a fret. The table shows which chord really sounds when you play a shape.","Wähle den Bund. Die Tabelle zeigt, welcher Akkord wirklich erklingt, wenn du einen Griff spielst.","Perdeyi seç. Tablo, bir akor şeklini çaldığında gerçekte hangi akorun duyulduğunu gösterir.")}</p>
 <div class="row"><label for="gCapo">${X("Capo at","Kapo im","Kapo")}</label><select id="gCapo"></select><button class="btn alt" id="gCapoPlay"></button></div>
 <div class="scroll-x" style="margin-top:12px"><table><thead><tr><th>${X("You press","Du greifst","Bastığın")}</th><th>${X("It sounds","Es klingt","Duyulan")}</th></tr></thead><tbody id="gCapoTable"></tbody></table></div>
 <h3>${X("The other way round: the song uses a hard chord","Andersrum: Das Lied hat einen schweren Akkord","Tersi: Şarkıda zor bir akor var")}</h3>
 <div class="row"><label for="gTarget">${X("Wanted chord","Gesuchter Akkord","İstenen akor")}</label><select id="gTarget"></select></div><div class="fix" id="gCapoFind"></div></div>`,

notes:()=>`
<div class="panel"><h2>${X("Notes on the guitar (first position)","Noten auf der Gitarre (1. Lage)","Gitarda notalar (birinci pozisyon)")}</h2><p class="lead">${X("Every note on the staff has a fixed place on the fretboard. Tap a note to see the string and fret and to hear it. The small 8 under the clef means the guitar sounds an octave lower than written. Nothing changes for you.","Jede Note auf den Linien hat einen festen Platz auf dem Griffbrett. Tippe eine Note an: Du siehst Saite und Bund und hörst sie. Die kleine 8 unter dem Schlüssel heißt: Die Gitarre klingt eine Oktave tiefer als geschrieben. Für dich ändert sich nichts.","Portedeki her notanın klavyede sabit bir yeri vardır. Bir notaya dokun: teli ve perdeyi gör, sesini duy. Anahtarın altındaki küçük 8, gitarın yazılandan bir oktav pes çaldığı anlamına gelir. Senin için bir şey değişmez.")}</p>

<div class="panel"><h2>${X("How long does a note last?","Wie lange klingt ein Ton?","Bir nota ne kadar sürer?")}</h2><p class="lead">${X("The shape of a note tells how many beats it lasts. Count evenly “1, 2, 3, 4”.","Die Form der Note sagt, wie viele Schläge sie dauert. Zähl gleichmäßig „1, 2, 3, 4“.","Notanın şekli kaç vuruş süreceğini söyler. Düzenli say: “1, 2, 3, 4”.")}</p>${dursHTML()}</div>`,

start(root){ bindPath(root,G.WEEKS(),"fn-g-path"); bindRoutine(root,G.ROUTINE()); bindFix(root,G.PROBS()); },
chords(root){
  const S=G.state, $=id=>root.querySelector("#"+id);
  const show=id=>{ S.chord=id; const c=G.byId[id];
    $("gChips").querySelectorAll("button").forEach(b=>b.setAttribute("aria-pressed",b.dataset.c===id));
    $("gChordDiag").innerHTML=G.chordSVG(c); $("gChordName").textContent=G.name(c);
    $("gChordSub").textContent=(c.q==="m"?X("Minor","Moll","Minör"):c.q==="7"?X("Seventh chord","Sept-Akkord","Yedili akor"):c.q==="maj7"?X("Major seventh","Major-Sept","Majör yedili"):X("Major","Dur","Majör"));
    $("gChordSteps").innerHTML=G.steps(c); $("gChordTip").textContent=c.tip(); };
  $("gChips").onclick=e=>{ const b=e.target.closest("button"); if(b){ show(b.dataset.c); G.strum(G.byId[b.dataset.c]); } };
  $("gStrum").onclick=()=>G.strum(G.byId[S.chord]);
  $("gSlow").onclick=()=>{ const c=G.byId[S.chord]; c.f.forEach((f,s)=>{ if(f>=0) pluck(G.midi(s,f),s*.45); }); };
  show(S.chord);
  const PAIRS=[["Em","Am"],["Am","E"],["Am","Dm"],["D","A"],["D","G"],["G","C"],["Am","C"],["Dm","E"]];

K.PC={do:0,"do#":1,reb:1,re:2,"re#":3,mib:3,mi:4,fa:5,"fa#":6,solb:6,sol:7,"sol#":8,lab:8,la:9,"la#":10,sib:10,si:11,

K.parse=txt=>{
  const bars=[]; let cur=[];
  txt.replace(/\n/g," | ").split(/\s+/).filter(Boolean).forEach(tok=>{
    if(tok==="|"){ if(cur.length){bars.push(cur);cur=[];} return; }
    const m=tok.match(/^([^:]+?)(?::([\d.,/]+))?$/); if(!m) return;
    let name=m[1], beats=1;
    if(m[2]){ const v=m[2].includes("/")?m[2].split("/").reduce((a,b)=>a/b):parseFloat(m[2].replace(",",".")); if(v>0) beats=v; }
    let reg="mid";
    if(/[,↓]$/.test(name)){ reg="low"; name=name.replace(/[,↓]+$/,""); }
    else if(/['’↑^]$/.test(name)){ reg="high"; name=name.replace(/['’↑^]+$/,""); }
    let key=name.toLowerCase().replace("♯","#").replace("♭","b");
    if(key==="p"||key==="pause"||key==="rest"||key==="r"||key==="sus"){ cur.push({rest:true,beats}); return; }
    // letter "b": in German it means B-flat, in English it means B natural
    let p=key==="b"?(lang==="de"?10:11):key==="h"?11:K.PC[key];
    if(p===undefined){ cur.push({bad:true,beats,label:name}); return; }
    const [lo,hi]=reg==="low"?[52,59]:reg==="high"?[71,76]:[60,70];
    let midi=null; for(let x=lo;x<=hi;x++) if(pc(x)===p){ midi=x; break; }
    if(midi===null||!K.byMidi(midi)){
      // not available in that register: take the closest playable note with the same name
      const centre=reg==="low"?56:reg==="high"?74:65, alt=K.N.filter(n=>pc(n.m)===p).sort((x,y)=>Math.abs(x.m-centre)-Math.abs(y.m-centre))[0];
      if(!alt){ cur.push({bad:true,beats,label:tok}); return; } midi=alt.m; }
    cur.push({m:midi,beats});
  });
  if(cur.length) bars.push(cur); return bars;
};

K.keyFacts=()=>`<div class="facts">
 <div><b>${X("You only need a few at first","Am Anfang brauchst du nur wenige","Başta sadece birkaçı lazım")}</b><span>${X("Thumb hole, six holes, R, A, G♯ and at the bottom E/B and F/C. Everything else is for fast runs later.","Daumenloch, 6 Löcher, R, A, G♯ und unten E/H und F/C. Alles andere ist für schnelle Läufe später.","Başparmak deliği, altı delik, R, A, G♯ ve altta E/B ile F/C. Gerisi sonradan hızlı pasajlar için.")}</span></div>
 <div><b>${X("Some keys are doubled","Manche Tasten sind doppelt","Bazı anahtarlar çift")}</b><span>${X("E and F exist for both little fingers. Both move the same pad, so something moves when you press the other side. That's correct.","E und F gibt es für den linken und rechten kleinen Finger. Beide bewegen dasselbe Polster. Darum bewegt sich etwas, wenn du die andere Seite drückst. Das ist richtig so.","E ve F iki serçe parmak için de var. İkisi de aynı pedi hareket ettirir, bu yüzden diğer tarafa basınca bir şey oynar. Bu doğrudur.")}</span></div>
 <div><b>${X("Rings move other pads","Die Ringe bewegen andere Polster","Halkalar başka pedleri hareket ettirir")}</b><span>${X("Covering a hole with a ring pushes the ring down. Via a rod it closes a pad somewhere else.","Deckst du ein Loch mit Ring zu, drückst du den Ring mit runter. Über eine Stange schließt er ein Polster an anderer Stelle.","Halkalı bir deliği kapatınca halka da iner. Bir çubuk üzerinden başka bir yerde bir pedi kapatır.")}</span></div>
 <div><b>${X("Two names per key","Zwei Namen pro Taste","Her anahtara iki isim")}</b><span>${X("E/B means: without R you get E, with R the same fingering gives B (twelve notes higher). Same for F/C.","E/H heißt: ohne R kommt E, mit R derselbe Griff als H (zwölf Töne höher). Genauso F/C.","E/B şu demek: R olmadan Mi, R ile aynı pozisyon Si (on iki ses tiz). F/C de aynı.")}</span></div></div>`;

<div class="two">
 <div class="panel"><h2>${X("Daily practice (20 min)","Tägliche Übe-Runde (20 Min.)","Günlük çalışma (20 dk)")}</h2><p class="lead">${X("Better 20 minutes every day than two hours once a week. Lips tire quickly. When they shake: rest, don't push. Two short sessions beat one long one.","Lieber jeden Tag 20 Minuten als einmal pro Woche zwei Stunden. Die Lippen werden schnell müde. Wenn sie zittern: Pause. Zwei kurze Runden sind besser als eine lange.","Haftada bir iki saat yerine her gün 20 dakika. Dudaklar çabuk yorulur. Titrediğinde mola ver, zorlama. İki kısa seans, bir uzun seanstan iyidir.")}</p>${routineHTML()}</div>
 <div class="panel"><h2>${X("Air challenge","Luft-Challenge","Nefes meydan okuması")}</h2><p class="lead">${X("Play a calm tone and press Start. When the tone ends, press Stop. How long can you hold it steady? Pros manage 20 to 30 seconds. At the start, 8 seconds is great.","Spiel einen ruhigen Ton und drück „Start“. Wenn der Ton aufhört, „Stopp“. Wie lange hältst du ihn gerade? Profis schaffen 20 bis 30 Sekunden. Für den Anfang sind 8 Sekunden super.","Sakin bir ses çal ve Başla'ya bas. Ses bitince Durdur'a bas. Ne kadar düz tutabiliyorsun? Profesyoneller 20-30 saniye tutar. Başta 8 saniye harika.")}</p>
  <div class="row" style="justify-content:space-between"><div class="clock" id="kAirClock">0.0 s</div><button class="btn go" id="kAirBtn">${X("Start","Start","Başla")}</button></div><p class="muted" id="kAirBest" style="margin-top:8px"></p>
  <h2 style="margin-top:22px">${X("Tongue: how a tone starts","Zunge: so beginnt ein Ton","Dil: ses nasıl başlar")}</h2><p class="lead" style="margin-bottom:0">${X("Rest the tongue tip lightly on the reed, build air pressure, then release the tongue as in “dee”. Don't slap the reed, that gives hard, squeaky starts.","Zungenspitze leicht ans Blatt legen, Luftdruck aufbauen, dann die Zunge wegnehmen wie bei „dii“. Nicht gegen das Blatt schlagen, das gibt harte, quietschige Einsätze.","Dil ucunu hafifçe kamışa koy, hava basıncı oluştur, sonra “dii” der gibi dili çek. Kamışa vurma, bu sert ve ciyaklı başlangıçlar yapar.")}</p></div>
</div>
<div class="panel"><h2>${X("Problem? Here's the fix","Problem? Hier die Lösung","Sorun mu var? Çözümü burada")}</h2>${fixHTML(K.PROBS())}</div>
<div class="two">
 <div class="panel"><h2>${X("Assembling","Zusammenbauen","Birleştirme")}</h2><ol class="plain">
  <li>${X("If the corks are stiff, rub in a little cork grease first.","Korken vorher mit etwas Korkfett einreiben, wenn sie schwer gehen.","Mantarlar sıkıysa önce biraz mantar yağı sür.")}</li>
  <li>${X("Twist the lower joint onto the bell. Hold parts by the body, not the keys.","Unteres Teil auf den Becher drehen. Teile am Körper anfassen, nicht an den Klappen.","Alt gövdeyi kalağa çevirerek tak. Parçaları gövdeden tut, anahtarlardan değil.")}</li>
  <li>${X("Twist the upper joint on while pressing its rings, so the bridge key lifts and nothing bends. The levers must line up.","Oberes Teil aufdrehen und dabei die Ringe drücken, damit sich die Verbindungsklappe hebt und nichts verbiegt. Die Hebel müssen übereinander liegen.","Üst gövdeyi takarken halkalarına bas ki köprü anahtarı kalksın ve hiçbir şey eğilmesin. Kollar hizalanmalı.")}</li>
  <li>${X("Add the barrel, then the mouthpiece.","Birne aufsetzen, dann das Mundstück.","Fıçıyı, sonra ağızlığı tak.")}</li>
  <li>${X("Wet the reed briefly in the mouth. Flat side on the mouthpiece, tip level with the mouthpiece tip. Ligature over it, tighten only lightly.","Blatt kurz im Mund anfeuchten. Flache Seite aufs Mundstück, Spitze bündig mit der Mundstückspitze. Blattschraube darüber, nur leicht anziehen.","Kamışı ağızda kısaca ıslat. Düz tarafı ağızlığa, ucu ağızlık ucuyla aynı hizada. Bileziği üstüne tak, hafifçe sık.")}</li>
  <li>${X("The reed faces down towards the lower lip, in line with the thumb hole at the back.","Das Blatt zeigt nach unten zur Unterlippe, in einer Linie mit dem Daumenloch hinten.","Kamış aşağıya, alt dudağa bakar, arkadaki başparmak deliğiyle aynı hizada.")}</li></ol></div>
 <div class="panel"><h2>${X("After playing","Nach dem Spielen","Çaldıktan sonra")}</h2><ol class="plain">
  <li>${X("Take the reed off, wipe it, let it dry flat in a reed case. Never leave it on the mouthpiece.","Blatt abnehmen, abwischen, flach im Blattetui trocknen lassen. Nie auf dem Mundstück lassen.","Kamışı çıkar, sil, kamış kutusunda düz kurut. Asla ağızlıkta bırakma.")}</li>
  <li>${X("Pull the swab through each part 2 to 3 times, from the top end.","Jedes Teil 2 bis 3 Mal mit dem Durchzieher trocknen, vom oberen Ende her.","Her parçadan temizleme bezini 2-3 kez üstten geçir.")}</li>
  <li>${X("Rinse the mouthpiece with lukewarm water and dry it with a lint-free cloth. No hot water.","Mundstück mit lauwarmem Wasser ausspülen und fusselfrei trocknen. Kein heißes Wasser.","Ağızlığı ılık suyla durula, tüy bırakmayan bezle kurula. Sıcak su yok.")}</li>
  <li>${X("Lay the parts loosely in the case. Leave the case open briefly so it dries.","Teile locker in den Koffer legen. Koffer kurz offen lassen.","Parçaları kutuya gevşekçe koy. Kuruması için kutuyu biraz açık bırak.")}</li>
  <li>${X("Rotate several reeds. Throw away a reed with a crack or frayed tip.","Mehrere Blätter abwechselnd spielen. Ein Blatt mit Riss sofort wegwerfen.","Birkaç kamışı sırayla kullan. Çatlak ya da ucu yıpranmış kamışı at.")}</li></ol></div>
</div>
<div class="panel"><h2>${X("The Turkish sound (from about week 8)","Der türkische Klang (ab etwa Woche 8)","Türk sesi (yaklaşık 8. haftadan itibaren)")}</h2><p class="lead">${X("Start these only once a calm, straight tone comes reliably. Otherwise you build in a wobble that is hard to remove.","Erst wenn ein ruhiger, gerader Ton sicher kommt. Sonst gewöhnst du dir ein Wackeln an, das schwer wieder weggeht.","Bunlara ancak sakin, düz bir ses güvenle çıkınca başla. Yoksa sonradan zor giden bir titreme alışkanlığı edinirsin.")}</p>
 <div class="facts">
  <div><b>${X("Listen a lot","Viel hören","Bolca dinle")}</b><span>${X("Listen to G clarinet in Turkish music every day. The ear learns the sound before the fingers can.","Hör dir Sol-Klarinette in türkischer Musik jeden Tag an. Das Ohr lernt den Klang vor den Fingern.","Her gün Türk müziğinde Sol klarnet dinle. Kulak sesi parmaklardan önce öğrenir.")}</span></div>
  <div><b>${X("Vibrato","Vibrato","Vibrato")}</b><span>${X("A light, even wave in the tone, from the lower jaw with tiny movement. Practise slowly, e.g. 4 waves per beat at tempo 60.","Ein leichtes, gleichmäßiges Wellen im Ton, aus dem Unterkiefer, ganz wenig Bewegung. Erst langsam, z. B. 4 Wellen pro Schlag bei Tempo 60.","Seste hafif, düzenli bir dalga, alt çeneden çok az hareketle. Yavaş çalış, örneğin tempo 60'ta vuruş başına 4 dalga.")}</span></div>
  <div><b>${X("Sliding","Gleiten","Kaydırma")}</b><span>${X("Bend the tone up or down by changing lip and jaw slightly or rolling a finger slowly off a hole. Open mouthpieces and soft reeds help.","Den Ton nach oben oder unten ziehen, indem du Lippe und Kiefer leicht veränderst oder einen Finger langsam vom Loch rollst. Offene Mundstücke und weiche Blätter helfen.","Dudağı ve çeneyi hafifçe değiştirerek ya da parmağı delikten yavaşça kaydırarak sesi yukarı ya da aşağı bük. Açık ağızlıklar ve yumuşak kamışlar yardımcı olur.")}</span></div>
  <div><b>${X("Makam","Makam","Makam")}</b><span>${X("Turkish scales have notes between the piano keys. That comes much later. Learn the regular notes cleanly first.","Türkische Tonleitern haben Töne zwischen den Klaviertasten. Das kommt viel später. Erst die normalen Töne sauber lernen.","Türk makamlarında piyano tuşlarının arasında sesler vardır. Bu çok sonra gelir. Önce normal sesleri temiz öğren.")}</span></div></div></div>`,

read:()=>`
<div class="panel"><h2>${X("Where is the note? (register)","Wo steht der Ton? (Lage)","Nota nerede? (bölge)")}</h2><p class="lead">${X("On sheet music the height of a note tells which note and register is meant. The higher on the lines, the higher you play. The same note name exists twice: once below the lines (middle) and once inside the lines (high). Tap a note.","Auf dem Notenblatt zeigt die Höhe der Note, welcher Ton und welche Lage gemeint ist. Je höher auf den Linien, desto höher spielst du. Den gleichen Namen gibt es zweimal: unter den Linien (mittel) und mitten in den Linien (hoch). Tippe eine Note an.","Notada notanın yüksekliği hangi ses ve bölge olduğunu gösterir. Çizgilerde ne kadar yukarıdaysa o kadar tiz çalarsın. Aynı ses adı iki kez vardır: çizgilerin altında (orta) ve çizgilerin içinde (tiz). Bir notaya dokun.")}</p>
 <div class="scroll-x" id="kStaff"></div>
 <div class="tool" style="margin-top:14px"><div class="diagram" id="kRDiag"></div><div><div class="row" style="align-items:baseline"><div class="big" id="kRName"></div><div class="muted" id="kRSub"></div></div><ol class="steps" id="kRSteps"></ol><div class="row" style="margin-top:12px"><button class="btn alt" id="kRPlay">${X("Hear the note","Ton anhören","Sesi dinle")}</button></div></div></div>
 <p class="muted" style="margin-top:12px">${X("↓ = low register (below the lines, right hand joins) · no arrow = middle · ↑ = high register (thumb also presses R). Colours: orange low, blue middle, gold high.","↓ = tiefe Lage (unter den Linien, rechte Hand macht mit) · ohne Pfeil = mittlere Lage · ↑ = hohe Lage (Daumen drückt zusätzlich R). Farben: orange tief, blau mittel, gold hoch.","↓ = pes bölge (çizgilerin altında, sağ el de katılır) · ok yok = orta · ↑ = tiz bölge (başparmak R'ye de basar). Renkler: turuncu pes, mavi orta, altın tiz.")}</p></div>
<div class="panel"><h2>${X("How long do I hold the note?","Wie lange halte ich den Ton?","Sesi ne kadar tutarım?")}</h2><p class="lead">${X("The shape of a note tells how many beats you hold it. Count evenly “1, 2, 3, 4” like a clock. A bar (between two vertical lines) usually has 4 beats.","Die Form der Note sagt, wie viele Schläge du den Ton hältst. Zähl gleichmäßig „1, 2, 3, 4“ wie eine Uhr. Ein Takt (zwischen zwei senkrechten Strichen) hat meist 4 Schläge.","Notanın şekli sesi kaç vuruş tutacağını söyler. Saat gibi düzenli say: “1, 2, 3, 4”. Bir ölçü (iki dikey çizgi arası) genelde 4 vuruştur.")}</p>${dursHTML()}</div>`,

tips:()=>`<div class="facts">
 <div><b>${X("1. Without the clarinet first","1. Erst ohne Klarinette","1. Önce klarnetsiz")}</b><span>${X("Put only mouthpiece and barrel together. Take the whole clarinet only when a steady tone comes here.","Nur Mundstück und Birne zusammenstecken. Erst wenn hier ein gerader Ton kommt, die ganze Klarinette nehmen.","Sadece ağızlık ve fıçıyı birleştir. Burada düz bir ses çıkınca bütün klarneti al.")}</span></div>
 <div><b>${X("2. Lower lip","2. Unterlippe","2. Alt dudak")}</b><span>${X("Lower lip slightly over the lower teeth, the reed rests on it. Upper teeth gently on top of the mouthpiece.","Unterlippe leicht über die unteren Zähne, das Blatt liegt darauf. Obere Zähne sanft oben aufs Mundstück.","Alt dudak alt dişlerin üstüne hafifçe gelir, kamış onun üstünde durur. Üst dişler ağızlığın üstüne nazikçe.")}</span></div>
 <div><b>${X("3. How far in?","3. Wie tief rein?","3. Ne kadar içeri?")}</b><span>${X("Start with little mouthpiece and take more bit by bit. Just before it squeaks is your spot, usually about 1 to 1.5 cm.","Mit wenig Mundstück starten und Stück für Stück mehr nehmen. Kurz bevor es quietscht, ist dein Punkt, meist etwa 1 bis 1,5 cm.","Az ağızlıkla başla ve azar azar artır. Ciyaklamadan hemen önceki nokta seninkidir, genelde yaklaşık 1-1,5 cm.")}</span></div>
 <div><b>${X("4. Don't bite","4. Nicht beißen","4. Isırma")}</b><span>${X("Firm enough that the mouthpiece doesn't slip, but never squeeze the reed shut. With a soft reed and open mouthpiece barely press. Only air = pressing too hard.","Fest genug, dass das Mundstück nicht rutscht, aber das Blatt nie zudrücken. Bei weichem Blatt und offenem Mundstück kaum drücken. Nur Luft = zu fest gedrückt.","Ağızlık kaymayacak kadar sıkı, ama kamışı asla kapatma. Yumuşak kamış ve açık ağızlıkla neredeyse hiç bastırma. Sadece hava = çok sert basıyorsun.")}</span></div>
 <div><b>${X("5. Air","5. Luft","5. Hava")}</b><span>${X("Fast and steady, like blowing out a candle far away. No puffed cheeks. Mouth corners firm.","Schnell und gleichmäßig, wie eine Kerze weit weg auspusten. Keine dicken Backen. Mundwinkel fest.","Hızlı ve düzenli, uzaktaki bir mumu söndürür gibi. Yanakları şişirme. Dudak kenarları sıkı.")}</span></div>
 <div><b>${X("6. Holes fully closed","6. Löcher ganz zu","6. Delikler tam kapalı")}</b><span>${X("If only certain notes squeak, a finger isn't sealing a hole. Lay the fingertip flat.","Quietscht es nur bei bestimmten Tönen, deckt ein Finger ein Loch nicht ganz ab. Fingerkuppe flach drauf.","Sadece bazı seslerde ciyaklıyorsa bir parmak deliği tam kapatmıyor. Parmak ucunu düz koy.")}</span></div>
 <div><b>${X("7. Breathing for long phrases","7. Atmen für lange Phrasen","7. Uzun cümleler için nefes")}</b><span>${X("At first 5 seconds is normal; it improves as the embouchure seals better. Players breathe in short gaps between phrases. Circular breathing (cheek air while inhaling through the nose) is for much later.","Am Anfang sind 5 Sekunden normal; es wird besser, wenn der Ansatz dichter wird. Profis atmen in kurzen Lücken zwischen den Phrasen. Zirkularatmung (Wangenluft, während man durch die Nase einatmet) kommt viel später.","Başta 5 saniye normaldir; dudak daha iyi kapattıkça gelişir. Müzisyenler cümleler arasındaki kısa boşluklarda nefes alır. Döngüsel nefes (burundan alırken yanaktaki havayı kullanmak) çok sonra gelir.")}</span></div></div>`
};

K.bind={
start(root){
  bindPath(root,K.WEEKS(),"fn-k-path"); bindRoutine(root,K.ROUTINE()); bindFix(root,K.PROBS());
  const $=id=>root.querySelector("#"+id); let raf=null,t0=0,best=store.get("fn-k-air",0);
  const fmt=s=>s.toFixed(1)+" s";
  const showBest=()=>$("kAirBest").textContent=best?fill(X("Your record: {s} seconds","Dein Rekord: {s} Sekunden","Rekorun: {s} saniye"),{s:best.toFixed(1)}):X("No record yet.","Noch kein Rekord.","Henüz rekor yok.");
  $("kAirBtn").onclick=()=>{ if(raf){ cancelAnimationFrame(raf); raf=null; const s=(performance.now()-t0)/1000; if(s>best){ best=s; store.set("fn-k-air",best); } showBest(); $("kAirBtn").textContent=X("Start","Start","Başla"); return; }
    t0=performance.now(); $("kAirBtn").textContent=X("Stop","Stopp","Durdur");
    const run=()=>{ $("kAirClock").textContent=fmt((performance.now()-t0)/1000); raf=requestAnimationFrame(run); }; run();
    running.add(()=>{ if(raf){cancelAnimationFrame(raf); raf=null;} }); };
  showBest();
},
practice(root){
  const S=K.state, $=id=>root.querySelector("#"+id), LV=K.LEVELS(); if(S.level>=LV.length) S.level=0;
  let hold=0, smooth=[];
  const status=(txt,cls="")=>{ $("kStatus").textContent=txt; $("kStatus").className="status "+cls; };
  const draw=()=>{ const n=K.byId[LV[S.level].notes[S.idx]];
    $("kLevels").innerHTML=LV.map((l,i)=>`<button class="chip" data-l="${i}" aria-pressed="${i===S.level}" style="font-size:.85rem;padding:6px 11px">${l.n}</button>`).join("");
    $("kDiag").innerHTML=K.svg(n.k); $("kSteps").innerHTML=K.steps(n.k);
    $("kName").textContent=K.nm(n.m);
    $("kSub").textContent=`(${K.sub(n.m)}) · ${K.regName(n.m)} · ${X("sounds","klingt","duyulan")} ${noteName(n.m+K.SHIFT)}`;
    $("kChips").innerHTML=LV[S.level].notes.map((id,i)=>`<button class="chip ${S.done.has(i)&&i!==S.idx?"done":""}" data-i="${i}" aria-pressed="${i===S.idx}">${K.nm(K.byId[id].m)}</button>`).join(""); };
  const next=()=>{ S.idx=(S.idx+1)%LV[S.level].notes.length; if(S.idx===0) S.done.clear(); hold=0; draw(); };
  $("kLevels").onclick=e=>{ const b=e.target.closest("button"); if(!b) return; S.level=+b.dataset.l; store.set("fn-k-level",S.level); S.idx=0; S.done.clear(); draw(); status(X("New level. Look at the fingering.","Neue Stufe. Schau dir den Griff an.","Yeni seviye. Parmak pozisyonuna bak.")); };
  $("kChips").onclick=e=>{ const b=e.target.closest("button"); if(!b) return; S.idx=+b.dataset.i; hold=0; draw(); status(X("Look at the fingering and play the note.","Schau dir den Griff an und spiel den Ton.","Parmak pozisyonuna bak ve sesi çal.")); };
  $("kPlay").onclick=()=>K.tone(K.byId[LV[S.level].notes[S.idx]].m,1.4);
  const onPitch=f=>{ if(f<0){ hold=0; smooth=[]; $("kHeard").innerHTML="&nbsp;"; return; }
    smooth.push(f); if(smooth.length>5) smooth.shift(); const fs=[...smooth].sort((a,b)=>a-b)[smooth.length>>1];
    const n=K.byId[LV[S.level].notes[S.idx]], w=69+12*Math.log2(fs/440)-K.SHIFT, diff=(w-n.m)*100, near=Math.round(w);
    $("kHeard").textContent=fill(X("Heard: {n} · {h} Hz","Gehört: {n} · {h} Hz","Duyulan: {n} · {h} Hz"),{n:K.nm(near),h:fs.toFixed(0)});
    if(Math.abs(diff)>250){ setNeedle($("kNeedle"),diff>0?100:-100); status(diff>0?X("Different note, too high. Check the fingering.","Anderer Ton, zu hoch. Griff prüfen.","Farklı ses, çok tiz. Parmakları kontrol et."):X("Different note, too low. Check the fingering.","Anderer Ton, zu tief. Griff prüfen.","Farklı ses, çok pes. Parmakları kontrol et."),"warn"); hold=0; return; }
    setNeedle($("kNeedle"),diff*2);
    if(Math.abs(diff)<=30){ if(!hold) hold=performance.now(); const held=(performance.now()-hold)/1000;
      status(held>1.2?X("Correct! Well done.","Richtig! Weiter so.","Doğru! Aferin."):X("Good, hold it…","Gut, halten…","İyi, tut…"),"ok");
      if(held>1.2){ S.done.add(S.idx); hold=performance.now()+1e9; const t=setTimeout(next,600); running.add(()=>clearTimeout(t)); } }
    else { hold=0; status(diff>0?X("A bit high: relax the lip.","Etwas zu hoch: Lippe lockerer.","Biraz tiz: dudağı gevşet."):X("A bit low: lip slightly firmer, more air.","Etwas zu tief: Lippe etwas fester, mehr Luft.","Biraz pes: dudak biraz sıkı, daha çok hava."),"warn"); } };
  $("kMic").onclick=async()=>{ if(mic.on){ mic.stop(); $("kMic").textContent=X("Start listening","Zuhören starten","Dinlemeye başla"); return; }
    const ok=await mic.start(onPitch,90,1100); if(!ok){ $("kMicNote").textContent=micBlocked(); $("kMicNote").hidden=false; return; }
    $("kMicNote").hidden=true; $("kMic").textContent=X("Stop listening","Zuhören stoppen","Dinlemeyi durdur"); status(X("Listening. Play the note.","Ich höre zu. Spiel den Ton.","Dinliyorum. Sesi çal.")); };
  draw(); setNeedle($("kNeedle"),0); status(X("Press “Start listening”","Drück auf „Zuhören starten“","“Dinlemeye başla”ya bas"));
},
fingers(root){
  const S=K.state, $=id=>root.querySelector("#"+id);
  const draw=()=>{ const n=K.byId[S.fing];
    $("kChart").innerHTML=K.N.map(x=>`<tr class="click" data-id="${x.id}" tabindex="0" aria-selected="${x.id===S.fing}"><td class="strong">${K.nm(x.m)}</td><td>${K.sub(x.m)}</td><td>${K.regName(x.m)}${x.k.includes("R")?" (R)":""}</td><td>${noteName(x.m+K.SHIFT)}</td></tr>`).join("");
    $("kFDiag").innerHTML=K.svg(n.k); $("kFSteps").innerHTML=K.steps(n.k); $("kFTitle").textContent=fill(X("How to finger {n}:","So greifst du {n}:","{n} nasıl basılır:"),{n:K.nm(n.m)}); };
  const act=e=>{ const r=e.target.closest("tr[data-id]"); if(!r) return; S.fing=r.dataset.id; draw(); K.tone(K.byId[S.fing].m,1.2); };
  $("kChart").onclick=act; $("kChart").onkeydown=e=>{ if(e.key==="Enter") act(e); }; draw();
},
read(root){
  const S=K.state, $=id=>root.querySelector("#"+id);
  const col=m=>m<60?"var(--rh)":m>=71?"var(--hi)":"var(--lh)";
  const show=id=>{ S.read=id; const n=K.byId[id], i=K.N.indexOf(n);
    $("kStaff").innerHTML=staffSVG(K.N.map(x=>({w:x.m,label:K.nm(x.m),color:col(x.m)})),i,{dx:44});
    $("kRDiag").innerHTML=K.svg(n.k); $("kRSteps").innerHTML=K.steps(n.k); $("kRName").textContent=K.nm(n.m);
    $("kRSub").textContent=`(${K.sub(n.m)}) · ${K.regName(n.m)} · ${X("sounds","klingt","duyulan")} ${noteName(n.m+K.SHIFT)}`; };
  const act=e=>{ const g=e.target.closest(".staff-note"); if(!g) return; const id=K.N[+g.dataset.i].id; show(id); K.tone(K.byId[id].m,1.2); };
  $("kStaff").onclick=act; $("kStaff").onkeydown=e=>{ if(e.key==="Enter"||e.key===" "){ e.preventDefault(); act(e); } };
  $("kRPlay").onclick=()=>K.tone(K.byId[S.read].m,1.2); show(S.read);
  bindDurs(root,d=>K.tone(67,d));
},
songs(root){
  const S=K.state, $=id=>root.querySelector("#"+id); let flat=[], timers=[];
  $("kSongSel").innerHTML=`<option value="-1">–</option>`+K.SONGS.map((s,i)=>`<option value="${i}">${typeof s.n==="function"?s.n():s.n}</option>`).join("");
  $("kSongSel").value=S.song; $("kBpm").value=S.bpm; $("kBpmVal").textContent=S.bpm;
  const label=n=>n.rest?X("Rest","Pause","Sus"):n.bad?n.label:K.nm(n.m);
  const beatsTxt=b=>b===1?X("1 beat","1 Schlag","1 vuruş"):b<1?X("½ beat","½ Schlag","½ vuruş"):fill(X("{n} beats","{n} Schläge","{n} vuruş"),{n:b});
  const render=()=>{ const bars=K.parse($("kSongText").value); flat=[];
    $("kSong").innerHTML=bars.map((bar,bi)=>`<div class="sbar"><span class="num">${bi+1}</span>${bar.map(n=>{ const i=flat.push(n)-1;
      return `<button class="nb ${n.rest?"rest":n.bad?"bad":""}" style="--b:${Math.max(.5,n.beats)}" data-i="${i}"><b>${label(n)}</b><span class="muted small">${n.bad?X("unknown","unbekannt","bilinmiyor"):beatsTxt(n.beats)}</span></button>`; }).join("")}</div>`).join("")||`<p class="muted">${X("No notes yet. Type for example: Do Re Mi","Noch keine Töne. Schreib z. B.: Do Re Mi","Henüz ses yok. Örneğin yaz: Do Re Mi")}</p>`; };
  const now=i=>{ root.querySelectorAll(".nb.cur").forEach(b=>b.classList.remove("cur")); const b=root.querySelector(`.nb[data-i="${i}"]`); if(b) b.classList.add("cur");
    const n=flat[i]; if(!n) return;
    if(n.rest||n.bad){ $("kNpTitle").textContent=n.rest?X("Rest: don't play, take a quick breath","Pause: nichts spielen, kurz atmen","Sus: çalma, kısa nefes al"):X("I don't know this note","Diesen Ton kenne ich nicht","Bu sesi tanımıyorum"); $("kNpDiag").innerHTML=""; $("kNpSteps").innerHTML=""; }
    else { const k=K.byMidi(n.m).k; $("kNpTitle").textContent=`${K.nm(n.m)} · ${beatsTxt(n.beats)}`; $("kNpDiag").innerHTML=K.svg(k); $("kNpSteps").innerHTML=K.steps(k); }
    const nx=flat.slice(i+1).find(x=>!x.rest&&!x.bad); $("kNpNext").textContent=nx?X("Next:","Danach:","Sonra:")+" "+label(nx):X("End of song","Ende des Lieds","Şarkının sonu"); };
  const stop=()=>{ timers.forEach(clearTimeout); timers=[]; $("kSPlay").textContent=X("Play","Vorspielen","Çal"); };
  $("kSPlay").onclick=()=>{ stop(); ctx(); const beat=60/S.bpm; let t=0;
    for(let k=0;k<4;k++){ timers.push(setTimeout(()=>click(k===0),t*1000)); t+=beat; }
    flat.forEach((n,i)=>{ const at=t; timers.push(setTimeout(()=>{ now(i); if(!n.rest&&!n.bad) K.tone(n.m,n.beats*beat*.9); },at*1000)); t+=n.beats*beat; });
    timers.push(setTimeout(stop,t*1000)); $("kSPlay").textContent=X("Playing…","Läuft…","Çalıyor…"); running.add(stop); };
  $("kSStop").onclick=stop;
  $("kSong").onclick=e=>{ const b=e.target.closest(".nb"); if(!b) return; const i=+b.dataset.i; now(i); const n=flat[i]; if(n&&!n.rest&&!n.bad) K.tone(n.m,1.1); };
  $("kBpm").oninput=()=>{ S.bpm=+$("kBpm").value; $("kBpmVal").textContent=S.bpm; };
  $("kSongSel").onchange=()=>{ S.song=+$("kSongSel").value; if(S.song>=0){ $("kSongText").value=K.SONGS[S.song].txt; store.set("fn-k-song",$("kSongText").value); } stop(); render(); now(0); };
  let typing; $("kSongText").oninput=()=>{ clearTimeout(typing); typing=setTimeout(()=>{ store.set("fn-k-song",$("kSongText").value); render(); },250); };
  $("kSongText").value=store.get("fn-k-song",K.SONGS[0].txt); render(); now(0);
},
tuner(root){
  const $=id=>root.querySelector("#"+id);
  $("kTMic").onclick=async()=>{ if(mic.on){ mic.stop(); $("kTMic").textContent=X("Start listening","Zuhören starten","Dinlemeye başla"); return; }
    const ok=await mic.start(f=>{ if(f<0){ $("kTHz").innerHTML="&nbsp;"; return; } const w=69+12*Math.log2(f/440)-K.SHIFT, near=Math.round(w), cents=(w-near)*100;
      $("kTName").textContent=K.nm(near); $("kTSub").textContent=`${X("written","geschrieben","yazılan")} ${noteName(near)} · ${cents>0?"+":""}${cents.toFixed(0)} cent`;
      $("kTHz").textContent=`${f.toFixed(1)} Hz · ${X("sounds","klingt","duyulan")} ${noteName(near+K.SHIFT)}`; setNeedle($("kTNeedle"),cents); },90,1100);
    if(!ok){ $("kTNote").textContent=micBlocked(); $("kTNote").hidden=false; return; }
    $("kTNote").hidden=true; $("kTMic").textContent=X("Stop listening","Zuhören stoppen","Dinlemeyi durdur"); };
  setNeedle($("kTNeedle"),0);
},
tips(){}
};

/* =====================================================================
   APP SHELL
   ===================================================================== */
const INST={g:G,k:K};
let inst="g"; // guitar is the default instrument on every visit
const hash=(location.hash||"").replace("#","");
if(hash==="clarinet"||hash==="klarinette"||hash==="klarnet") inst="k";
if(hash==="guitar"||hash==="gitarre"||hash==="gitar") inst="g";
const app=document.getElementById("app");
function render(){
  stopAll();
  const M=INST[inst], views=M.VIEWS();
  document.documentElement.lang=lang;
  document.getElementById("instSeg").innerHTML=[["g",X("Guitar","Gitarre","Gitar")],["k",X("Clarinet","Klarinette","Klarnet")]].map(([id,n])=>`<button data-inst="${id}" aria-pressed="${id===inst}">${n}</button>`).join("");
  document.getElementById("langSeg").innerHTML=LANGS.map(([id,n])=>`<button data-lang="${id}" aria-pressed="${id===lang}" lang="${id}">${n}</button>`).join("");
  app.innerHTML=`<header><h1>${M.title()}</h1><p class="intro">${M.intro()}</p></header>
    <nav class="tabs" role="tablist">${views.map(([id,n])=>`<button role="tab" data-view="${id}" aria-selected="${id===M.state.view}">${n}</button>`).join("")}</nav>
    <section id="view" class="wrap">${M.render[M.state.view]()}</section>`;
  M.bind[M.state.view](app.querySelector("#view"));
  document.getElementById("foot").textContent=X("First Notes · free and open source. Sounds are generated in your browser. The microphone is analysed locally only; nothing is sent or stored.","First Notes · frei und Open Source. Töne werden im Browser erzeugt. Das Mikrofon wird nur lokal ausgewertet, nichts wird gesendet oder gespeichert.","First Notes · ücretsiz ve açık kaynak. Sesler tarayıcında üretilir. Mikrofon sadece yerel olarak işlenir; hiçbir şey gönderilmez ya da saklanmaz.");
}
app.addEventListener("click",e=>{ const b=e.target.closest(".tabs button"); if(!b) return; INST[inst].state.view=b.dataset.view; render(); });
document.getElementById("instSeg").addEventListener("click",e=>{ const b=e.target.closest("button"); if(!b||b.dataset.inst===inst) return; inst=b.dataset.inst; render(); window.scrollTo(0,0); });
document.getElementById("langSeg").addEventListener("click",e=>{ const b=e.target.closest("button"); if(!b||b.dataset.lang===lang) return; lang=b.dataset.lang; store.set("fn-lang",lang); render(); });
render();
})();
</script>
