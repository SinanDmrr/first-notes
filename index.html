];
N.PROBS=()=>[
 {p:X("Only air, no tone","Nur Luft, kein Ton","Sadece hava, ses yok"),f:[[X("Angle not found yet","Winkel noch nicht gefunden","Açı henüz bulunamadı"),X("Change the angle in tiny steps, also turn the ney slightly around its axis.","Winkel in winzigen Schritten ändern, die Ney auch leicht um ihre Achse drehen.","Açıyı çok küçük adımlarla değiştir, neyi kendi ekseninde de hafifçe döndür.")],[X("Lip covers too much or too little","Lippe deckt zu viel oder zu wenig ab","Dudak çok fazla ya da çok az kapatıyor"),X("About half of the opening should be covered by the lip.","Etwa die Hälfte der Öffnung soll die Lippe abdecken.","Açıklığın yaklaşık yarısını dudak kapatmalı.")],[X("Airstream too wide","Luftstrom zu breit","Hava akımı çok geniş"),X("Purse the lips as for whistling and make the stream thin.","Lippen wie zum Pfeifen spitzen und den Strom dünn machen.","Dudakları ıslık gibi büz ve akımı incelt.")]]},
 {p:X("Tone jumps up an octave","Ton springt eine Oktave hoch","Ses bir oktav tize atlıyor"),f:[[X("Too much air","Zu viel Luft","Çok fazla hava"),X("Blow more gently and slower.","Sanfter und langsamer blasen.","Daha yumuşak ve yavaş üfle.")],[X("Lips too tight","Lippen zu fest","Dudaklar çok sıkı"),X("Relax the lips and widen the airstream a little.","Lippen lockern, Luftstrom etwas breiter.","Dudakları gevşet, hava akımını biraz genişlet.")]]},
 {p:X("Low notes won't come","Tiefe Töne kommen nicht","Pes sesler çıkmıyor"),f:[[X("A hole is leaking","Ein Loch ist undicht","Bir delik kaçırıyor"),X("Cover with the flat part of the fingers, check hole 6 and the thumb.","Mit dem flachen Fingerteil abdecken, Loch 6 und Daumen prüfen.","Parmağın düz kısmıyla kapat, 6. deliği ve başparmağı kontrol et.")],[X("Breath too strong","Atem zu stark","Nefes çok güçlü"),X("Low notes need very soft, wide breath.","Tiefe Töne brauchen sehr sanften, breiten Atem.","Pes sesler çok yumuşak, geniş nefes ister.")]]},
 {p:X("I get dizzy","Mir wird schwindelig","Başım dönüyor"),f:[[X("Normal at the start","Am Anfang normal","Başta normal"),X("You blow out a lot of air. Pause, breathe normally, sit down.","Du bläst viel Luft aus. Pause, normal atmen, hinsetzen.","Çok hava üflüyorsun. Mola ver, normal nefes al, otur.")],[X("Too long without break","Zu lange ohne Pause","Çok uzun molasız"),X("Several short sessions instead of one long.","Mehrere kurze Einheiten statt einer langen.","Bir uzun yerine birkaç kısa seans.")]]},
 {p:X("Tone too high or too low","Ton zu hoch oder zu tief","Ses çok tiz ya da çok pes"),f:[[X("Too high","Zu hoch","Çok tiz"),X("Less air pressure, turn the ney slightly towards you.","Weniger Luftdruck, Ney etwas zu dir drehen.","Daha az hava basıncı, neyi biraz kendine çevir.")],[X("Too low","Zu tief","Çok pes"),X("A little more air, open the angle slightly.","Etwas mehr Luft, Winkel etwas öffnen.","Biraz daha hava, açıyı hafifçe aç.")]]}
];
N.WEEKS=()=>[
 {t:X("The first sound","Der erste Ton","İlk ses"),why:X("The hardest and most important step. Take your time, it can take days.","Der schwerste und wichtigste Schritt. Nimm dir Zeit, es kann Tage dauern.","En zor ve en önemli adım. Acele etme, günler sürebilir."),items:[
  {t:X("Hold the ney correctly","Die Ney richtig halten","Neyi doğru tut"),d:[X("Upper hand: thumb on the back hole, three fingers on holes 1 to 3.","Obere Hand: Daumen auf dem Loch hinten, drei Finger auf Loch 1 bis 3.","Üst el: başparmak arkadaki delikte, üç parmak 1-3. deliklerde."),X("Lower hand: three fingers on holes 4 to 6.","Untere Hand: drei Finger auf Loch 4 bis 6.","Alt el: üç parmak 4-6. deliklerde."),X("Hold it 30 to 45 degrees off to the side, shoulders relaxed.","30 bis 45 Grad zur Seite halten, Schultern locker.","30-45 derece yana tut, omuzlar gevşek.")]},
  {t:X("Lips on the başpare","Lippen an die Başpare","Dudaklar başparede"),d:[X("Rest the başpare lightly on the lips.","Başpare leicht an die Lippen legen.","Başpareyi dudaklara hafifçe dayar."),X("Your lip covers about half of the opening.","Die Lippe deckt etwa die Hälfte der Öffnung ab.","Dudak açıklığın yaklaşık yarısını kapatır."),X("No pressing. A light touch seals enough.","Nicht drücken. Leichte Berührung reicht.","Bastırma. Hafif temas yeterli.")]},
  {t:X("A first tone (any tone)","Ein erster Ton (egal welcher)","İlk ses (herhangi biri)"),d:[X("Purse your lips like whistling, blow a thin, gentle stream across the edge.","Lippen wie zum Pfeifen spitzen, dünn und sanft über die Kante blasen.","Islık çalar gibi dudaklarını büz, kenarın üstünden ince ve yumuşak üfle."),X("Change the angle in tiny steps until a tone appears.","Winkel in winzigen Schritten ändern, bis ein Ton kommt.","Ses çıkana kadar açıyı çok küçük adımlarla değiştir."),X("Short tries, then rest. Dizziness means: pause.","Kurze Versuche, dann Pause. Schwindel heißt: Pause.","Kısa denemeler, sonra mola. Baş dönmesi mola demektir.")]},
  {t:X("Hold the tone for 3 seconds","Den Ton 3 Sekunden halten","Sesi 3 saniye tut"),d:[X("Once you find it, don't move. Breathe in and try again from exactly the same position.","Wenn du ihn findest, nicht bewegen. Einatmen und aus genau derselben Haltung nochmal.","Bulunca kıpırdama. Nefes al ve tam aynı pozisyondan tekrar dene."),X("Use the air challenge further down.","Nutze die Luft-Challenge weiter unten.","Aşağıdaki nefes meydan okumasını kullan.")]}]},
 {t:X("Neva and Çargah","Neva und Çargah","Neva ve Çargah"),why:X("Teachers often start with Neva because few holes are closed.","Lehrer starten oft mit Neva, weil wenige Löcher zu sind.","Hocalar genelde Neva ile başlar çünkü az delik kapalıdır."),items:[
  {t:X("Neva: thumb, hole 2 and hole 5","Neva: Daumen, Loch 2 und Loch 5","Neva: başparmak, 2. ve 5. delik"),go:"practice",set:{level:0,idx:0},show:{fing:"Ne"},d:[X("Close only these three, all others stay open.","Nur diese drei zu, alle anderen offen.","Sadece bu üçünü kapat, diğerleri açık."),X("Hold for 4 beats, rest 4 beats, five times.","4 Schläge halten, 4 Pause, fünfmal.","4 vuruş tut, 4 dinlen, beş kez.")]},
  {t:X("Çargah: thumb, holes 1, 2 and 5","Çargah: Daumen, Loch 1, 2 und 5","Çargah: başparmak, 1, 2 ve 5. delik"),go:"practice",set:{level:0,idx:1},show:{fing:"Ca"},d:[X("From Neva add hole 1.","Von Neva aus Loch 1 dazu.","Neva'dan 1. deliği ekle."),X("Keep the breath the same during the change.","Beim Wechsel den Atem gleich lassen.","Geçişte nefesi aynı tut.")]},
  {t:X("Neva ↔ Çargah slowly","Neva ↔ Çargah langsam","Neva ↔ Çargah yavaşça"),go:"practice",set:{level:0,idx:0},d:[X("Two beats each, back and forth.","Je zwei Schläge, hin und her.","İkişer vuruş, gidip gel."),X("Only hole 1 moves.","Nur Loch 1 bewegt sich.","Sadece 1. delik hareket eder.")]},
  {t:X("Air challenge: 5 seconds","Luft-Challenge: 5 Sekunden","Nefes meydan okuması: 5 saniye"),d:[X("Further down on this page, on Neva.","Weiter unten auf dieser Seite, auf Neva.","Bu sayfanın aşağısında, Neva'da.")]}]},
 {t:X("Segah, Dügah, Rast","Segah, Dügah, Rast","Segah, Dügah, Rast"),why:X("Now the lower hand closes more holes, down to Rast with everything closed.","Jetzt schließt die untere Hand mehr Löcher, bis Rast mit allem zu.","Şimdi alt el daha çok delik kapatır, her şeyin kapalı olduğu Rast'a kadar."),items:[
  {t:X("Segah","Segah","Segah"),go:"practice",set:{level:0,idx:2},show:{fing:"Se"},d:[X("Thumb, holes 1, 2, 3 and 5. Hole 4 stays open.","Daumen, Loch 1, 2, 3 und 5. Loch 4 bleibt offen.","Başparmak, 1, 2, 3 ve 5. delik. 4. delik açık kalır."),X("Segah is a little lower than piano B. That's correct.","Segah ist etwas tiefer als das Klavier-H. Das ist richtig.","Segah piyanodaki Si'den biraz pestir. Bu doğru.")]},
  {t:X("Dügah","Dügah","Dügah"),go:"practice",set:{level:0,idx:3},show:{fing:"Du"},d:[X("Thumb and holes 1 to 5. Only hole 6 is open.","Daumen und Loch 1 bis 5. Nur Loch 6 ist offen.","Başparmak ve 1-5. delikler. Sadece 6. delik açık.")]},
  {t:X("Rast: everything closed","Rast: alles zu","Rast: her şey kapalı"),go:"practice",set:{level:0,idx:4},show:{fing:"Ra"},d:[X("All seven holes closed. The hardest to seal, check every finger.","Alle sieben Löcher zu. Am schwersten dicht zu bekommen, jeden Finger prüfen.","Yedi delik de kapalı. Kapatması en zor olan, her parmağı kontrol et."),X("Gentle breath.","Sanfter Atem.","Yumuşak nefes.")]},
  {t:X("Neva down to Rast and back","Neva runter bis Rast und zurück","Neva'dan Rast'a ve geri"),go:"songs",set:{song:0,loadSong:true,bpm:60},d:[X("Use the scale example under “Songs”.","Nutze die Tonleiter unter „Lieder“.","“Şarkılar”daki diziyi kullan.")]}]},
 {t:X("Reading notes and a first song","Noten lesen und erstes Lied","Nota okuma ve ilk şarkı"),why:X("Perde names on the staff, note values, and a first melody.","Perde-Namen auf den Linien, Notenwerte und eine erste Melodie.","Portede perde adları, nota değerleri ve ilk melodi."),items:[
  {t:X("Find your perdes on the staff","Deine Perden auf den Linien finden","Perdelerini portede bul"),go:"read",d:[X("Rast is on the second line (G). Dügah, Segah, Çargah, Neva go up step by step.","Rast steht auf der zweiten Linie (G). Dügah, Segah, Çargah, Neva gehen Schritt für Schritt hoch.","Rast ikinci çizgide (Sol). Dügah, Segah, Çargah, Neva adım adım yukarı çıkar.")]},
  {t:X("Clap whole, half and quarter notes","Ganze, Halbe, Viertel mitklatschen","Birlik, ikilik, dörtlük alkışla"),go:"read",d:[X("Whole = 4 beats, half = 2, quarter = 1.","Ganze = 4, Halbe = 2, Viertel = 1 Schlag.","Birlik = 4, ikilik = 2, dörtlük = 1 vuruş.")]},
  {t:X("“Hot Cross Buns” at tempo 50","„Hot Cross Buns“ bei Tempo 50","Tempo 50'de “Hot Cross Buns”"),go:"songs",set:{song:2,loadSong:true,bpm:50},d:[X("Only Segah, Dügah, Rast. Listen once, then play along.","Nur Segah, Dügah, Rast. Einmal hören, dann mitspielen.","Sadece Segah, Dügah, Rast. Bir kez dinle, sonra birlikte çal.")]},
  {t:X("“Mary Had a Little Lamb”","„Mary Had a Little Lamb“","“Mary Had a Little Lamb”"),go:"songs",set:{song:3,loadSong:true,bpm:60},d:[X("Adds Neva. Breathe at the end of each line.","Neva kommt dazu. Am Ende jeder Zeile atmen.","Neva eklenir. Her satır sonunda nefes al.")]}]},
 {t:X("In-between perdes: Kürdi and Nim Hicaz","Zwischen-Perden: Kürdi und Nim Hicaz","Ara perdeler: Kürdi ve Nim Hicaz"),why:X("These give makams their colour.","Sie geben den Makams ihre Farbe.","Makamlara renklerini bunlar verir."),items:[
  {t:X("Kürdi","Kürdi","Kürdi"),go:"practice",set:{level:1,idx:1},show:{fing:"Ku"},d:[X("Thumb and holes 1 to 4, holes 5 and 6 open.","Daumen und Loch 1 bis 4, Loch 5 und 6 offen.","Başparmak ve 1-4. delikler, 5 ve 6 açık."),X("Between Dügah and Segah.","Zwischen Dügah und Segah.","Dügah ile Segah arasında.")]},

/* =====================================================================
   SAZ (short-neck bağlama, bağlama düzeni: alt La – orta Re – üst Mi, written pitch)
   The notes are written an octave above the sound, like guitar.
   ===================================================================== */
const S={key:"fn-s",SHIFT:-12};
// fret ratios of a 17-fret-per-octave bağlama neck
S.RATIOS=[1,18/17,12/11,9/8,81/68,27/22,81/64,4/3,24/17,16/11,3/2,27/17,18/11,27/16,16/9,32/17,64/33,2];
S.KOMA=[1,2,5,8,9,12,15,16];
S.COURSES=[69,74,76]; // alt La, orta Re, üst Mi (written)
S.cents=f=>1200*Math.log2(S.RATIOS[f]);
/** Note name for a course + fret, with ♭² for the koma frets in between. */
S.fretName=(course,f)=>{ const s=(S.COURSES[course]*100+S.cents(f))/100; let base=Math.round(s); const dev=(s-base)*100; let koma=false;
  if(dev>30){ base+=1; koma=true; } else if(dev<-30) koma=true; const nm=SOLF[pc(base)]; return koma?(/[♯♭]/.test(nm)?nm+"−":nm+"♭²"):nm; };
S.courseName=c=>[X("alt (bottom)","Alt (unten)","alt"),X("orta (middle)","Orta (Mitte)","orta"),X("üst (top)","Üst (oben)","üst")][c];
// playable notes for practice and songs (alt course), written midi m, cent offset c, fret f
S.FRETS=[0,2,3,4,6,7,8,10,11,13,14,17];
S.N=S.FRETS.map(f=>{ const exact=69+S.cents(f)/100; let m=Math.round(exact); let c=(exact-m)*100; if(f===2){ m=70; c=(exact-70)*100; } return {id:"f"+f,m,c,f,k:{s:0,f}}; });
S.byId=Object.fromEntries(S.N.map(n=>[n.id,n]));
S.byMidi=m=>S.N.find(n=>n.m===m);
S.nm=m=>{ const n=S.byMidi(m); return n?S.fretName(0,n.f):SOLF[pc(m)]; };
S.sub=m=>{ const n=S.byMidi(m); return n?fill(X("fret {f}","Perde {f}","{f}. perde"),{f:n.f}):""; };
S.subHead=()=>X("Fret (alt course)","Perde (Alt-Chor)","Perde (alt tel)");
S.regName=m=>m>=81?X("upper octave","obere Oktave","üst oktav"):X("first octave","erste Oktave","birinci oktav");
S.color=m=>{ const n=S.byMidi(m); return n&&S.KOMA.includes(n.f)?"var(--hi)":"var(--lh)"; };
S.tone=(m)=>{ const n=S.byMidi(m); pluck(m+S.SHIFT+((n&&n.c)||0)/100,0,.7); };
S.RANGES={low:[69,80],mid:[69,80],high:[81,86]};
S.PC=NAME_PC;
S.parse=t=>parseWind(t,S);
S.steps=k=>{ if(!k) return ""; return k.f===0
  ? `<li><span class="n o">O</span><span>${X("Play the alt course open (press nothing).","Alt-Saitenchor leer spielen (nichts drücken).","Alt teli boş çal (hiçbir yere basma).")}</span></li>`
  : `<li><span class="n">${k.f}</span><span>${fill(X("Press the alt course at fret {f}, just behind the fret.","Alt-Saitenchor im {f}. Perde drücken, kurz hinter dem Bundstäbchen.","Alt teli {f}. perdede, perdenin hemen arkasından bas."),{f:k.f})}${S.KOMA.includes(k.f)?" "+X("This is a koma fret (between the normal notes).","Das ist ein Koma-Perde (zwischen den normalen Tönen).","Bu bir koma perdedir (normal sesler arasında)."):""}</span></li>`; };
/** Vertical neck: three courses, 17 frets; koma frets are thin and dashed. */
S.neckSVG=(sel,showNames=false)=>{
  const W=showNames?300:240, x0=showNames?74:60, dx=showNames?80:60, y0=58, len=440, H=y0+len+34, yOf=f=>y0+len*(1-1/S.RATIOS[f])*2;
  const mid=f=>f===0?y0-24:(yOf(f)+(f>1?yOf(f-1):y0))/2;
  let o=`<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="${X("Saz neck","Saz-Hals","Saz sapı")}">`;
  o+=`<rect x="${x0-18}" y="${y0}" width="${dx*2+36}" height="${len}" rx="4" fill="#8a6d36" opacity=".16"/>`;
  o+=`<rect x="${x0-18}" y="${y0-6}" width="${dx*2+36}" height="7" rx="3" fill="var(--ink)"/>`;
  for(let f=1;f<=17;f++){ const y=yOf(f), koma=S.KOMA.includes(f);
    o+=`<line x1="${x0-18}" y1="${y}" x2="${x0+dx*2+18}" y2="${y}" stroke="var(--muted)" stroke-width="${koma?1:2.2}" ${koma?'stroke-dasharray="3 3"':""}/>`;
    o+=`<text x="${x0-24}" y="${y+3}" font-size="10" fill="var(--muted)" text-anchor="end">${f}</text>`; }
  [0,1,2].forEach(c=>{ const x=x0+c*dx; o+=`<line x1="${x}" y1="${y0}" x2="${x}" y2="${y0+len}" stroke="var(--string)" stroke-width="${3-c*.6}"/>`;
    o+=`<text x="${x}" y="${y0+len+18}" font-size="10.5" fill="var(--muted)" text-anchor="middle">${["alt","orta","üst"][c]}</text>`;
    if(!showNames) o+=`<text x="${x}" y="${y0-14}" font-size="12" font-weight="700" fill="var(--ink)" text-anchor="middle">${S.fretName(c,0)}</text>`; });
  if(showNames){ [0,1,2].forEach(c=>{ for(let f=0;f<=17;f++){ const y=mid(f), x=x0+c*dx, on=sel&&sel.s===c&&sel.f===f, koma=S.KOMA.includes(f);
      o+=`<g class="staff-note" data-s="${c}" data-f="${f}" tabindex="0" role="button" aria-label="${S.fretName(c,f)}"><rect x="${x-25}" y="${y-9}" width="50" height="17" rx="8" fill="${on?"var(--accent)":"var(--surface)"}" stroke="${on?"var(--accent)":f===0?"var(--accent)":"var(--line)"}"/><text x="${x}" y="${y+4}" font-size="10.5" font-weight="${f===0||on?700:400}" fill="${on?"#fff":koma?"var(--muted)":"var(--ink)"}" text-anchor="middle">${S.fretName(c,f)}</text></g>`; } }); }
  else if(sel){ const y=mid(sel.f), x=x0+sel.s*dx;
    o+=sel.f===0?`<circle cx="${x}" cy="${y0-18}" r="13" fill="none" stroke="var(--accent)" stroke-width="3"/>`:`<circle cx="${x}" cy="${y}" r="12" fill="var(--lh)"/><text x="${x}" y="${y+4}" font-size="11" font-weight="700" fill="#fff" text-anchor="middle">${sel.f}</text>`; }
  return o+`</svg>`;
};
S.svg=k=>S.neckSVG(k);

S.side=()=>`<div class="panel"><h2>${X("Tuning (bağlama düzeni)","Stimmen (bağlama düzeni)","Akort (bağlama düzeni)")}</h2><p class="lead">${X("Alt course La, orta Re, üst Mi. Tap a course to hear it. The orta course sounds like the alt course at fret 7, the üst course like the orta course at fret 3.","Alt-Chor La, Orta Re, Üst Mi. Antippen zum Anhören. Der Orta-Chor klingt wie der Alt-Chor im 7. Perde, der Üst-Chor wie der Orta-Chor im 3. Perde.","Alt tel La, orta Re, üst Mi. Dinlemek için dokun. Orta tel, alt telin 7. perdesi gibi; üst tel, orta telin 3. perdesi gibi ses verir.")}</p>

S.care=()=>`<div class="two">
 <div class="panel"><h2>${X("Holding the saz","Die Saz halten","Saz nasıl tutulur")}</h2><ol class="plain">
  <li>${X("Sit upright. The body of the saz rests on your right thigh, the neck points up and to the left.","Aufrecht sitzen. Der Korpus liegt auf dem rechten Oberschenkel, der Hals zeigt schräg nach links oben.","Dik otur. Gövde sağ uyluğun üstünde, sap sola ve yukarı doğru.")}</li>
  <li>${X("The right forearm rests on the top of the body and holds the saz in place.","Der rechte Unterarm liegt oben auf dem Korpus und hält die Saz.","Sağ önkol gövdenin üstünde durur ve sazı sabit tutar.")}</li>
  <li>${X("Left thumb behind the neck, fingers press just behind the fret.","Linker Daumen hinter dem Hals, die Finger drücken kurz hinter dem Perde.","Sol başparmak sapın arkasında, parmaklar perdenin hemen arkasına basar.")}</li>
  <li>${X("Alt course = the one nearest the floor while playing. Most melodies are played there.","Alt-Chor = der dem Boden am nächsten beim Spielen. Die meisten Melodien spielt man dort.","Alt tel = çalarken yere en yakın olan tel. Melodilerin çoğu orada çalınır.")}</li></ol></div>
 <div class="panel"><h2>${X("The mızrap (plectrum)","Das Mızrap (Plektrum)","Mızrap")}</h2><ol class="plain">
  <li>${X("Hold it between thumb and index finger, only the tip sticks out.","Zwischen Daumen und Zeigefinger halten, nur die Spitze schaut heraus.","Başparmak ile işaret parmağı arasında tut, sadece ucu dışarıda kalsın.")}</li>
  <li>${X("The movement comes from the wrist, not the whole arm.","Die Bewegung kommt aus dem Handgelenk, nicht aus dem ganzen Arm.","Hareket bütün koldan değil, bilekten gelir.")}</li>
  <li>${X("Down and up strokes alternate evenly. The hand keeps moving even in rests.","Ab- und Aufschläge wechseln gleichmäßig. Die Hand bewegt sich auch in Pausen weiter.","Aşağı ve yukarı vuruşlar düzenli sırayla gelir. El suslarda bile hareket etmeye devam eder.")}</li>
  <li>${X("Fast down-up on one note is the tremolo, the typical long-note sound of the saz.","Schnelles Ab-Auf auf einem Ton ist das Tremolo, der typische lange Ton der Saz.","Tek seste hızlı aşağı-yukarı tremolodur, sazın tipik uzun sesi.")}</li></ol></div>
</div>
<div class="panel"><h2>${X("Koma frets and the Turkish sound","Koma-Perden und der türkische Klang","Koma perdeler ve Türk sesi")}</h2><div class="facts">
  <div><b>${X("More frets than a guitar","Mehr Perden als eine Gitarre","Gitardan fazla perde")}</b><span>${X("A bağlama has about 17 frets per octave. The extra frets give notes between the piano keys.","Eine Bağlama hat etwa 17 Perden pro Oktave. Die zusätzlichen Perden geben Töne zwischen den Klaviertasten.","Bağlamada oktav başına yaklaşık 17 perde vardır. Fazla perdeler piyano tuşları arasındaki sesleri verir.")}</span></div>
  <div><b>${X("Si♭² (fret 2)","Si♭² (Perde 2)","Si♭² (2. perde)")}</b><span>${X("Two komas below Si. This note gives Hüseyni and Uşşak their typical colour.","Zwei Koma unter Si. Dieser Ton gibt Hüseyni und Uşşak ihre typische Farbe.","Si'nin iki koma altı. Bu ses Hüseyni ve Uşşak'a tipik rengini verir.")}</span></div>
  <div><b>${X("Listen a lot","Viel hören","Bolca dinle")}</b><span>${X("Listen to türkü with saz every day and try to hear where the koma notes are.","Hör jeden Tag Türküs mit Saz und versuche zu hören, wo die Koma-Töne sind.","Her gün sazlı türkü dinle ve koma seslerin nerede olduğunu duymaya çalış.")}</span></div>
  <div><b>${X("Ornaments","Verzierungen","Süslemeler")}</b><span>${X("Hammer-ons and slides (çarpma, kaydırma) come later, once notes and mızrap are steady.","Aufschläge und Gleiten (çarpma, kaydırma) kommen später, wenn Töne und Mızrap sicher sind.","Çarpma ve kaydırma, sesler ve mızrap oturduktan sonra gelir.")}</span></div></div></div>`;

S.bind.mizrap=root=>{
  const st=S.state, $=id=>root.querySelector("#"+id), P=S.PATS();
  $("sPat").innerHTML=P.map((p,i)=>`<option value="${i}">${p.n}</option>`).join(""); $("sPat").value=st.pat;
  $("sHold").innerHTML=S.N.map(n=>`<option value="${n.id}">${S.nm(n.m)} (${S.sub(n.m)})</option>`).join(""); $("sHold").value=st.hold;
  $("sBpm").value=st.mbpm; $("sBpmVal").textContent=st.mbpm;
  const beats=(cur=-1)=>{ const p=P[st.pat]; $("sBeats").style.setProperty("--n",p.p.length);
    $("sBeats").innerHTML=[...p.p].map((ch,i)=>`<div class="beat ${(p.accent?p.accent.includes(i)||i===p.p.length-3:i%2===0)?"main":""} ${i===cur?"cur":""}"><span class="ar">${ch==="D"?"↓":ch==="U"?"↑":"·"}</span><span class="ct">${p.c[i]}</span></div>`).join(""); $("sPatInfo").textContent=p.info; };
  const hold=()=>{ const n=S.byId[st.hold]; $("sHoldDiag").innerHTML=S.neckSVG(n.k); };
  let t=null; const stop=()=>{ if(t){clearInterval(t); t=null;} beats(); };
  $("sPat").onchange=()=>{ st.pat=+$("sPat").value; stop(); }; $("sHold").onchange=()=>{ st.hold=$("sHold").value; hold(); };
  $("sBpm").oninput=()=>{ st.mbpm=+$("sBpm").value; $("sBpmVal").textContent=st.mbpm; };
  $("sPlay").onclick=()=>{ stop(); ctx(); const p=P[st.pat]; let i=0; const n=S.byId[st.hold];
    const step=(p.p.length===16?.25:.5)*60/st.mbpm;
    const tick=()=>{ const k=i%p.p.length, ch=p.p[k]; beats(k); if(k===0) click(true);
      if(ch!=="-"){ const v=ch==="D"?.6:.4; pluck(n.m+S.SHIFT+n.c/100,0,v); pluck(S.COURSES[1]+S.SHIFT,.008,v*.45); pluck(S.COURSES[2]+S.SHIFT,.016,v*.4); }
      i++; };
    tick(); t=setInterval(tick,step*1000); running.add(stop); };
  $("sStop").onclick=stop; beats(); hold();
};

S.bind.neck=root=>{
  const st=S.state, $=id=>root.querySelector("#"+id);
  const show=()=>{ const {s,f}=st.neck; $("sNeck").innerHTML=S.neckSVG(st.neck,true).replace('viewBox','style="max-width:300px" viewBox'); $("sNeckName").textContent=S.fretName(s,f);
    $("sNeckWhere").innerHTML=`<b>${S.courseName(s)}</b>, ${f===0?X("open","leer","boş"):fill(X("fret {f}","Perde {f}","{f}. perde"),{f})}${S.KOMA.includes(f)?" · "+X("koma fret","Koma-Perde","koma perde"):""}`; };
  const play=()=>{ const {s,f}=st.neck; pluck(S.COURSES[s]+S.SHIFT+S.cents(f)/100,0,.7); };
  const act=e=>{ const g=e.target.closest("[data-f]"); if(!g) return; st.neck={s:+g.dataset.s,f:+g.dataset.f}; show(); play(); };
  $("sNeck").onclick=act; $("sNeck").onkeydown=e=>{ if(e.key==="Enter"||e.key===" "){ e.preventDefault(); act(e); } };
  $("sNeckPlay").onclick=play; show();
};

S.bind.tuner=root=>{

  const stopRef=()=>{ try{src&&src.stop();}catch(e){} src=null; if(t){clearInterval(t); t=null;} on=-1; $("sStr").querySelectorAll("button").forEach(b=>b.classList.remove("cur")); $("sRefStop").hidden=true; };
  $("sStr").onclick=e=>{ const b=e.target.closest("button"); if(!b) return; const i=+b.dataset.i, same=on===i; stopRef(); if(same) return;
    on=i; b.classList.add("cur"); $("sRefStop").hidden=false; let n=0;
    const hit=()=>{ try{src&&src.stop();}catch(e){} src=pluck(T[i].m,0,.75); if(++n>=8) setTimeout(stopRef,1800); };
    hit(); t=setInterval(()=>{ if(n<8) hit(); },2000); running.add(stopRef); };
  $("sRefStop").onclick=stopRef;
  $("sMic").onclick=async()=>{
    if(mic.on){ mic.stop(); $("sMic").textContent=X("Start listening","Zuhören starten","Dinlemeye başla"); return; }
    const ok=await mic.start(f=>{ if(f<0){ $("sTunHz").innerHTML="&nbsp;"; return; }
      const m=69+12*Math.log2(f/440); let best=T[0],bd=1e9; T.forEach(x=>{ const d=Math.abs(m-x.m); if(d<bd){bd=d;best=x;} });
      const cents=(m-best.m)*100;
      $("sTunName").textContent=`${best.name} · ${best.course}`;
      $("sTunSub").textContent=Math.abs(cents)<8?"✓ "+X("in tune","passt","doğru"):cents<0?fill(X("too low ({c} cents): tighten","zu tief ({c} Cent): straffer drehen","pes ({c} sent): ger"),{c:cents.toFixed(0)}):fill(X("too high (+{c} cents): loosen","zu hoch (+{c} Cent): lockerer drehen","tiz (+{c} sent): gevşet"),{c:cents.toFixed(0)});
      $("sTunHz").textContent=Math.abs(cents)>250?X("Far away from all courses: tune roughly by ear first.","Weit weg von allen Chören: erst grob nach Gehör stimmen.","Tüm tellerden çok uzak: önce kulakla kabaca akort et."):`${f.toFixed(1)} Hz`;
      setNeedle($("sTunNeedle"),cents); },60,700);
    if(!ok){ $("sMicNote").textContent=micBlocked(); $("sMicNote").hidden=false; return; }
    $("sMicNote").hidden=true; $("sMic").textContent=X("Stop listening","Zuhören stoppen","Dinlemeyi durdur"); };
};

 {t:X("Holding and the mızrap","Halten und das Mızrap","Tutuş ve mızrap"),why:X("Good habits from day one: relaxed body, loose wrist.","Gute Gewohnheiten ab Tag eins: lockerer Körper, lockeres Handgelenk.","İlk günden iyi alışkanlıklar: gevşek beden, gevşek bilek."),items:[
  {t:X("Hold the saz","Die Saz halten","Sazı tut"),d:[X("Body on the right thigh, neck up and to the left.","Korpus auf dem rechten Oberschenkel, Hals schräg nach links oben.","Gövde sağ uylukta, sap sola ve yukarı."),X("Right forearm rests on the body.","Rechter Unterarm liegt auf dem Korpus.","Sağ önkol gövdenin üstünde."),X("Left thumb behind the neck.","Linker Daumen hinter dem Hals.","Sol başparmak sapın arkasında.")]},
  {t:X("Hold the mızrap","Das Mızrap halten","Mızrabı tut"),d:[X("Between thumb and index finger, only the tip sticks out.","Zwischen Daumen und Zeigefinger, nur die Spitze schaut heraus.","Başparmak ile işaret arasında, sadece ucu dışarıda."),X("Firm enough not to drop it, loose enough to move.","Fest genug, dass es nicht fällt, locker genug zum Bewegen.","Düşmeyecek kadar sıkı, hareket edecek kadar gevşek.")]},
  {t:X("Down strokes on open strings","Abschläge auf leeren Saiten","Boş tellerde aşağı vuruşlar"),go:"mizrap",set:{pat:0,hold:"f0",mbpm:70},d:[X("Strike all three courses with one even down stroke.","Alle drei Chöre mit einem gleichmäßigen Abschlag anschlagen.","Üç teli tek bir düzenli aşağı vuruşla çal."),X("The movement comes from the wrist.","Die Bewegung kommt aus dem Handgelenk.","Hareket bilekten gelir.")]},
  {t:X("Down-up evenly","Ab-Auf gleichmäßig","Aşağı-yukarı düzenli"),go:"mizrap",set:{pat:1,hold:"f0",mbpm:70},d:[X("Down on the beat, up on the “and”.","Runter auf dem Schlag, hoch auf dem „und“.","Vuruşta aşağı, “ve”de yukarı."),X("Up strokes are a little lighter.","Aufschläge sind etwas leichter.","Yukarı vuruşlar biraz daha hafif.")]}]},
 {t:X("Tuning in bağlama düzeni","Stimmen in bağlama düzeni","Bağlama düzeninde akort"),why:X("A well-tuned saz makes every exercise easier.","Eine gut gestimmte Saz macht jede Übung leichter.","İyi akort edilmiş saz her çalışmayı kolaylaştırır."),items:[
  {t:X("Tune the alt course to La","Alt-Chor auf La stimmen","Alt teli La'ya akort et"),d:[X("Tap “La · alt” in the tuning box below and match it.","Unten im Stimm-Kasten „La · alt“ antippen und angleichen.","Aşağıdaki akort kutusunda “La · alt”a dokun ve eşle."),X("Turn the peg in tiny steps.","Den Wirbel in winzigen Schritten drehen.","Burguyu çok küçük adımlarla çevir.")]},
  {t:X("Orta course = alt at fret 7","Orta-Chor = Alt im 7. Perde","Orta tel = alt'ın 7. perdesi"),go:"neck",set:{neck:{s:0,f:7}},d:[X("Press the alt course at fret 7 (Re) and tune the orta course open to the same note.","Alt-Chor im 7. Perde (Re) drücken und den Orta-Chor leer auf denselben Ton stimmen.","Alt teli 7. perdede (Re) bas ve orta teli boşta aynı sese akort et.")]},
  {t:X("Üst course = orta at fret 3","Üst-Chor = Orta im 3. Perde","Üst tel = orta'nın 3. perdesi"),go:"neck",set:{neck:{s:1,f:3}},d:[X("Press the orta course at fret 3 (Mi) and tune the üst course open to it.","Orta-Chor im 3. Perde (Mi) drücken und den Üst-Chor leer darauf stimmen.","Orta teli 3. perdede (Mi) bas ve üst teli boşta ona akort et."),X("The thick bam string sounds an octave lower.","Die dicke Bam-Saite klingt eine Oktave tiefer.","Kalın bam teli bir oktav pes çalar.")]},
  {t:X("Check all three","Alle drei prüfen","Üçünü de kontrol et"),go:"tuner",d:[X("Strike each course and check it once more.","Jeden Chor anschlagen und noch einmal prüfen.","Her teli çal ve bir kez daha kontrol et.")]}]},
 {t:X("First notes: La, Si, Do, Re","Erste Töne: La, Si, Do, Re","İlk sesler: La, Si, Do, Re"),why:X("The melody lives on the alt course.","Die Melodie spielt auf dem Alt-Chor.","Melodi alt telde yaşar."),items:[
  {t:X("La: alt course open","La: Alt-Chor leer","La: alt tel boş"),go:"practice",set:{level:0,idx:0},show:{fing:"f0"},d:[X("Strike down-up, nothing pressed.","Ab-Auf anschlagen, nichts drücken.","Aşağı-yukarı vur, hiçbir yere basma.")]},
  {t:X("Si: fret 3","Si: Perde 3","Si: 3. perde"),go:"practice",set:{level:0,idx:1},show:{fing:"f3"},d:[X("Press right behind fret 3 with the index finger.","Mit dem Zeigefinger direkt hinter Perde 3 drücken.","İşaret parmağıyla 3. perdenin hemen arkasına bas.")]},
  {t:X("Do: fret 4","Do: Perde 4","Do: 4. perde"),go:"practice",set:{level:0,idx:2},show:{fing:"f4"},d:[X("Middle finger on fret 4. Si and Do are close together.","Mittelfinger auf Perde 4. Si und Do liegen nah beieinander.","Orta parmak 4. perdede. Si ile Do birbirine yakındır.")]},
  {t:X("Re: fret 7","Re: Perde 7","Re: 7. perde"),go:"practice",set:{level:1,idx:3},show:{fing:"f7"},d:[X("Ring finger on fret 7. La–Si–Do–Re up and down.","Ringfinger auf Perde 7. La–Si–Do–Re rauf und runter.","Yüzük parmağı 7. perdede. La–Si–Do–Re yukarı ve aşağı.")]}]},
 {t:X("Mızrap with notes","Mızrap mit Tönen","Seslerle mızrap"),why:X("Now both hands work together.","Jetzt arbeiten beide Hände zusammen.","Şimdi iki el birlikte çalışır."),items:[
  {t:X("Down-up while holding Do","Ab-Auf, während du Do hältst","Do'yu tutarken aşağı-yukarı"),go:"mizrap",set:{pat:1,hold:"f4",mbpm:70},d:[X("The left hand stays still, the right hand keeps the rhythm.","Die linke Hand bleibt ruhig, die rechte hält den Rhythmus.","Sol el sabit, sağ el ritmi tutar.")]},
  {t:X("Pattern 3 with Re","Muster 3 mit Re","Re ile kalıp 3"),go:"mizrap",set:{pat:2,hold:"f7",mbpm:70},d:[X("Down, down-up. In the gap the hand moves up without striking.","Ab, Ab-Auf. In der Lücke geht die Hand leer hoch.","Aşağı, aşağı-yukarı. Boşlukta el vurmadan yukarı gider.")]},
  {t:X("Two strokes per note, La to Re","Zwei Schläge pro Ton, La bis Re","Ses başına iki vuruş, La'dan Re'ye"),go:"songs",set:{song:0,loadSong:true,bpm:50},d:[X("Down-up on each note, then move to the next.","Ab-Auf auf jedem Ton, dann zum nächsten.","Her seste aşağı-yukarı, sonra sonrakine geç.")]},
  {t:X("“Hot Cross Buns”","„Hot Cross Buns“","“Hot Cross Buns”"),go:"songs",set:{song:1,loadSong:true,bpm:60},d:[X("Only Do, Si, La. Listen once, then play along.","Nur Do, Si, La. Einmal hören, dann mitspielen.","Sadece Do, Si, La. Bir kez dinle, sonra birlikte çal.")]}]},
 {t:X("Mi, Fa, Sol, La: the whole scale","Mi, Fa, Sol, La: die ganze Tonleiter","Mi, Fa, Sol, La: bütün dizi"),why:X("With these you can play many simple melodies.","Damit kannst du viele einfache Melodien spielen.","Bunlarla birçok basit melodi çalabilirsin."),items:[
  {t:X("Mi: fret 10","Mi: Perde 10","Mi: 10. perde"),go:"practice",set:{level:2,idx:0},show:{fing:"f10"},d:[X("Move the hand up the neck, index finger on fret 10.","Hand am Hals hochschieben, Zeigefinger auf Perde 10.","Eli sapta yukarı kaydır, işaret 10. perdede.")]},
  {t:X("Fa and Sol: frets 11 and 14","Fa und Sol: Perde 11 und 14","Fa ve Sol: 11. ve 14. perde"),go:"practice",set:{level:2,idx:1},show:{fing:"f11"},d:[X("Fa right next to Mi, Sol three frets higher.","Fa direkt neben Mi, Sol drei Perden höher.","Fa, Mi'nin hemen yanında, Sol üç perde yukarıda.")]},
  {t:X("High La: fret 17","Hohes La: Perde 17","Tiz La: 17. perde"),go:"practice",set:{level:2,idx:3},show:{fing:"f17"},d:[X("The octave of the open string.","Die Oktave der leeren Saite.","Boş telin oktavı.")]},
  {t:X("Scale La to La'","Tonleiter La bis La'","La'dan La''ya dizi"),go:"songs",set:{song:0,loadSong:true,bpm:60},d:[X("Up and down, two strokes per note.","Rauf und runter, zwei Schläge pro Ton.","Yukarı ve aşağı, ses başına iki vuruş.")]}]},
 {t:X("Reading notes and a melody","Noten lesen und eine Melodie","Nota okuma ve bir melodi"),why:X("From here you can learn any türkü from sheet music.","Ab hier kannst du jede Türkü aus Noten lernen.","Buradan itibaren her türküyü notadan öğrenebilirsin."),items:[
  {t:X("Find your notes on the staff","Deine Töne auf den Linien finden","Seslerini portede bul"),go:"read",d:[X("Open La is in the second space. Tap each note.","Das leere La steht im zweiten Zwischenraum. Jede Note antippen.","Boş La ikinci aralıkta. Her notaya dokun.")]},
  {t:X("Note values","Notenwerte","Nota değerleri"),go:"read",d:[X("Whole = 4 beats, half = 2, quarter = 1.","Ganze = 4, Halbe = 2, Viertel = 1 Schlag.","Birlik = 4, ikilik = 2, dörtlük = 1 vuruş.")]},
  {t:X("“Ode to Joy”","„Ode an die Freude“","“Neşeye Övgü”"),go:"songs",set:{song:2,loadSong:true,bpm:60},d:[X("Mi Mi Fa Sol … all on the alt course.","Mi Mi Fa Sol … alles auf dem Alt-Chor.","Mi Mi Fa Sol … hepsi alt telde.")]},

 {t:X("Aksak 9/8 and a first türkü","Aksak 9/8 und eine erste Türkü","Aksak 9/8 ve ilk türkü"),why:X("The limping rhythm of many türkü.","Der hinkende Rhythmus vieler Türküs.","Birçok türkünün aksak ritmi."),items:[

const slLvl=(s,id)=>(s.lvlFor&&s.lvlFor[id])||s.lvl;
const SL_LVL=()=>({easy:X("Easy","Leicht","Kolay"),medium:X("Medium","Mittel","Orta"),hard:X("Hard","Schwer","Zor")});
const SL_PC={C:0,D:2,E:4,F:5,G:7,A:9,B:11};
/** "E4:3/2" → {m:64,b:1.5}; "R" → rest */
function slParse(str,tr){ return str.trim().split(/\s+/).map(t=>{ const [n,d]=t.split(":"); const b=d?(d.includes("/")?d.split("/").reduce((a,c)=>a/c):+d):1;
  if(n==="R") return {rest:true,b}; const m=n.match(/^([A-G])([#b]?)(\d)$/); return {m:(+m[3]+1)*12+SL_PC[m[1]]+(m[2]==="#"?1:m[2]==="b"?-1:0)+tr,b}; }); }
function slSongs(id){ return SONGLIB.filter(s=>s.for.includes(id)&&s.ln===lang); }
const SL_STATE={};
function songLibHTML(M){
  const id=M.lib, list=slSongs(id), lv=SL_LVL();
  return `<div class="panel"><h2>${X("Song library","Liederbibliothek","Şarkı kütüphanesi")}</h2>
  <p class="lead">${id==="g"?X("Well-known songs with lyrics and chords. Strum one chord per bar (pattern 1) or pick it. Tap a bar to see its chord.","Bekannte Lieder mit Text und Akkorden. Spiel pro Takt einen Akkord (Anschlag 1) oder zupfe ihn. Tippe einen Takt an, um den Griff zu sehen.","Sözleri ve akorlarıyla bilinen şarkılar. Ölçü başına bir akor çal (ritim 1) ya da parmakla çal. Akoru görmek için bir ölçüye dokun."):X("Well-known songs with lyrics and the melody in notes you have learned. Tap a bar to hear it and see the fingering of its first note.","Bekannte Lieder mit Text und der Melodie in Tönen, die du gelernt hast. Tippe einen Takt an, um ihn zu hören und den Griff des ersten Tons zu sehen.","Sözleri ve öğrendiğin seslerle melodisiyle bilinen şarkılar. Dinlemek ve ilk sesin pozisyonunu görmek için bir ölçüye dokun.")} ${X("All lyrics are public domain.","Alle Texte sind gemeinfrei.","Tüm sözler kamu malıdır.")}</p>
  <p class="muted small" style="margin-top:-4px">${X("The songs follow the page language and are chosen for this instrument. Switch to DE or TR for German or Turkish songs.","Die Lieder richten sich nach der Seitensprache und passen zu diesem Instrument. Mit EN oder TR bekommst du englische oder türkische Lieder.","Şarkılar sayfa diline göre değişir ve bu çalgıya göre seçilmiştir. İngilizce veya Almanca şarkılar için EN ya da DE seç.")}</p>
  ${["easy","medium","hard"].filter(l=>list.some(s=>slLvl(s,id)===l)).map(l=>`<div class="row" style="margin:6px 0"><span class="eyebrow" style="width:64px">${lv[l]}</span><div class="chips">${list.filter(s=>slLvl(s,id)===l).map(s=>`<button class="chip" data-song="${s.id}" style="font-size:.9rem">${s.title}</button>`).join("")}</div></div>`).join("")}
  <div id="slView" style="margin-top:14px"></div>
  <div class="row" style="margin-top:12px"><label for="slBpm">${X("Tempo","Tempo","Tempo")}</label><input type="range" id="slBpm" min="40" max="140"><span class="muted" id="slBpmVal"></span>
   ${id==="g"?`<label><input type="checkbox" id="slMel" checked> ${X("Melody","Melodie","Melodi")}</label>`:""}</div>
  <div class="row" style="margin-top:10px"><button class="btn go" id="slPlay">${X("Play","Abspielen","Çal")}</button><button class="btn alt" id="slStop">${X("Stop","Stopp","Durdur")}</button></div>
  <div class="tool" style="margin-top:14px"><div class="diagram" id="slDiag"></div><div><h3 id="slNow" style="margin-top:0"></h3><ol class="steps" id="slSteps"></ol></div></div></div>`;
}
function bindSongLib(root,M){
  const id=M.lib, $=x=>root.querySelector("#"+x), list=slSongs(id), sk=id+"-"+lang, st=SL_STATE[sk]=SL_STATE[sk]||{song:list[0].id,bpm:id==="g"?80:70};
  if(!list.some(x=>x.id===st.song)) st.song=list[0].id;
  let timers=[];
  const song=()=>SONGLIB.find(s=>s.id===st.song);
  const noteLbl=n=>n.rest?"–":M.nm?M.nm(n.m):noteName(n.m);
  const showChord=c=>{ if(!c) return; const ch=G.byId[c]; if(!ch) return; $("slDiag").innerHTML=G.chordSVG(ch); $("slNow").textContent=G.name(ch); $("slSteps").innerHTML=G.steps(ch); };
  const showNote=n=>{ if(!n||n.rest) return; const x=M.byMidi(n.m); if(!x) return; $("slDiag").innerHTML=M.svg(x.k); $("slNow").textContent=M.nm(n.m); $("slSteps").innerHTML=M.steps(x.k); };
  const draw=()=>{ const s=song(); root.querySelectorAll("[data-song]").forEach(b=>b.setAttribute("aria-pressed",b.dataset.song===st.song));
    let i=0; const lines=s.lines.map(n=>s.bars.slice(i,i+=n));
    $("slView").innerHTML=`<div class="row" style="justify-content:space-between;align-items:baseline"><h3 style="margin:0">${s.title}</h3><span class="muted small">${s.meter} · ${s.info()}</span></div>
     ${id==="g"?`<div class="chips" style="margin:8px 0">${[...new Set(s.bars.flatMap(b=>b.c.split(" ")).filter(Boolean))].map(c=>`<button class="chip" data-chord="${c}" style="font-size:.85rem;padding:5px 10px">${G.name(G.byId[c])}</button>`).join("")}</div>`:""}
     <div class="song" style="margin-top:8px">${lines.map((ln,li)=>`<div class="slline">${ln.map((b,bi)=>{ const k=s.lines.slice(0,li).reduce((a,c)=>a+c,0)+bi; const notes=slParse(b.m,s.tr[id]);
       return `<button class="nb slbar" data-bar="${k}">${id==="g"?`<b style="color:var(--accent)">${b.c.split(" ").filter(Boolean).map(c=>G.name(G.byId[c])).join(" · ")||"&nbsp;"}</b>`:`<b style="font-size:.95rem">${notes.map(noteLbl).join(" ")}</b>`}<span style="font-size:.9rem">${b.w}</span></button>`; }).join("")}</div>`).join("")}</div>`;
    if(id==="g") showChord(s.bars.find(b=>b.c).c.split(" ")[0]); else showNote(slParse(s.bars[0].m,s.tr[id]).find(n=>!n.rest));
  };
  const mark=k=>{ root.querySelectorAll(".slbar.cur").forEach(b=>b.classList.remove("cur")); const b=root.querySelector(`.slbar[data-bar="${k}"]`); if(b) b.classList.add("cur"); };
  const stop=()=>{ timers.forEach(clearTimeout); timers=[]; root.querySelectorAll(".slbar.cur").forEach(b=>b.classList.remove("cur")); };
  const playNote=(n,dur)=>{ if(n.rest) return; if(id==="g"){ pluck(n.m,0,.7); } else if(id==="s"){ S.tone(n.m); } else M.tone(n.m,dur); };
  const schedule=(from,to,count)=>{ stop(); ctx(); const s=song(), beat=60/st.bpm; let t=0;
    const perBar=+s.meter[0];
    if(count) for(let k=0;k<perBar;k++){ timers.push(setTimeout(()=>click(k===0),t*1000)); t+=beat; }
    s.bars.slice(from,to).forEach((b,j)=>{ const k=from+j, notes=slParse(b.m,s.tr[id]); const len=notes.reduce((a,n)=>a+n.b,0);
      timers.push(setTimeout(()=>{ mark(k); if(id==="g") showChord(b.c.split(" ")[0]||""); },t*1000));
      if(id==="g"){ const cs=b.c.split(" ").filter(Boolean); cs.forEach((c,ci)=>{ const ch=G.byId[c], at=t+ci*len/cs.length*beat;
          for(let q=0;q<len/cs.length;q++) timers.push(setTimeout(()=>G.strum(ch,"D",0,($("slMel")&&$("slMel").checked)?.28:.45),(at+q*beat)*1000));
          if(ci>0) timers.push(setTimeout(()=>showChord(c),at*1000)); }); }
      let u=t; notes.forEach(n=>{ const at=u; if(id!=="g"||($("slMel")&&$("slMel").checked)) timers.push(setTimeout(()=>{ playNote(n,n.b*beat*.9); if(id!=="g") showNote(n); },at*1000)); u+=n.b*beat; });
      t+=len*beat; });
    timers.push(setTimeout(stop,t*1000)); running.add(stop); };
  root.querySelectorAll("[data-song]").forEach(b=>b.onclick=()=>{ stop(); st.song=b.dataset.song; draw(); });
  $("slBpm").value=st.bpm; $("slBpmVal").textContent=st.bpm;
  $("slBpm").oninput=()=>{ st.bpm=+$("slBpm").value; $("slBpmVal").textContent=st.bpm; };
  $("slPlay").onclick=()=>schedule(0,song().bars.length,true);
  $("slStop").onclick=stop;
  $("slView").addEventListener("click",e=>{ const c=e.target.closest("[data-chord]"); if(c){ showChord(c.dataset.chord); G.strum(G.byId[c.dataset.chord]); return; }
    const b=e.target.closest(".slbar"); if(b){ const k=+b.dataset.bar; schedule(k,k+1,false); const s=song(); if(id==="g"){ const c0=s.bars[k].c.split(" ")[0]; if(c0) showChord(c0); } else showNote(slParse(s.bars[k].m,s.tr[id]).find(n=>!n.rest)); } });
  draw();
}

G.lib="g"; S.lib="s"; K.lib="k"; N.lib="n";
const INST={g:G,s:S,k:K,n:N};
let inst="g"; // guitar is the default instrument on every visit
const hash=(location.hash||"").replace("#","");
if(hash==="clarinet"||hash==="klarinette"||hash==="klarnet") inst="k";
if(hash==="ney") inst="n";
if(hash==="saz"||hash==="baglama"||hash==="bağlama") inst="s";
if(hash==="guitar"||hash==="gitarre"||hash==="gitar") inst="g";
const app=document.getElementById("app");
function render(){
  stopAll();
  const M=INST[inst], views=M.VIEWS();
  document.documentElement.lang=lang;
  document.getElementById("instSeg").innerHTML=[["g",X("Guitar","Gitarre","Gitar")],["s","Saz"],["k",X("Clarinet","Klarinette","Klarnet")],["n","Ney"]].map(([id,n])=>`<button data-inst="${id}" aria-pressed="${id===inst}">${n}</button>`).join("");
  document.getElementById("langSeg").innerHTML=LANGS.map(([id,n])=>`<button data-lang="${id}" aria-pressed="${id===lang}" lang="${id}">${n}</button>`).join("");
  app.innerHTML=`<header><h1>${M.title()}</h1><p class="intro">${M.intro()}</p></header>
    <nav class="tabs" role="tablist">${views.map(([id,n])=>`<button role="tab" data-view="${id}" aria-selected="${id===M.state.view}">${n}</button>`).join("")}</nav>
    <section id="view" class="wrap">${M.render[M.state.view]()}</section>`;
  M.bind[M.state.view](app.querySelector("#view"));
  document.getElementById("foot").innerHTML=X("First Notes · made by <a href=\"https://github.com/SinanDmrr\">Sinan</a> with the help of Claude (Anthropic) · free and open source. Sounds are generated in your browser. The microphone is analysed locally only; nothing is sent or stored.","First Notes · von <a href=\"https://github.com/SinanDmrr\">Sinan</a> mit Hilfe von Claude (Anthropic) erstellt · frei und Open Source. Töne werden im Browser erzeugt. Das Mikrofon wird nur lokal ausgewertet, nichts wird gesendet oder gespeichert.","First Notes · <a href=\"https://github.com/SinanDmrr\">Sinan</a> tarafından Claude (Anthropic) yardımıyla hazırlandı · ücretsiz ve açık kaynak. Sesler tarayıcında üretilir. Mikrofon sadece yerel olarak işlenir; hiçbir şey gönderilmez ya da saklanmaz.");
}
app.addEventListener("click",e=>{ const b=e.target.closest(".tabs button"); if(!b) return; INST[inst].state.view=b.dataset.view; render(); });
document.getElementById("instSeg").addEventListener("click",e=>{ const b=e.target.closest("button"); if(!b||b.dataset.inst===inst) return; inst=b.dataset.inst; render(); window.scrollTo(0,0); });
document.getElementById("langSeg").addEventListener("click",e=>{ const b=e.target.closest("button"); if(!b||b.dataset.lang===lang) return; lang=b.dataset.lang; store.set("fn-lang",lang); render(); });
render();
})();
