K.WEEKS=()=>[
 {t:X("First tone without the clarinet","Erster Ton ohne Klarinette","Klarnetsiz ilk ses"),why:X("The first days only mouthpiece and barrel. The mouth learns the embouchure without fingers getting in the way.","Die ersten Tage nur mit Mundstück und Birne. So lernt der Mund den Ansatz, ohne dass Finger stören.","İlk günler sadece ağızlık ve fıçı. Ağız, parmaklar karışmadan dudak pozisyonunu öğrenir."),items:[
  {t:X("Assemble and place the reed","Zusammenbauen und Blatt aufsetzen","Birleştir ve kamışı tak"),d:[
    X("If the corks are stiff, rub in a little cork grease.","Wenn die Korken schwer gehen, etwas Korkfett einreiben.","Mantarlar sıkıysa biraz mantar yağı sür."),
    X("Lower joint onto the bell, then the upper joint. Press the upper rings while twisting so the bridge key lifts.","Unteres Teil auf den Becher, dann das obere. Beim Drehen die oberen Ringe drücken, damit sich die Verbindungsklappe hebt.","Alt gövdeyi kalağa, sonra üst gövdeyi tak. Çevirirken üst halkalara bas ki köprü anahtarı kalksın."),
    X("Barrel on, then the mouthpiece.","Birne drauf, dann das Mundstück.","Fıçıyı, sonra ağızlığı tak."),
    X("Wet the reed in the mouth. Flat side on the mouthpiece, tip exactly level with the mouthpiece tip.","Blatt im Mund anfeuchten. Flache Seite aufs Mundstück, Spitze genau bündig mit der Mundstückspitze.","Kamışı ağızda ıslat. Düz tarafı ağızlığa, ucu ağızlık ucuyla tam aynı hizada."),
    X("Ligature over it, tighten lightly. The reed lines up with the thumb hole at the back.","Blattschraube darüber, leicht anziehen. Das Blatt liegt in einer Linie mit dem Daumenloch hinten.","Bileziği üstüne tak, hafifçe sık. Kamış arkadaki başparmak deliğiyle aynı hizada.")]},
  {t:X("Mouthpiece + barrel give a steady tone","Mundstück + Birne geben einen geraden Ton","Ağızlık + fıçı düz bir ses veriyor"),d:[
    X("Lower lip slightly over the lower teeth, the reed rests on it.","Unterlippe leicht über die unteren Zähne, das Blatt liegt darauf.","Alt dudak alt dişlerin üstüne hafifçe gelir, kamış onun üstünde."),
    X("Upper teeth gently on top of the mouthpiece, about 1 to 1.5 cm in.","Obere Zähne sanft oben aufs Mundstück, etwa 1 bis 1,5 cm drin.","Üst dişler ağızlığın üstüne nazikçe, yaklaşık 1-1,5 cm içeride."),
    X("Mouth corners firm, chin flat, blow fast and steady.","Mundwinkel fest, Kinn flach, schnell und gleichmäßig blasen.","Dudak kenarları sıkı, çene düz, hızlı ve düzenli üfle."),
    X("Only air? Press less. Squeak? Take a little less mouthpiece.","Nur Luft? Weniger drücken. Quietschen? Etwas weniger Mundstück.","Sadece hava mı? Daha az bastır. Ciyaklama mı? Biraz daha az ağızlık al.")]},
  {t:X("Hold the tone calmly for 5 seconds","Den Ton 5 Sekunden ruhig halten","Sesi 5 saniye sakin tut"),d:[
    X("Use the air challenge further down on this page.","Nutze die Luft-Challenge weiter unten auf dieser Seite.","Bu sayfanın aşağısındaki nefes meydan okumasını kullan."),
    X("Breathe deep into the belly first, shoulders stay down.","Vorher tief in den Bauch atmen, Schultern bleiben unten.","Önce karına derin nefes al, omuzlar aşağıda kalsın."),
    X("The tone should stay the same height and volume.","Der Ton soll gleich hoch und gleich laut bleiben.","Ses aynı yükseklikte ve aynı güçte kalmalı.")]},
  {t:X("Start the tone with the tongue (“dee”)","Mit der Zunge „dii“ den Ton beginnen","Sesi dille başlat (“dii”)"),d:[
    X("Tongue tip lightly on the reed tip.","Zungenspitze leicht an die Blattspitze.","Dil ucu hafifçe kamış ucuna."),
    X("Build air pressure behind the tongue.","Hinter der Zunge Luftdruck aufbauen.","Dilin arkasında hava basıncı oluştur."),
    X("Release the tongue as in “dee”. Don't slap the reed.","Zunge wegnehmen wie bei „dii“. Nicht gegen das Blatt schlagen.","Dili “dii” der gibi çek. Kamışa vurma.")]},
  {t:X("Cheeks stay flat (mirror check)","Wangen bleiben flach (Spiegel)","Yanaklar düz kalıyor (ayna kontrolü)"),d:[
    X("Play in front of a mirror.","Vor einem Spiegel spielen.","Aynanın karşısında çal."),
    X("Puffed cheeks lose air and make the tone thin.","Dicke Backen verlieren Luft und machen den Ton dünn.","Şişik yanaklar hava kaybettirir ve sesi inceltir."),
    X("Think “ew”: corners firm, cheeks against the teeth.","Denk an „ü“: Mundwinkel fest, Wangen an den Zähnen.","“Ü” de: dudak kenarları sıkı, yanaklar dişlere yakın.")]}]},
 {t:X("Left hand: G down to C","Linke Hand: Sol bis Do","Sol el: Sol'dan Do'ya"),why:X("Whole clarinet. Start with the open G and add at most one finger per day.","Ganze Klarinette. Fang mit Sol an und nimm pro Tag höchstens einen Finger dazu.","Bütün klarnet. Açık Sol ile başla ve günde en fazla bir parmak ekle."),items:[
  {t:X("Open G: calm tone, 4 beats","Sol: ruhiger Ton, 4 Schläge","Sol: sakin ses, 4 vuruş"),go:"practice",set:{level:0,idx:0},show:{fing:"G4"},d:[
    X("Press nothing. Hold the clarinet with the right thumb under the thumb rest.","Nichts drücken. Klarinette mit dem rechten Daumen unter der Daumenstütze halten.","Hiçbir şeye basma. Klarneti sağ başparmakla dayanağın altından tut."),
    X("Hold the tone 4 beats, rest 4 beats, five times.","Ton 4 Schläge halten, 4 Schläge Pause, fünfmal.","Sesi 4 vuruş tut, 4 vuruş dinlen, beş kez."),
    X("Under “Practice” the page tells you whether the note is right (on your own website).","Unter „Üben“ sagt dir die Seite, ob der Ton stimmt (auf deiner eigenen Webseite).","“Pratik”te sayfa sesin doğru olup olmadığını söyler (kendi web sitende).")]},
  {t:X("F: thumb hole closed","Fa: Daumenloch zu","Fa: başparmak deliği kapalı"),go:"practice",set:{level:0,idx:1},show:{fing:"F4"},d:[
    X("Only the left thumb covers the hole at the back.","Nur der linke Daumen deckt das Loch hinten ab.","Sadece sol başparmak arkadaki deliği kapatır."),
    X("Use the soft pad of the thumb, flat.","Mit dem weichen Daumenballen, flach.","Başparmağın yumuşak kısmıyla, düz.")]},
  {t:X("E and D: fingers flat, holes fully closed","Mi und Re: Finger flach, Loch ganz zu","Mi ve Re: parmaklar düz, delik tam kapalı"),go:"practice",set:{level:0,idx:2},show:{fing:"D4"},d:[
    X("E: thumb + left index on hole 1.","Mi: Daumen + linker Zeigefinger auf Loch 1.","Mi: başparmak + sol işaret 1. delikte."),
    X("D: plus the left middle finger on hole 2.","Re: dazu der linke Mittelfinger auf Loch 2.","Re: artı sol orta parmak 2. delikte."),
    X("Fingertips flat, not the very tip. The ring must go down fully.","Fingerkuppen flach, nicht die Spitze. Der Ring muss ganz runter.","Parmak uçları düz, en uç değil. Halka tamamen inmeli.")]},
  {t:X("C: three fingers of the left hand","Do: drei Finger links","Do: sol elin üç parmağı"),go:"practice",set:{level:0,idx:4},show:{fing:"C4"},d:[
    X("Thumb + index, middle and ring of the left hand.","Daumen + Zeige-, Mittel- und Ringfinger links.","Başparmak + sol işaret, orta ve yüzük."),
    X("If it squeaks: one finger isn't sealing. Check each one.","Quietscht es: Ein Finger ist nicht dicht. Jeden prüfen.","Ciyaklıyorsa bir parmak kapatmıyor. Her birini kontrol et.")]},
  {t:X("G – F – E – D – C slowly down and up","Sol–Fa–Mi–Re–Do langsam runter und rauf","Sol – Fa – Mi – Re – Do yavaşça aşağı ve yukarı"),go:"songs",set:{song:4,loadSong:true,bpm:60},d:[
    X("Each note 4 beats. Lift or place one finger at a time.","Jeder Ton 4 Schläge. Immer nur einen Finger heben oder setzen.","Her ses 4 vuruş. Her seferinde bir parmak kaldır ya da koy."),
    X("Keep the air flowing during the change.","Beim Wechsel die Luft weiterfließen lassen.","Geçiş sırasında hava akmaya devam etsin.")]}]},
 {t:X("Right hand: low B to low G","Rechte Hand: Si↓ bis Sol↓","Sağ el: pes Si'den pes Sol'a"),why:X("Now the right hand joins. Every finger must seal its hole completely, or it squeaks.","Jetzt kommen die Finger der rechten Hand dazu. Jeder Finger muss das Loch ganz dicht machen, sonst quietscht es.","Şimdi sağ el katılıyor. Her parmak deliğini tamamen kapatmalı, yoksa ciyaklar."),items:[
  {t:X("Right thumb under the thumb rest","Rechter Daumen unter der Daumenstütze","Sağ başparmak dayanağın altında"),d:[
    X("The thumb rest is the small metal hook at the back of the lower joint.","Die Daumenstütze ist der kleine Metallhaken hinten am unteren Teil.","Başparmak dayanağı alt gövdenin arkasındaki küçük metal kancadır."),
    X("The right thumb carries the weight, the fingers stay relaxed above the holes.","Der rechte Daumen trägt das Gewicht, die Finger bleiben locker über den Löchern.","Sağ başparmak ağırlığı taşır, parmaklar deliklerin üstünde gevşek kalır.")]},
  {t:X("Low B, A, G held one by one","Si↓, La↓, Sol↓ einzeln halten","Pes Si, La, Sol tek tek tut"),go:"practice",set:{level:1,idx:1},show:{fing:"G3"},d:[
    X("Low B: left hand fully + right index.","Si↓: linke Hand komplett + rechter Zeigefinger.","Pes Si: sol el tamamen + sağ işaret."),
    X("Low A: + right middle. Low G: + right ring.","La↓: + rechter Mittelfinger. Sol↓: + rechter Ringfinger.","Pes La: + sağ orta. Pes Sol: + sağ yüzük."),
    X("Lower notes need a bit more air and a steady lip.","Tiefere Töne brauchen etwas mehr Luft und eine ruhige Lippe.","Pes sesler biraz daha hava ve sabit dudak ister.")]},
  {t:X("C – B – A – G without squeaking","Do–Si↓–La↓–Sol↓ ohne Quietschen","Do – Si – La – Sol ciyaklamadan"),go:"songs",set:{song:3,loadSong:true,bpm:60},d:[
    X("Going down: keep the lip exactly the same. That's where most squeaks happen.","Nach unten: Lippe genau gleich lassen. Dort passiert das meiste Quietschen.","Aşağı inerken dudağı aynen koru. Ciyaklamanın çoğu burada olur."),
    X("Use the low scale example under “Songs”.","Nutze das Beispiel „Tonleiter tief“ unter „Lieder“.","“Şarkılar”daki pes gam örneğini kullan.")]},
  {t:X("Air challenge: 8 seconds","Luft-Challenge: 8 Sekunden","Nefes meydan okuması: 8 saniye"),d:[
    X("Further down on this page. Play a calm G and time it.","Weiter unten auf dieser Seite. Spiel ein ruhiges Sol und stopp die Zeit.","Bu sayfanın aşağısında. Sakin bir Sol çal ve süreyi tut."),
    X("Breathe into the belly, let the air out slowly but steadily.","In den Bauch atmen, Luft langsam aber gleichmäßig ausströmen lassen.","Karına nefes al, havayı yavaş ama düzenli bırak.")]}]},
 {t:X("Reading notes and a first song","Noten lesen und erstes Lied","Nota okuma ve ilk şarkı"),why:X("Once you know where a note sits and how long it lasts, you can learn any song yourself.","Wenn du weißt, wo die Note steht und wie lange sie dauert, kannst du jedes Lied selbst lernen.","Notanın nerede durduğunu ve ne kadar sürdüğünü bilince her şarkıyı kendin öğrenebilirsin."),items:[
  {t:X("Find your notes on the staff","Deine Töne auf den Notenlinien finden","Seslerini portede bul"),go:"read",d:[
    X("Below the lines: C (with a ledger line), D. On the lines: E, G…","Unter den Linien: Do (mit Hilfslinie), Re. Auf den Linien: Mi, Sol…","Çizgilerin altında: Do (ek çizgiyle), Re. Çizgilerde: Mi, Sol…"),
    X("Tap each note under “Read music” and say its name aloud.","Unter „Noten lesen“ jede Note antippen und laut benennen.","“Nota okuma”da her notaya dokun ve adını yüksek sesle söyle.")]},
  {t:X("Clap whole, half and quarter notes","Ganze, Halbe, Viertel mitklatschen","Birlik, ikilik, dörtlük notaları alkışla"),go:"read",d:[
    X("Whole = 4 beats, half = 2, quarter = 1.","Ganze = 4 Schläge, Halbe = 2, Viertel = 1.","Birlik = 4 vuruş, ikilik = 2, dörtlük = 1."),
    X("Use “Listen” on each value and clap along.","Bei jedem Wert „Anhören“ drücken und mitklatschen.","Her değerde “Dinle”ye bas ve alkışla.")]},
  {t:X("First example song at tempo 50","Erstes Beispiellied bei Tempo 50","İlk örnek şarkı tempo 50'de"),go:"songs",set:{song:0,loadSong:true,bpm:50},d:[
    X("Press “Play” once and listen.","Einmal „Vorspielen“ drücken und zuhören.","Bir kez “Çal”a bas ve dinle."),
    X("Then play along. The page shows the fingering for each note.","Dann mitspielen. Die Seite zeigt den Griff für jeden Ton.","Sonra birlikte çal. Sayfa her ses için parmak pozisyonunu gösterir.")]},
  {t:X("The same song at tempo 70","Dasselbe Lied bei Tempo 70","Aynı şarkı tempo 70'te"),go:"songs",set:{song:0,loadSong:true,bpm:70},d:[
    X("Only when tempo 50 works without stopping.","Erst wenn Tempo 50 ohne Stopp klappt.","Ancak tempo 50 durmadan olunca.")]}]},
 {t:X("Very low and the throat tones","Ganz tief und die Kehltöne","En pes ve boğaz sesleri"),why:X("The lowest notes need sealed fingers and the little finger. Throat tones often sound thin at first, that's normal.","Die tiefsten Töne brauchen dichte Finger und den kleinen Finger. Die Kehltöne klingen anfangs oft dünn, das ist normal.","En pes sesler sıkı kapalı parmaklar ve serçe parmak ister. Boğaz sesleri başta ince çıkar, bu normal."),items:[
  {t:X("Low F with key F/C","Fa↓ mit Taste F/C","F/C anahtarıyla pes Fa"),go:"practice",set:{level:2,idx:1},show:{fing:"F3"},d:[
    X("All holes closed, plus the right little finger on F/C.","Alle Löcher zu, dazu der rechte kleine Finger auf F/C.","Tüm delikler kapalı, artı sağ serçe F/C'de.")]},
  {t:X("Low E with key E/B, the lowest note","Mi↓ mit Taste E/H, der tiefste Ton","E/B anahtarıyla pes Mi, en pes ses"),go:"practice",set:{level:2,idx:2},show:{fing:"E3"},d:[
    X("All holes closed, plus the right little finger on E/B.","Alle Löcher zu, dazu der rechte kleine Finger auf E/H.","Tüm delikler kapalı, artı sağ serçe E/B'de."),
    X("Any tiny leak stops this note. Check every finger.","Jede kleine Undichtigkeit verhindert diesen Ton. Jeden Finger prüfen.","En küçük kaçak bu sesi engeller. Her parmağı kontrol et.")]},
  {t:X("G♯ and A with the left index","Sol♯ und La mit dem linken Zeigefinger","Sol işaretle Sol♯ ve La"),go:"practice",set:{level:3,idx:2},show:{fing:"A4"},d:[
    X("A: roll the left index up onto the A key at the very top.","La: linken Zeigefinger nach oben auf die A-Klappe rollen.","La: sol işareti en üstteki A anahtarına yuvarla."),
    X("G♯: the small key next to it, pressed with the side of the index.","Sol♯: die kleine Klappe daneben, mit der Seite des Zeigefingers.","Sol♯: yanındaki küçük anahtar, işaretin yanıyla.")]},
  {t:X("B♭ with A key + R","Si♭ mit A-Klappe + R","A anahtarı + R ile Si♭"),go:"practice",set:{level:3,idx:3},show:{fing:"Bb4"},d:[
    X("A key with the index, plus the thumb presses R (thumb hole stays open).","A-Klappe mit dem Zeigefinger, dazu drückt der Daumen R (Daumenloch bleibt offen).","İşaretle A anahtarı, artı başparmak R'ye basar (başparmak deliği açık kalır).")]}]},
 {t:X("Over the break: the R key","Über den Bruch: die R-Klappe","Kırılmanın üstü: R anahtarı"),why:X("With R the same fingering sounds twelve notes higher. That needs more air and a steady embouchure.","Mit R wird derselbe Griff zwölf Töne höher. Dafür braucht es mehr Luft und einen stabilen Ansatz.","R ile aynı pozisyon on iki ses tiz çıkar. Daha fazla hava ve sabit dudak gerekir."),items:[
  {t:X("Low E, then add R: high B","Mi↓ spielen, dann R dazu: Si↑","Pes Mi, sonra R ekle: tiz Si"),go:"practice",set:{level:4,idx:0},show:{fing:"B4"},d:[
    X("Play low E and hold it.","Mi↓ spielen und halten.","Pes Mi çal ve tut."),
    X("Without stopping the air, the thumb also presses R.","Ohne die Luft zu stoppen, drückt der Daumen zusätzlich R.","Havayı kesmeden başparmak R'ye de basar."),
    X("The tone jumps to high B. Keep the lip still.","Der Ton springt auf Si↑. Lippe ruhig halten.","Ses tiz Si'ye atlar. Dudağı sabit tut.")]},
  {t:X("Low F → high C, low G → high D, low A → high E","Fa↓ → Do↑, Sol↓ → Re↑, La↓ → Mi↑","Pes Fa → tiz Do, pes Sol → tiz Re, pes La → tiz Mi"),go:"practice",set:{level:4,idx:1},show:{fing:"C5"},d:[
    X("Same trick: low note, then add R.","Gleicher Trick: tiefer Ton, dann R dazu.","Aynı yöntem: pes ses, sonra R ekle."),
    X("A little more air, never bite harder.","Etwas mehr Luft, nie fester beißen.","Biraz daha hava, asla daha sert ısırma.")]},
  {t:X("Keep the lip steady during the change","Beim Wechsel Lippe nicht lockern","Geçişte dudağı gevşetme"),d:[
    X("Practise in a mirror: nothing in your face should move.","Vor dem Spiegel üben: Im Gesicht soll sich nichts bewegen.","Aynada çalış: yüzünde hiçbir şey kıpırdamamalı."),
    X("If it squeaks when adding R, the lip loosened or too much mouthpiece.","Quietscht es mit R: Lippe gelockert oder zu viel Mundstück.","R eklerken ciyaklıyorsa dudak gevşedi ya da çok ağızlık var.")]},
  {t:X("Hold high C cleanly for 4 beats","Do↑ 4 Schläge sauber halten","Tiz Do'yu 4 vuruş temiz tut"),go:"practice",set:{level:4,idx:1},show:{fing:"C5"},d:[
    X("Check with the tuner under “Practice”.","Mit dem Stimmgerät unter „Üben“ prüfen.","“Pratik”teki akort cihazıyla kontrol et.")]}]},
 {t:X("Your first own song","Dein erstes eigenes Lied","İlk kendi şarkın"),why:X("Find sheet music (search “sol klarnet nota”) and write it down note by note under “Songs”.","Such ein Notenblatt (z. B. „sol klarnet nota“) und schreib es Ton für Ton unter „Lieder“ auf.","Bir nota bul (“sol klarnet nota” diye ara) ve “Şarkılar”a nota nota yaz."),items:[
  {t:X("Find sheet music","Notenblatt finden","Nota bul"),d:[
    X("Search “song name sol klarnet nota”.","Suche nach „Liedname sol klarnet nota“.","“şarkı adı sol klarnet nota” diye ara."),
    X("Sheets for G clarinet can be read directly with the fingerings here.","Noten für Sol-Klarinette kannst du direkt mit den Griffen hier lesen.","Sol klarnet notalarını buradaki pozisyonlarla doğrudan okuyabilirsin.")]},
  {t:X("Type the song under “Songs”","Lied unter „Lieder“ eintippen","Şarkıyı “Şarkılar”a yaz"),go:"songs",d:[
    X("One note after another: Sol Sol:2 La | …","Ton für Ton: Sol Sol:2 La | …","Nota nota: Sol Sol:2 La | …"),
    X("Comma for low notes, apostrophe for high notes.","Komma für tiefe Töne, Apostroph für hohe.","Pes sesler için virgül, tiz sesler için kesme işareti.")]},
  {t:X("First line slowly without mistakes","Erste Zeile langsam ohne Fehler","İlk satır yavaşça hatasız"),go:"songs",d:[
    X("Lower the tempo until it works without mistakes.","Tempo runter, bis es fehlerfrei klappt.","Hatasız olana kadar tempoyu düşür.")]},
  {t:X("Whole song slowly","Ganzes Lied langsam","Bütün şarkı yavaşça"),go:"songs",d:[
    X("Breathe at rests and at the end of phrases.","An Pausen und am Ende von Phrasen atmen.","Suslarda ve cümle sonlarında nefes al.")]}]},
 {t:X("First Turkish colour","Erste türkische Färbung","İlk Türk rengi"),why:X("Only now vibrato and sliding, very carefully. The core tone must stay calm.","Jetzt erst Vibrato und Gleiten, ganz vorsichtig. Der Grundton muss ruhig bleiben.","Ancak şimdi vibrato ve kaydırma, çok dikkatli. Ana ses sakin kalmalı."),items:[
  {t:X("Listen to a lot of Turkish clarinet","Viel türkische Klarinette anhören","Bolca Türk klarneti dinle"),d:[
    X("Daily, 10 minutes. Listen to how long notes are shaped.","Täglich 10 Minuten. Achte darauf, wie lange Töne geformt werden.","Her gün 10 dakika. Uzun seslerin nasıl şekillendiğine dikkat et.")]},
  {t:X("Vibrato on G, slow and even","Vibrato auf Sol, langsam und gleichmäßig","Sol'da vibrato, yavaş ve düzenli"),go:"practice",set:{level:0,idx:0},d:[
    X("Move the lower jaw very slightly, like saying “ya-ya-ya” silently.","Unterkiefer ganz leicht bewegen, wie stumm „ja-ja-ja“.","Alt çeneyi çok hafifçe oynat, sessizce “ya-ya-ya” der gibi."),
    X("Start with 4 waves per beat at tempo 60.","Mit 4 Wellen pro Schlag bei Tempo 60 beginnen.","Tempo 60'ta vuruş başına 4 dalgayla başla.")]},
  {t:X("Bend a note slightly down and back","Einen Ton leicht nach unten ziehen und zurück","Bir sesi hafifçe aşağı bük ve geri getir"),d:[

  {t:X("Your song with some vibrato","Dein Lied mit etwas Vibrato","Biraz vibratoyla şarkın"),go:"songs",d:[

K.ROUTINE=()=>[
 {m:2,t:X("Arrive and breathe","Ankommen und atmen","Hazırlan ve nefes al"),d:X("Assemble, wet the reed. Three deep breaths into the belly, shoulders loose.","Zusammenbauen, Blatt anfeuchten. 3 tiefe Atemzüge in den Bauch, Schultern locker.","Birleştir, kamışı ıslat. Karına üç derin nefes, omuzlar gevşek.")},
 {m:5,t:X("Long tones","Lange Töne","Uzun sesler"),d:X("G, F, E, D, C: hold each 4 beats, rest 4 beats. Straight and calm.","Sol, Fa, Mi, Re, Do: jeden Ton 4 Schläge halten, 4 Schläge Pause. Gerade und ruhig.","Sol, Fa, Mi, Re, Do: her birini 4 vuruş tut, 4 vuruş dinlen. Düz ve sakin.")},
 {m:6,t:X("New notes of your week","Neue Töne aus deiner Woche","Haftanın yeni sesleri"),d:X("Your current level under “Practice”. Slowly, check with the tuner.","Die aktuelle Stufe unter „Üben“. Langsam, mit dem Stimmgerät prüfen.","“Pratik” bölümündeki seviyen. Yavaşça, akort cihazıyla kontrol et.")},
 {m:6,t:X("A song","Ein Lied","Bir şarkı"),d:X("Your song under “Songs”, slowly. Slow and right beats fast and wrong.","Dein Lied unter „Lieder“, langsam. Lieber langsam richtig als schnell falsch.","“Şarkılar”daki şarkın, yavaşça. Yavaş ve doğru, hızlı ve yanlıştan iyidir.")},
 {m:1,t:X("Care","Pflege","Bakım"),d:X("Reed off, swab through, parts into the case.","Blatt ab, Durchzieher durch, Teile in den Koffer.","Kamışı çıkar, temizleme bezini geçir, parçaları kutuya koy.")}
];
K.PROBS=()=>[
 {p:X("Only air, no tone","Es kommt nur Luft, kein Ton","Sadece hava çıkıyor, ses yok"),f:[[X("Biting too hard","Zu fest gebissen","Çok sert ısırmak"),X("The soft reed gets closed. Barely rest the lip and give more air.","Das weiche Blatt wird zugedrückt. Lippe fast nur anlegen und mehr Luft geben.","Yumuşak kamış kapanıyor. Dudağı neredeyse sadece dayat ve daha çok hava ver.")],[X("Too little mouthpiece in the mouth","Zu wenig Mundstück im Mund","Ağızda çok az ağızlık"),X("Take a little more mouthpiece step by step until the tone starts.","Stück für Stück mehr Mundstück nehmen, bis der Ton anspringt.","Ses çıkana kadar adım adım biraz daha ağızlık al.")],[X("Reed crooked or too low","Blatt schief oder zu weit unten","Kamış eğri ya da çok aşağıda"),X("Reed tip exactly level with the mouthpiece tip, reed straight.","Blattspitze genau bündig mit der Mundstückspitze, Blatt gerade.","Kamış ucu tam ağızlık ucuyla aynı hizada, kamış düz.")],[X("Too little air","Zu wenig Luft","Çok az hava"),X("Blow fast and steady, like blowing out a candle far away.","Schnell und gleichmäßig blasen, wie eine Kerze weit weg auspusten.","Hızlı ve düzenli üfle, uzaktaki bir mumu söndürür gibi.")]]},
 {p:X("It squeaks","Es quietscht","Ciyaklıyor"),f:[[X("Lip loosens or jaw drops","Lippe lockert sich oder Kiefer fällt","Dudak gevşiyor ya da çene düşüyor"),X("The most common cause. Keep the embouchure the same during the tone, especially going down.","Der häufigste Grund. Ansatz während des Tons gleich lassen, gerade bei Tönen nach unten.","En sık sebep. Ses boyunca dudak pozisyonunu aynı tut, özellikle aşağı inerken.")],[X("Too much mouthpiece","Zu viel Mundstück im Mund","Ağızda çok fazla ağızlık"),X("Take a few millimetres less.","Ein paar Millimeter weniger nehmen.","Birkaç milimetre daha az al.")],[X("A hole not fully closed","Ein Loch nicht ganz zu","Bir delik tam kapalı değil"),X("Lay the fingertip flat. The rings show by pressure whether it seals.","Fingerkuppe flach auflegen. Die Ringe zeigen mit Druck, ob es dicht ist.","Parmak ucunu düz koy. Halkalar baskıyla kapanıp kapanmadığını gösterir.")],[X("Hard attack with the tongue","Harter Einsatz mit der Zunge","Dille sert başlangıç"),X("Release the tongue gently (“dee”), don't slap the reed.","Zunge nur leicht wegnehmen („dii“), nicht gegen das Blatt schlagen.","Dili hafifçe çek (“dii”), kamışa vurma.")],[X("Blowing before the embouchure is set","Erst blasen, dann Ansatz","Dudak hazır olmadan üflemek"),X("Form the embouchure fully, then start the air.","Erst Ansatz fertig formen, dann die Luft starten.","Önce dudağı tam oluştur, sonra havayı başlat.")],[X("Broken reed or leaking pad","Blatt kaputt oder Polster undicht","Kamış bozuk ya da ped kaçırıyor"),X("Try another reed. If the same notes squeak with every reed, have a repair shop check it.","Anderes Blatt probieren. Quietscht es mit jedem Blatt bei denselben Tönen: Werkstatt prüfen lassen.","Başka kamış dene. Her kamışta aynı sesler ciyaklıyorsa tamirciye göster.")]]},
 {p:X("Tone sounds thin or shaky","Ton klingt dünn oder zittert","Ses ince ya da titrek"),f:[[X("Puffed cheeks","Wangen dick","Şişik yanaklar"),X("Firm mouth corners like saying “ew”, cheeks flat.","Mundwinkel fest wie bei „ü“, Wangen flach.","Dudak kenarları “ü” der gibi sıkı, yanaklar düz.")],[X("Wobbly air","Luft wackelt","Hava titrek"),X("Support from the belly. Practise long tones with equal pressure.","Aus dem Bauch stützen. Lange Töne mit gleichem Druck üben.","Karından destekle. Eşit basınçla uzun sesler çalış.")],[X("Tired lips","Lippen müde","Yorgun dudaklar"),X("Take a break. Embouchure strength grows over weeks, not in a day.","Pause machen. Ansatz-Kraft kommt in Wochen, nicht an einem Tag.","Mola ver. Dudak gücü bir günde değil haftalar içinde gelişir.")]]},
 {p:X("Tone too high or too low","Ton zu hoch oder zu tief","Ses çok tiz ya da çok pes"),f:[[X("Too high","Zu hoch","Çok tiz"),X("Loosen the lip a little, don't bite. Maybe pull the barrel out a millimetre.","Lippe etwas lockerer, nicht beißen. Birne evtl. einen Millimeter herausziehen.","Dudağı biraz gevşet, ısırma. Gerekirse fıçıyı bir milimetre dışarı çek.")],[X("Too low","Zu tief","Çok pes"),X("A bit more air, lip minimally firmer. Push the barrel all the way in.","Etwas mehr Luft, Lippe minimal fester. Birne ganz hineinschieben.","Biraz daha hava, dudak çok az daha sıkı. Fıçıyı tamamen it.")],[X("Cold clarinet","Klarinette ist kalt","Klarnet soğuk"),X("Play a few minutes to warm up first, then tune.","Erst ein paar Minuten warm spielen, dann stimmen.","Önce birkaç dakika ısın, sonra akort et.")]]},
 {p:X("Only certain notes fail","Nur bestimmte Töne gehen nicht","Sadece bazı sesler çıkmıyor"),f:[[X("Low notes","Tiefe Töne","Pes sesler"),X("Usually a right-hand finger isn't sealing, or the little finger doesn't press fully.","Meist ein Finger rechts nicht ganz dicht, oder der kleine Finger drückt nicht ganz.","Genelde sağ elde bir parmak tam kapatmıyor ya da serçe tam basmıyor.")],[X("High notes with R","Hohe Töne mit R","R ile tiz sesler"),X("More air, hold the embouchure. The thumb must cover the hole and press R together.","Mehr Luft und Ansatz halten. Daumen muss Loch und R gleichzeitig drücken.","Daha çok hava, dudağı koru. Başparmak deliği kapatıp R'ye birlikte basmalı.")],[X("Always the same note","Immer derselbe Ton","Hep aynı ses"),X("A pad at that spot leaks or is bent. Ask a repair shop.","Polster an dieser Stelle undicht oder verbogen. Werkstatt fragen.","O noktadaki ped kaçırıyor ya da eğik. Tamirciye sor.")]]},
 {p:X("Lip or teeth hurt","Lippe oder Zähne tun weh","Dudak ya da dişler acıyor"),f:[[X("Too much pressure","Zu viel Druck","Çok fazla baskı"),X("Bite less, hold more with the mouth corners.","Weniger beißen, mehr mit den Mundwinkeln halten.","Daha az ısır, daha çok dudak kenarlarıyla tut.")],[X("Lower lip presses on the teeth","Unterlippe drückt auf die Zähne","Alt dudak dişlere bastırıyor"),X("Pause briefly. Some players use a thin lip protector at first.","Kurz pausieren. Manche nutzen anfangs einen dünnen Lippenschutz.","Kısa mola ver. Bazıları başta ince bir dudak koruyucu kullanır.")],[X("Mouthpiece slips on top","Oben rutscht das Mundstück","Ağızlık üstte kayıyor"),X("A mouthpiece patch on top helps grip.","Ein Mundstückpflaster oben hilft beim Halten.","Üste yapıştırılan bir ağızlık bandı tutuşa yardım eder.")]]}
];

K.tunerLead=()=>`<h2>${X("Which note am I playing?","Welchen Ton spiele ich?","Hangi sesi çalıyorum?")}</h2><p class="lead">${X("A clarinet isn't tuned note by note like a guitar. Play any note: the page shows which written note it is for G clarinet and whether it's a bit high or low. Only the overall pitch can be adjusted slightly by pulling out the barrel (lower) or pushing it in (higher).","Eine Klarinette stimmt man nicht Ton für Ton wie eine Gitarre. Spiel einen beliebigen Ton: Die Seite zeigt, welcher geschriebene Ton für Sol-Klarinette es ist und ob er etwas zu hoch oder zu tief ist. Nur die Gesamtstimmung lässt sich leicht ändern: Birne herausziehen (tiefer) oder hineinschieben (höher).","Klarnet gitar gibi ses ses akort edilmez. Herhangi bir ses çal: sayfa bunun Sol klarnet için hangi yazılı ses olduğunu ve biraz tiz ya da pes olup olmadığını gösterir. Sadece genel akort hafifçe değiştirilebilir: fıçıyı dışarı çek (pes) ya da içeri it (tiz).")}</p>`;
K.title=()=>X("Learn the G clarinet","Sol-Klarinette lernen","Sol klarnet öğren");
K.intro=()=>X("For the Turkish G clarinet (Sol klarnet, Boehm system). See the fingering, play the note, and the page listens and tells you whether it's right.","Für die türkische G-Klarinette (Sol klarnet, Böhm-System). Griff ansehen, Ton spielen, die Seite hört zu und sagt dir, ob er stimmt.","Türk Sol klarneti için (Böhm sistemi). Parmak pozisyonuna bak, sesi çal, sayfa dinler ve doğru olup olmadığını söyler.");
K.keyFacts=()=>`<div class="facts">
 <div><b>${X("You only need a few at first","Am Anfang brauchst du nur wenige","Başta sadece birkaçı lazım")}</b><span>${X("Thumb hole, six holes, R, A, G♯ and at the bottom E/B and F/C. Everything else is for fast runs later.","Daumenloch, 6 Löcher, R, A, G♯ und unten E/H und F/C. Alles andere ist für schnelle Läufe später.","Başparmak deliği, altı delik, R, A, G♯ ve altta E/B ile F/C. Gerisi sonradan hızlı pasajlar için.")}</span></div>
 <div><b>${X("Some keys are doubled","Manche Tasten sind doppelt","Bazı anahtarlar çift")}</b><span>${X("E and F exist for both little fingers. Both move the same pad, so something moves when you press the other side. That's correct.","E und F gibt es für den linken und rechten kleinen Finger. Beide bewegen dasselbe Polster. Darum bewegt sich etwas, wenn du die andere Seite drückst. Das ist richtig so.","E ve F iki serçe parmak için de var. İkisi de aynı pedi hareket ettirir, bu yüzden diğer tarafa basınca bir şey oynar. Bu doğrudur.")}</span></div>
 <div><b>${X("Rings move other pads","Die Ringe bewegen andere Polster","Halkalar başka pedleri hareket ettirir")}</b><span>${X("Covering a hole with a ring pushes the ring down. Via a rod it closes a pad somewhere else.","Deckst du ein Loch mit Ring zu, drückst du den Ring mit runter. Über eine Stange schließt er ein Polster an anderer Stelle.","Halkalı bir deliği kapatınca halka da iner. Bir çubuk üzerinden başka bir yerde bir pedi kapatır.")}</span></div>
 <div><b>${X("Two names per key","Zwei Namen pro Taste","Her anahtara iki isim")}</b><span>${X("E/B means: without R you get E, with R the same fingering gives B (twelve notes higher). Same for F/C.","E/H heißt: ohne R kommt E, mit R derselbe Griff als H (zwölf Töne höher). Genauso F/C.","E/B şu demek: R olmadan Mi, R ile aynı pozisyon Si (on iki ses tiz). F/C de aynı.")}</span></div></div>`;

bind:{
start(root){
  bindPath(root,M.WEEKS(),M.key+"-path",M,v=>v&&v.fing?{svg:M.svg(M.byId[v.fing].k),steps:M.steps(M.byId[v.fing].k)}:null); bindRoutine(root,M.ROUTINE()); bindFix(root,M.PROBS());
  const $=id=>root.querySelector("#"+id); if(!$("kAirBtn")){ if(M.sideBind) M.sideBind(root); return; } let raf=null,t0=0,best=store.get(M.key+"-air",0);
  const fmt=s=>s.toFixed(1)+" s";
  const showBest=()=>$("kAirBest").textContent=best?fill(X("Your record: {s} seconds","Dein Rekord: {s} Sekunden","Rekorun: {s} saniye"),{s:best.toFixed(1)}):X("No record yet.","Noch kein Rekord.","Henüz rekor yok.");
  $("kAirBtn").onclick=()=>{ if(raf){ cancelAnimationFrame(raf); raf=null; const s=(performance.now()-t0)/1000; if(s>best){ best=s; store.set(M.key+"-air",best); } showBest(); $("kAirBtn").textContent=X("Start","Start","Başla"); return; }
    t0=performance.now(); $("kAirBtn").textContent=X("Stop","Stopp","Durdur");
    const run=()=>{ $("kAirClock").textContent=fmt((performance.now()-t0)/1000); raf=requestAnimationFrame(run); }; run();
    running.add(()=>{ if(raf){cancelAnimationFrame(raf); raf=null;} }); };
  showBest();
},
practice(root){
  const S=M.state, $=id=>root.querySelector("#"+id), LV=M.LEVELS(); if(S.level>=LV.length) S.level=0; store.set(M.key+"-level",S.level);
  let hold=0, smooth=[];
  const status=(txt,cls="")=>{ $("kStatus").textContent=txt; $("kStatus").className="status "+cls; };
  const draw=()=>{ const n=M.byId[LV[S.level].notes[S.idx]];
    $("kLevels").innerHTML=LV.map((l,i)=>`<button class="chip" data-l="${i}" aria-pressed="${i===S.level}" style="font-size:.85rem;padding:6px 11px">${l.n}</button>`).join("");
    $("kDiag").innerHTML=M.svg(n.k); $("kSteps").innerHTML=M.steps(n.k);
    $("kName").textContent=M.nm(n.m);
    $("kSub").textContent=`(${M.sub(n.m)}) · ${M.regName(n.m)}${M.SHIFT%12?" · "+X("sounds","klingt","duyulan")+" "+noteName(n.m+M.SHIFT):""}`;
    $("kChips").innerHTML=LV[S.level].notes.map((id,i)=>`<button class="chip ${S.done.has(i)&&i!==S.idx?"done":""}" data-i="${i}" aria-pressed="${i===S.idx}">${M.nm(M.byId[id].m)}</button>`).join(""); };
  const next=()=>{ S.idx=(S.idx+1)%LV[S.level].notes.length; if(S.idx===0) S.done.clear(); hold=0; draw(); };
  $("kLevels").onclick=e=>{ const b=e.target.closest("button"); if(!b) return; S.level=+b.dataset.l; store.set(M.key+"-level",S.level); S.idx=0; S.done.clear(); draw(); status(X("New level. Look at the fingering.","Neue Stufe. Schau dir den Griff an.","Yeni seviye. Parmak pozisyonuna bak.")); };
  $("kChips").onclick=e=>{ const b=e.target.closest("button"); if(!b) return; S.idx=+b.dataset.i; hold=0; draw(); status(X("Look at the fingering and play the note.","Schau dir den Griff an und spiel den Ton.","Parmak pozisyonuna bak ve sesi çal.")); };
  $("kPlay").onclick=()=>M.tone(M.byId[LV[S.level].notes[S.idx]].m,1.4);
  const onPitch=f=>{ if(f<0){ hold=0; smooth=[]; $("kHeard").innerHTML="&nbsp;"; return; }
    smooth.push(f); if(smooth.length>5) smooth.shift(); const fs=[...smooth].sort((a,b)=>a-b)[smooth.length>>1];
    const n=M.byId[LV[S.level].notes[S.idx]], w=69+12*Math.log2(fs/440)-M.SHIFT, diff=(w-n.m)*100-(n.c||0), near=Math.round(w);
    $("kHeard").textContent=fill(X("Heard: {n} · {h} Hz","Gehört: {n} · {h} Hz","Duyulan: {n} · {h} Hz"),{n:M.nm(near),h:fs.toFixed(0)});
    if(Math.abs(diff)>250){ setNeedle($("kNeedle"),diff>0?100:-100); status(diff>0?X("Different note, too high. Check the fingering.","Anderer Ton, zu hoch. Griff prüfen.","Farklı ses, çok tiz. Parmakları kontrol et."):X("Different note, too low. Check the fingering.","Anderer Ton, zu tief. Griff prüfen.","Farklı ses, çok pes. Parmakları kontrol et."),"warn"); hold=0; return; }
    setNeedle($("kNeedle"),diff*2);
    if(Math.abs(diff)<=30){ if(!hold) hold=performance.now(); const held=(performance.now()-hold)/1000;
      status(held>1.2?X("Correct! Well done.","Richtig! Weiter so.","Doğru! Aferin."):X("Good, hold it…","Gut, halten…","İyi, tut…"),"ok");
      if(held>1.2){ S.done.add(S.idx); hold=performance.now()+1e9; const t=setTimeout(next,600); running.add(()=>clearTimeout(t)); } }
    else { hold=0; status(M.hint(diff>0),"warn"); } };
  $("kMic").onclick=async()=>{ if(mic.on){ mic.stop(); $("kMic").textContent=X("Start listening","Zuhören starten","Dinlemeye başla"); return; }
    const ok=await mic.start(onPitch,90,1100); if(!ok){ $("kMicNote").textContent=micBlocked(); $("kMicNote").hidden=false; return; }
    $("kMicNote").hidden=true; $("kMic").textContent=X("Stop listening","Zuhören stoppen","Dinlemeyi durdur"); status(X("Listening. Play the note.","Ich höre zu. Spiel den Ton.","Dinliyorum. Sesi çal.")); };
  draw(); setNeedle($("kNeedle"),0); status(X("Press “Start listening”","Drück auf „Zuhören starten“","“Dinlemeye başla”ya bas"));
},
fingers(root){
  const S=M.state, $=id=>root.querySelector("#"+id);
  const draw=()=>{ const n=M.byId[S.fing];
    $("kChart").innerHTML=M.N.map(x=>`<tr class="click" data-id="${x.id}" tabindex="0" aria-selected="${x.id===S.fing}"><td class="strong">${M.nm(x.m)}</td><td>${M.sub(x.m)}</td><td>${M.regName(x.m)}${(Array.isArray(x.k)&&x.k.includes("R"))?" (R)":""}</td><td>${noteName(x.m+M.SHIFT)}</td></tr>`).join("");
    $("kFDiag").innerHTML=M.svg(n.k); $("kFSteps").innerHTML=M.steps(n.k); $("kFTitle").textContent=fill(X("How to finger {n}:","So greifst du {n}:","{n} nasıl basılır:"),{n:M.nm(n.m)}); };
  const act=e=>{ const r=e.target.closest("tr[data-id]"); if(!r) return; S.fing=r.dataset.id; draw(); M.tone(M.byId[S.fing].m,1.2); };
  $("kChart").onclick=act; $("kChart").onkeydown=e=>{ if(e.key==="Enter") act(e); }; draw();
},
read(root){
  const S=M.state, $=id=>root.querySelector("#"+id);
  const col=M.color;
  const show=id=>{ S.read=id; const n=M.byId[id], i=M.N.indexOf(n);
    $("kStaff").innerHTML=staffSVG(M.N.map(x=>({w:x.m,label:(M.staffLabel||M.nm)(x.m),color:col(x.m)})),i,{dx:M.staffDx||44});
    $("kRDiag").innerHTML=M.svg(n.k); $("kRSteps").innerHTML=M.steps(n.k); $("kRName").textContent=M.nm(n.m);
    $("kRSub").textContent=`(${M.sub(n.m)}) · ${M.regName(n.m)}${M.SHIFT%12?" · "+X("sounds","klingt","duyulan")+" "+noteName(n.m+M.SHIFT):""}`; };
  const act=e=>{ const g=e.target.closest(".staff-note"); if(!g) return; const id=M.N[+g.dataset.i].id; show(id); M.tone(M.byId[id].m,1.2); };
  $("kStaff").onclick=act; $("kStaff").onkeydown=e=>{ if(e.key==="Enter"||e.key===" "){ e.preventDefault(); act(e); } };
  $("kRPlay").onclick=()=>M.tone(M.byId[S.read].m,1.2); show(S.read);
  bindDurs(root,d=>M.tone(67,d));
},
songs(root){
  bindSongLib(root,M);
  const S=M.state, $=id=>root.querySelector("#"+id); let flat=[], timers=[];
  $("kSongSel").innerHTML=`<option value="-1">–</option>`+M.SONGS.map((s,i)=>`<option value="${i}">${typeof s.n==="function"?s.n():s.n}</option>`).join("");
  $("kSongSel").value=S.song; $("kBpm").value=S.bpm; $("kBpmVal").textContent=S.bpm;
  const label=n=>n.rest?X("Rest","Pause","Sus"):n.bad?n.label:M.nm(n.m);
  const beatsTxt=b=>b===1?X("1 beat","1 Schlag","1 vuruş"):b<1?X("½ beat","½ Schlag","½ vuruş"):fill(X("{n} beats","{n} Schläge","{n} vuruş"),{n:b});
  const render=()=>{ const bars=M.parse($("kSongText").value); flat=[];
    $("kSong").innerHTML=bars.map((bar,bi)=>`<div class="sbar"><span class="num">${bi+1}</span>${bar.map(n=>{ const i=flat.push(n)-1;
      return `<button class="nb ${n.rest?"rest":n.bad?"bad":""}" style="--b:${Math.max(.5,n.beats)}" data-i="${i}"><b>${label(n)}</b><span class="muted small">${n.bad?X("unknown","unbekannt","bilinmiyor"):beatsTxt(n.beats)}</span></button>`; }).join("")}</div>`).join("")||`<p class="muted">${X("No notes yet. Type for example: Do Re Mi","Noch keine Töne. Schreib z. B.: Do Re Mi","Henüz ses yok. Örneğin yaz: Do Re Mi")}</p>`; };
  const now=i=>{ root.querySelectorAll(".nb.cur").forEach(b=>b.classList.remove("cur")); const b=root.querySelector(`.nb[data-i="${i}"]`); if(b) b.classList.add("cur");
    const n=flat[i]; if(!n) return;
    if(n.rest||n.bad){ $("kNpTitle").textContent=n.rest?X("Rest: don't play, take a quick breath","Pause: nichts spielen, kurz atmen","Sus: çalma, kısa nefes al"):X("I don't know this note","Diesen Ton kenne ich nicht","Bu sesi tanımıyorum"); $("kNpDiag").innerHTML=""; $("kNpSteps").innerHTML=""; }
    else { const k=M.byMidi(n.m).k; $("kNpTitle").textContent=`${M.nm(n.m)} · ${beatsTxt(n.beats)}`; $("kNpDiag").innerHTML=M.svg(k); $("kNpSteps").innerHTML=M.steps(k); }
    const nx=flat.slice(i+1).find(x=>!x.rest&&!x.bad); $("kNpNext").textContent=nx?X("Next:","Danach:","Sonra:")+" "+label(nx):X("End of song","Ende des Lieds","Şarkının sonu"); };
  const stop=()=>{ timers.forEach(clearTimeout); timers=[]; $("kSPlay").textContent=X("Play","Vorspielen","Çal"); };
  $("kSPlay").onclick=()=>{ stop(); ctx(); const beat=60/S.bpm; let t=0;
    for(let k=0;k<4;k++){ timers.push(setTimeout(()=>click(k===0),t*1000)); t+=beat; }
    flat.forEach((n,i)=>{ const at=t; timers.push(setTimeout(()=>{ now(i); if(!n.rest&&!n.bad) M.tone(n.m,n.beats*beat*.9); },at*1000)); t+=n.beats*beat; });
    timers.push(setTimeout(stop,t*1000)); $("kSPlay").textContent=X("Playing…","Läuft…","Çalıyor…"); running.add(stop); };
  $("kSStop").onclick=stop;
  $("kSong").onclick=e=>{ const b=e.target.closest(".nb"); if(!b) return; const i=+b.dataset.i; now(i); const n=flat[i]; if(n&&!n.rest&&!n.bad) M.tone(n.m,1.1); };
  $("kBpm").oninput=()=>{ S.bpm=+$("kBpm").value; $("kBpmVal").textContent=S.bpm; };
  $("kSongSel").onchange=()=>{ S.song=+$("kSongSel").value; if(S.song>=0){ $("kSongText").value=M.SONGS[S.song].txt; store.set(M.key+"-song",$("kSongText").value); } stop(); render(); now(0); };
  let typing; $("kSongText").oninput=()=>{ clearTimeout(typing); typing=setTimeout(()=>{ store.set(M.key+"-song",$("kSongText").value); render(); },250); };
  if(S.loadSong&&S.song>=0){ store.set(M.key+"-song",M.SONGS[S.song].txt); S.loadSong=false; }
  $("kSongText").value=store.get(M.key+"-song",M.SONGS[0].txt); render(); now(0);
},
tuner(root){
  const $=id=>root.querySelector("#"+id);
  $("kTMic").onclick=async()=>{ if(mic.on){ mic.stop(); $("kTMic").textContent=X("Start listening","Zuhören starten","Dinlemeye başla"); return; }
    const ok=await mic.start(f=>{ if(f<0){ $("kTHz").innerHTML="&nbsp;"; return; } const w=69+12*Math.log2(f/440)-M.SHIFT; let near=Math.round(w), cents=(w-near)*100, label=M.nm(near);
      if(M.identify){ const r=M.identify(w); near=r.m; cents=r.cents; label=r.name; }
      $("kTName").textContent=label; $("kTSub").textContent=`${X("written","geschrieben","yazılan")} ${noteName(near)} · ${cents>0?"+":""}${cents.toFixed(0)} cent`;
      $("kTHz").textContent=`${f.toFixed(1)} Hz · ${X("sounds","klingt","duyulan")} ${noteName(near+M.SHIFT)}`; setNeedle($("kTNeedle"),cents); },90,1100);
    if(!ok){ $("kTNote").textContent=micBlocked(); $("kTNote").hidden=false; return; }
    $("kTNote").hidden=true; $("kTMic").textContent=X("Stop listening","Zuhören stoppen","Dinlemeyi durdur"); };
  setNeedle($("kTNeedle"),0);
},
tips(){}
}};
}

K.attack=()=>`<h2 style="margin-top:22px">${X("Tongue: how a tone starts","Zunge: so beginnt ein Ton","Dil: ses nasıl başlar")}</h2><p class="lead" style="margin-bottom:0">${X("Rest the tongue tip lightly on the reed, build air pressure, then release the tongue as in “dee”. Don't slap the reed, that gives hard, squeaky starts.","Zungenspitze leicht ans Blatt legen, Luftdruck aufbauen, dann die Zunge wegnehmen wie bei „dii“. Nicht gegen das Blatt schlagen, das gibt harte, quietschige Einsätze.","Dil ucunu hafifçe kamışa koy, hava basıncı oluştur, sonra “dii” der gibi dili çek. Kamışa vurma, bu sert ve ciyaklı başlangıçlar yapar.")}</p>`;
K.care=()=>`<div class="two">
 <div class="panel"><h2>${X("Assembling","Zusammenbauen","Birleştirme")}</h2><ol class="plain">
  <li>${X("If the corks are stiff, rub in a little cork grease first.","Korken vorher mit etwas Korkfett einreiben, wenn sie schwer gehen.","Mantarlar sıkıysa önce biraz mantar yağı sür.")}</li>
  <li>${X("Twist the lower joint onto the bell. Hold parts by the body, not the keys.","Unteres Teil auf den Becher drehen. Teile am Körper anfassen, nicht an den Klappen.","Alt gövdeyi kalağa çevirerek tak. Parçaları gövdeden tut, anahtarlardan değil.")}</li>
  <li>${X("Twist the upper joint on while pressing its rings, so the bridge key lifts and nothing bends. The levers must line up.","Oberes Teil aufdrehen und dabei die Ringe drücken, damit sich die Verbindungsklappe hebt und nichts verbiegt. Die Hebel müssen übereinander liegen.","Üst gövdeyi takarken halkalarına bas ki köprü anahtarı kalksın ve hiçbir şey eğilmesin. Kollar hizalanmalı.")}</li>
  <li>${X("Add the barrel, then the mouthpiece.","Birne aufsetzen, dann das Mundstück.","Fıçıyı, sonra ağızlığı tak.")}</li>
  <li>${X("Wet the reed briefly in the mouth. Flat side on the mouthpiece, tip level with the mouthpiece tip. Ligature over it, tighten only lightly.","Blatt kurz im Mund anfeuchten. Flache Seite aufs Mundstück, Spitze bündig mit der Mundstückspitze. Blattschraube darüber, nur leicht anziehen.","Kamışı ağızda kısaca ıslat. Düz tarafı ağızlığa, ucu ağızlık ucuyla aynı hizada. Bileziği üstüne tak, hafifçe sık.")}</li>
  <li>${X("The reed faces down towards the lower lip, in line with the thumb hole at the back.","Das Blatt zeigt nach unten zur Unterlippe, in einer Linie mit dem Daumenloch hinten.","Kamış aşağıya, alt dudağa bakar, arkadaki başparmak deliğiyle aynı hizada.")}</li></ol></div>
 <div class="panel"><h2>${X("After playing","Nach dem Spielen","Çaldıktan sonra")}</h2><ol class="plain">
  <li>${X("Take the reed off, wipe it, let it dry flat in a reed case. Never leave it on the mouthpiece.","Blatt abnehmen, abwischen, flach im Blattetui trocknen lassen. Nie auf dem Mundstück lassen.","Kamışı çıkar, sil, kamış kutusunda düz kurut. Asla ağızlıkta bırakma.")}</li>
  <li>${X("Pull the swab through each part 2 to 3 times, from the top end.","Jedes Teil 2 bis 3 Mal mit dem Durchzieher trocknen, vom oberen Ende her.","Her parçadan temizleme bezini 2-3 kez üstten geçir.")}</li>
  <li>${X("Rinse the mouthpiece with lukewarm water and dry it with a lint-free cloth. No hot water.","Mundstück mit lauwarmem Wasser ausspülen und fusselfrei trocknen. Kein heißes Wasser.","Ağızlığı ılık suyla durula, tüy bırakmayan bezle kurula. Sıcak su yok.")}</li>
  <li>${X("Lay the parts loosely in the case. Leave the case open briefly so it dries.","Teile locker in den Koffer legen. Koffer kurz offen lassen.","Parçaları kutuya gevşekçe koy. Kuruması için kutuyu biraz açık bırak.")}</li>
  <li>${X("Rotate several reeds. Throw away a reed with a crack or frayed tip.","Mehrere Blätter abwechselnd spielen. Ein Blatt mit Riss sofort wegwerfen.","Birkaç kamışı sırayla kullan. Çatlak ya da ucu yıpranmış kamışı at.")}</li></ol></div>
</div>
<div class="panel"><h2>${X("The Turkish sound (from about week 8)","Der türkische Klang (ab etwa Woche 8)","Türk sesi (yaklaşık 8. haftadan itibaren)")}</h2><p class="lead">${X("Start these only once a calm, straight tone comes reliably. Otherwise you build in a wobble that is hard to remove.","Erst wenn ein ruhiger, gerader Ton sicher kommt. Sonst gewöhnst du dir ein Wackeln an, das schwer wieder weggeht.","Bunlara ancak sakin, düz bir ses güvenle çıkınca başla. Yoksa sonradan zor giden bir titreme alışkanlığı edinirsin.")}</p>
 <div class="facts">
  <div><b>${X("Listen a lot","Viel hören","Bolca dinle")}</b><span>${X("Listen to G clarinet in Turkish music every day. The ear learns the sound before the fingers can.","Hör dir Sol-Klarinette in türkischer Musik jeden Tag an. Das Ohr lernt den Klang vor den Fingern.","Her gün Türk müziğinde Sol klarnet dinle. Kulak sesi parmaklardan önce öğrenir.")}</span></div>
  <div><b>${X("Vibrato","Vibrato","Vibrato")}</b><span>${X("A light, even wave in the tone, from the lower jaw with tiny movement. Practise slowly, e.g. 4 waves per beat at tempo 60.","Ein leichtes, gleichmäßiges Wellen im Ton, aus dem Unterkiefer, ganz wenig Bewegung. Erst langsam, z. B. 4 Wellen pro Schlag bei Tempo 60.","Seste hafif, düzenli bir dalga, alt çeneden çok az hareketle. Yavaş çalış, örneğin tempo 60'ta vuruş başına 4 dalga.")}</span></div>
  <div><b>${X("Sliding","Gleiten","Kaydırma")}</b><span>${X("Bend the tone up or down by changing lip and jaw slightly or rolling a finger slowly off a hole. Open mouthpieces and soft reeds help.","Den Ton nach oben oder unten ziehen, indem du Lippe und Kiefer leicht veränderst oder einen Finger langsam vom Loch rollst. Offene Mundstücke und weiche Blätter helfen.","Dudağı ve çeneyi hafifçe değiştirerek ya da parmağı delikten yavaşça kaydırarak sesi yukarı ya da aşağı bük. Açık ağızlıklar ve yumuşak kamışlar yardımcı olur.")}</span></div>
  <div><b>${X("Makam","Makam","Makam")}</b><span>${X("Turkish scales have notes between the piano keys. That comes much later. Learn the regular notes cleanly first.","Türkische Tonleitern haben Töne zwischen den Klaviertasten. Das kommt viel später. Erst die normalen Töne sauber lernen.","Türk makamlarında piyano tuşlarının arasında sesler vardır. Bu çok sonra gelir. Önce normal sesleri temiz öğren.")}</span></div></div></div>`;
K.chartNote=()=>`<p class="muted" style="margin-top:10px">${X("“Written” = what stands on G-clarinet sheet music. “Sounds as” = the real pitch on a piano.","„Geschrieben“ = was auf dem Notenblatt für Sol-Klarinette steht. „Klingt wie“ = echter Ton am Klavier.","“Yazılan” = Sol klarnet notasında yazan. “Duyulan” = piyanodaki gerçek ses.")}</p>`;
K.factsHead=()=>`<h2 style="margin-top:18px">${X("Why so many keys?","Warum so viele Hebel?","Neden bu kadar çok anahtar?")}</h2>`;
K.readLead=()=>`<h2>${X("Where is the note? (register)","Wo steht der Ton? (Lage)","Nota nerede? (bölge)")}</h2><p class="lead">${X("On sheet music the height of a note tells which note and register is meant. The higher on the lines, the higher you play. The same note name exists twice: once below the lines (middle) and once inside the lines (high). Tap a note.","Auf dem Notenblatt zeigt die Höhe der Note, welcher Ton und welche Lage gemeint ist. Je höher auf den Linien, desto höher spielst du. Den gleichen Namen gibt es zweimal: unter den Linien (mittel) und mitten in den Linien (hoch). Tippe eine Note an.","Notada notanın yüksekliği hangi ses ve bölge olduğunu gösterir. Çizgilerde ne kadar yukarıdaysa o kadar tiz çalarsın. Aynı ses adı iki kez vardır: çizgilerin altında (orta) ve çizgilerin içinde (tiz). Bir notaya dokun.")}</p>`;
K.readLegend=()=>`<p class="muted" style="margin-top:12px">${X("↓ = low register (below the lines, right hand joins) · no arrow = middle · ↑ = high register (thumb also presses R). Colours: orange low, blue middle, gold high.","↓ = tiefe Lage (unter den Linien, rechte Hand macht mit) · ohne Pfeil = mittlere Lage · ↑ = hohe Lage (Daumen drückt zusätzlich R). Farben: orange tief, blau mittel, gold hoch.","↓ = pes bölge (çizgilerin altında, sağ el de katılır) · ok yok = orta · ↑ = tiz bölge (başparmak R'ye de basar). Renkler: turuncu pes, mavi orta, altın tiz.")}</p>`;
K.songsFoot=()=>`<p class="muted">${X("Sheet music for G clarinet (search “sol klarnet nota”) can be copied note by note into this notation. Read the note height under “Read music”.","Notenblätter für Sol-Klarinette (z. B. „sol klarnet nota“) kannst du Ton für Ton in diese Schreibweise übertragen. Die Notenhöhe liest du unter „Noten lesen“ ab.","Sol klarnet notalarını (“sol klarnet nota” diye ara) bu yazıma nota nota aktarabilirsin. Nota yüksekliğini “Nota okuma” bölümünden oku.")}</p>`;
K.tunerNote=()=>`<p class="muted small" style="margin-top:12px">${X("Shows the written note for G clarinet. The microphone is only analysed in your browser, nothing is sent or stored.","Zeigt den geschriebenen Ton für Sol-Klarinette. Das Mikrofon wird nur im Browser ausgewertet, nichts wird gesendet oder gespeichert.","Sol klarnet için yazılan sesi gösterir. Mikrofon sadece tarayıcında işlenir, hiçbir şey gönderilmez ya da saklanmaz.")}</p>`;
K.tips=()=>`<div class="facts">
 <div><b>${X("1. Without the clarinet first","1. Erst ohne Klarinette","1. Önce klarnetsiz")}</b><span>${X("Put only mouthpiece and barrel together. Take the whole clarinet only when a steady tone comes here.","Nur Mundstück und Birne zusammenstecken. Erst wenn hier ein gerader Ton kommt, die ganze Klarinette nehmen.","Sadece ağızlık ve fıçıyı birleştir. Burada düz bir ses çıkınca bütün klarneti al.")}</span></div>
 <div><b>${X("2. Lower lip","2. Unterlippe","2. Alt dudak")}</b><span>${X("Lower lip slightly over the lower teeth, the reed rests on it. Upper teeth gently on top of the mouthpiece.","Unterlippe leicht über die unteren Zähne, das Blatt liegt darauf. Obere Zähne sanft oben aufs Mundstück.","Alt dudak alt dişlerin üstüne hafifçe gelir, kamış onun üstünde durur. Üst dişler ağızlığın üstüne nazikçe.")}</span></div>
 <div><b>${X("3. How far in?","3. Wie tief rein?","3. Ne kadar içeri?")}</b><span>${X("Start with little mouthpiece and take more bit by bit. Just before it squeaks is your spot, usually about 1 to 1.5 cm.","Mit wenig Mundstück starten und Stück für Stück mehr nehmen. Kurz bevor es quietscht, ist dein Punkt, meist etwa 1 bis 1,5 cm.","Az ağızlıkla başla ve azar azar artır. Ciyaklamadan hemen önceki nokta seninkidir, genelde yaklaşık 1-1,5 cm.")}</span></div>
 <div><b>${X("4. Don't bite","4. Nicht beißen","4. Isırma")}</b><span>${X("Firm enough that the mouthpiece doesn't slip, but never squeeze the reed shut. With a soft reed and open mouthpiece barely press. Only air = pressing too hard.","Fest genug, dass das Mundstück nicht rutscht, aber das Blatt nie zudrücken. Bei weichem Blatt und offenem Mundstück kaum drücken. Nur Luft = zu fest gedrückt.","Ağızlık kaymayacak kadar sıkı, ama kamışı asla kapatma. Yumuşak kamış ve açık ağızlıkla neredeyse hiç bastırma. Sadece hava = çok sert basıyorsun.")}</span></div>
 <div><b>${X("5. Air","5. Luft","5. Hava")}</b><span>${X("Fast and steady, like blowing out a candle far away. No puffed cheeks. Mouth corners firm.","Schnell und gleichmäßig, wie eine Kerze weit weg auspusten. Keine dicken Backen. Mundwinkel fest.","Hızlı ve düzenli, uzaktaki bir mumu söndürür gibi. Yanakları şişirme. Dudak kenarları sıkı.")}</span></div>
 <div><b>${X("6. Holes fully closed","6. Löcher ganz zu","6. Delikler tam kapalı")}</b><span>${X("If only certain notes squeak, a finger isn't sealing a hole. Lay the fingertip flat.","Quietscht es nur bei bestimmten Tönen, deckt ein Finger ein Loch nicht ganz ab. Fingerkuppe flach drauf.","Sadece bazı seslerde ciyaklıyorsa bir parmak deliği tam kapatmıyor. Parmak ucunu düz koy.")}</span></div>
 <div><b>${X("7. Breathing for long phrases","7. Atmen für lange Phrasen","7. Uzun cümleler için nefes")}</b><span>${X("At first 5 seconds is normal; it improves as the embouchure seals better. Players breathe in short gaps between phrases. Circular breathing (cheek air while inhaling through the nose) is for much later.","Am Anfang sind 5 Sekunden normal; es wird besser, wenn der Ansatz dichter wird. Profis atmen in kurzen Lücken zwischen den Phrasen. Zirkularatmung (Wangenluft, während man durch die Nase einatmet) kommt viel später.","Başta 5 saniye normaldir; dudak daha iyi kapattıkça gelişir. Müzisyenler cümleler arasındaki kısa boşluklarda nefes alır. Döngüsel nefes (burundan alırken yanaktaki havayı kullanmak) çok sonra gelir.")}</span></div></div>`;
K.key="fn-k";
K.hint=up=>up?X("A bit high: relax the lip.","Etwas zu hoch: Lippe lockerer.","Biraz tiz: dudağı gevşet."):X("A bit low: lip slightly firmer, more air.","Etwas zu tief: Lippe etwas fester, mehr Luft.","Biraz pes: dudak biraz sıkı, daha çok hava.");

/* =====================================================================
   NEY (Turkish ney, Mansur size, rast-based: Rast = Sol = G)
   Fingerings: thumb hole at the back + six front holes, numbered from the top.
   ===================================================================== */
const N={key:"fn-n",SHIFT:0};
const NF={ // closed holes per perde (same fingering in both registers)
  Neva:["T","H2","H5"], NimHicaz:["T","H1","H5"], Cargah:["T","H1","H2","H5"], Segah:["T","H1","H2","H3","H5"],
  Kurdi:["T","H1","H2","H3","H4"], Dugah:["T","H1","H2","H3","H4","H5"], Rast:["T","H1","H2","H3","H4","H5","H6"],
  Huseyni:[], Acem:[]}; // all holes open; Hüseyni and Acem differ only by breath and head angle
N.N=[
 ["Ra","Rast",67,0],["Du","Dugah",69,0],["Ku","Kurdi",70,-15],["Se","Segah",71,-20],["Ca","Cargah",72,0],["Nh","NimHicaz",73,0],["Ne","Neva",74,0],["Hu","Huseyni",76,0],["Ac","Acem",77,-10]
].flatMap(([id,p,m,c])=>[{id,p,m,c,k:NF[p]},{id:id+"L",p,m:m-12,c,k:NF[p]}]).sort((a,b)=>a.m-b.m);
N.byId=Object.fromEntries(N.N.map(n=>[n.id,n]));
N.byMidi=m=>N.N.find(n=>n.m===m);
const PERDE={Rast:"Rast",Dugah:"Dügah",Kurdi:"Kürdi",Segah:"Segah",Cargah:"Çargah",NimHicaz:"Nim Hicaz",Neva:"Neva",Huseyni:"Hüseyni",Acem:"Acem"};
const PERDE_LOW={Rast:"Kaba Rast",Dugah:"Kaba Dügah",Kurdi:"Kaba Kürdi",Segah:"Kaba Segah",Cargah:"Kaba Çargah",NimHicaz:"Kaba Nim Hicaz",Neva:"Yegâh",Huseyni:"Hüseyni Aşiran",Acem:"Acem Aşiran"};
N.low=m=>m<67;
N.nm=m=>{ const n=N.byMidi(m); if(!n) return noteName(m); return N.low(m)?PERDE_LOW[n.p]+"↓":PERDE[n.p]; };
N.sub=m=>noteName(m);
N.subHead=()=>X("Western name","Westlicher Name","Batı adı");
N.regName=m=>N.low(m)?X("low (soft breath)","tief (sanfter Atem)","pes (yumuşak nefes)"):X("middle","mittel","orta");
N.staffDx=66;
N.staffLabel=m=>{ const n=N.byMidi(m); const nm=(n.p==="NimHicaz"?"N.Hicaz":n.p==="Neva"&&N.low(m)?"Yegâh":n.p==="Huseyni"&&N.low(m)?"Hüs.Aş.":n.p==="Acem"&&N.low(m)?"Acem Aş.":PERDE[n.p]); return nm+(N.low(m)?"↓":""); };
N.color=m=>N.low(m)?"var(--rh)":"var(--lh)";
N.tone=(m,dur)=>neyTone(m,dur);
N.RANGES={low:[55,65],mid:[67,77],high:[67,77]};
N.PC={...NAME_PC,rast:7,dugah:9,"dügah":9,kurdi:10,"kürdi":10,segah:11,cargah:0,"çargah":0,nimhicaz:1,"nim-hicaz":1,hicaz:1,neva:2,yegah:2,"yegâh":2,huseyni:4,"hüseyni":4,acem:5};
N.parse=t=>parseWind(t,N);
N.HAND={T:"lh",H1:"lh",H2:"lh",H3:"lh",H4:"rh",H5:"rh",H6:"rh"};
N.ORDER=["T","H1","H2","H3","H4","H5","H6"];
N.STEP=()=>({
 T:X("Left thumb: cover the thumb hole at the back","Linker Daumen: Daumenloch hinten zudecken","Sol başparmak: arkadaki başparmak deliğini kapat"),
 H1:X("Left index: hole 1 (top) closed","Linker Zeigefinger: Loch 1 (oben) zu","Sol işaret: 1. delik (üst) kapalı"),
 H2:X("Left middle: hole 2 closed","Linker Mittelfinger: Loch 2 zu","Sol orta: 2. delik kapalı"),
 H3:X("Left ring: hole 3 closed","Linker Ringfinger: Loch 3 zu","Sol yüzük: 3. delik kapalı"),
 H4:X("Right index: hole 4 closed","Rechter Zeigefinger: Loch 4 zu","Sağ işaret: 4. delik kapalı"),
 H5:X("Right middle: hole 5 closed","Rechter Mittelfinger: Loch 5 zu","Sağ orta: 5. delik kapalı"),
 H6:X("Right ring: hole 6 (bottom) closed","Rechter Ringfinger: Loch 6 (unten) zu","Sağ yüzük: 6. delik (alt) kapalı")});
N.steps=keys=>{ const st=N.STEP(); const open=N.ORDER.filter(k=>!keys.includes(k)&&k!=="T").map(k=>k.slice(1));
  return N.ORDER.filter(k=>keys.includes(k)).map(k=>`<li><span class="n ${N.HAND[k]}">${N.HAND[k]==="lh"?"L":"R"}</span><span>${st[k]}</span></li>`).join("")
   +(open.length?`<li><span class="n o">O</span><span>${X("Open:","Offen:","Açık:")} ${X("hole","Loch","delik")} ${open.join(", ")}</span></li>`:"")
   +(keys.length?"":`<li><span class="n o">O</span><span>${X("Thumb hole open too: every hole is open. Hüseyni and Acem share this grip. For Acem blow a little faster and turn the ney slightly away from you; for Hüseyni a little softer and towards you. The note finder shows which one you hit.","Auch das Daumenloch ist offen: alle Löcher offen. Hüseyni und Acem haben denselben Griff. Für Acem etwas schneller blasen und die Ney leicht von dir wegdrehen, für Hüseyni etwas sanfter und zu dir hin. Der Ton-Erkenner zeigt, welchen du triffst.","Başparmak deliği de açık: tüm delikler açık. Hüseyni ve Acem aynı pozisyondur. Acem için biraz daha hızlı üfle ve neyi hafifçe dışa çevir; Hüseyni için biraz daha yumuşak ve kendine doğru. Ses bulucu hangisini çaldığını gösterir.")}</span></li>`); };
N.svg=keys=>{
  const on=k=>keys.includes(k), f=k=>on(k)?`var(--${N.HAND[k]})`:"var(--surface)", st=k=>on(k)?`var(--${N.HAND[k]})`:"var(--key)";
  const t=(x,y,s,a="start",sz=13,w=400)=>`<text x="${x}" y="${y}" font-size="${sz}" font-weight="${w}" fill="var(--muted)" text-anchor="${a}">${s}</text>`;
  const hole=(k,cx,cy,r=13)=>`<circle cx="${cx}" cy="${cy}" r="${r}" fill="${f(k)}" stroke="${st(k)}" stroke-width="3"/>`;
  const fi=[X("Index","Zeige","İşaret"),X("Middle","Mittel","Orta"),X("Ring","Ring","Yüzük")];
  const ys=[150,192,234,300,342,384];
  return `<svg viewBox="0 0 260 470" role="img" aria-label="${X("Fingering","Griffbild","Parmak pozisyonu")}">
  <path d="M112 8 L148 8 L144 34 L116 34 Z" fill="var(--hi)"/>${t(160,26,X("başpare (mouthpiece)","Başpare (Mundstück)","başpare"),"start",10)}
  <rect x="114" y="34" width="32" height="420" rx="10" fill="#b99a5b"/>
  ${[90,250,430].map(y=>`<rect x="112" y="${y}" width="36" height="6" rx="3" fill="#8a6d36"/>`).join("")}
  ${t(14,82,X("back:","hinten:","arka:"),"start",12,700)}${hole("T",39,108,14)}${t(39,140,X("Thumb","Daumen","Başparmak"),"middle",11)}
  ${ys.map((y,i)=>hole("H"+(i+1),130,y)+t(152,y+5,(i+1)+" · "+fi[i%3])).join("")}
  ${t(98,197,X("LEFT","LINKS","SOL"),"end",12,700)}<line x1="100" y1="267" x2="160" y2="267" stroke="var(--muted)" stroke-width="1.5" stroke-dasharray="4 4"/>${t(98,347,X("RIGHT","RECHTS","SAĞ"),"end",12,700)}
  </svg>`;
};

];

 {n:()=>X("Scale Rast → Neva","Tonleiter Rast → Neva","Rast → Neva dizisi"),txt:"Rast:2 Dügah:2 | Segah:2 Çargah:2 | Neva:4 |\nNeva:2 Çargah:2 | Segah:2 Dügah:2 | Rast:4"},
 {n:()=>X("Long tones","Lange Töne","Uzun sesler"),txt:"Neva:4 | P:4 | Çargah:4 | P:4 | Segah:4 | P:4 | Dügah:4 | P:4 | Rast:4"},
 {n:"Hot Cross Buns",txt:"Segah Dügah Rast:2 | Segah Dügah Rast:2 |\nRast:1/2 Rast:1/2 Rast:1/2 Rast:1/2 Dügah:1/2 Dügah:1/2 Dügah:1/2 Dügah:1/2 | Segah Dügah Rast:2"},
 {n:"Mary Had a Little Lamb",txt:"Segah Dügah Rast Dügah | Segah Segah Segah:2 | Dügah Dügah Dügah:2 | Segah Neva Neva:2 |\nSegah Dügah Rast Dügah | Segah Segah Segah Segah | Dügah Dügah Segah Dügah | Rast:4"},
 {n:()=>X("Low scale (soft breath)","Tiefe Tonleiter (sanfter Atem)","Pes dizi (yumuşak nefes)"),txt:"Rast,:2 Dügah,:2 | Segah,:2 Çargah,:2 | Neva,:4 |\nNeva,:2 Çargah,:2 | Segah,:2 Dügah,:2 | Rast,:4"}
];
N.hint=up=>up?X("A bit high: less air pressure, turn the ney slightly towards you.","Etwas zu hoch: weniger Luftdruck, Ney etwas zu dir drehen.","Biraz tiz: hava basıncını azalt, neyi biraz kendine çevir."):X("A bit low: a little more air, open the angle slightly.","Etwas zu tief: etwas mehr Luft, Winkel etwas öffnen.","Biraz pes: biraz daha hava, açıyı hafifçe aç.");
N.songExtra=()=>`<p class="muted small" style="margin:0 0 8px">${X("Perde names work too: Rast, Dügah, Kürdi, Segah, Çargah, Nim Hicaz, Neva, Hüseyni, Acem. Add a comma for the low register (Rast,).","Perde-Namen gehen auch: Rast, Dügah, Kürdi, Segah, Çargah, Nim Hicaz, Neva, Hüseyni, Acem. Komma für die tiefe Lage (Rast,).","Perde adları da olur: Rast, Dügah, Kürdi, Segah, Çargah, Nim Hicaz, Neva, Hüseyni, Acem. Pes bölge için virgül ekle (Rast,).")}</p>`;
N.state={view:"start",level:store.get("fn-n-level",0),idx:0,done:new Set(),fing:"Ra",read:"Ra",song:-1,bpm:60};
N.VIEWS=()=>[["start",X("Start here","Start hier","Buradan başla")],["practice",X("Practice","Üben","Pratik")],["fingers",X("Fingering chart","Grifftabelle","Parmak tablosu")],["read",X("Read music","Noten lesen","Nota okuma")],["songs",X("Songs","Lieder","Şarkılar")],["tuner",X("Note finder","Ton-Erkenner","Ses bulucu")],["tips",X("Tips","Tipps","İpuçları")]];
N.tunerLead=()=>`<h2>${X("Which perde am I playing?","Welche Perde spiele ich?","Hangi perdeyi çalıyorum?")}</h2><p class="lead">${X("A ney can't be tuned. Its pitch comes from your breath and the angle. Play any note: the page names the perde and shows how close you are. Too high: less air or turn the ney towards you. Too low: a little more air.","Eine Ney kann man nicht stimmen. Die Tonhöhe kommt von Atem und Winkel. Spiel einen Ton: Die Seite nennt die Perde und zeigt, wie nah du dran bist. Zu hoch: weniger Luft oder Ney zu dir drehen. Zu tief: etwas mehr Luft.","Ney akort edilemez. Perdesi nefesinden ve açıdan gelir. Herhangi bir ses çal: sayfa perdeyi söyler ve ne kadar yakın olduğunu gösterir. Çok tiz: daha az hava ya da neyi kendine çevir. Çok pes: biraz daha hava.")}</p>`;
N.identify=w=>{ let best=N.N[0],bd=1e9; N.N.forEach(n=>{ const d=Math.abs(w-(n.m+n.c/100)); if(d<bd){bd=d;best=n;} }); const cents=(w-(best.m+best.c/100))*100;
  return Math.abs(cents)<=60?{m:best.m,cents,name:N.nm(best.m)}:{m:Math.round(w),cents:(w-Math.round(w))*100,name:noteName(Math.round(w))}; };
N.title=()=>X("Learn the ney","Ney lernen","Ney öğren");
N.intro=()=>X("For the Turkish ney, the reed flute of Sufi and classical Turkish music. Set up for a Mansur ney (Rast = G). See the fingering, play the perde, and the page listens.","Für die türkische Ney, die Rohrflöte der Sufi- und klassischen türkischen Musik. Eingestellt auf eine Mansur-Ney (Rast = G). Griff ansehen, Perde spielen, die Seite hört zu.","Tasavvuf ve klasik Türk müziğinin kamış flütü ney için. Mansur ney'e göre ayarlı (Rast = Sol). Parmak pozisyonuna bak, perdeyi çal, sayfa dinler.");
N.attack=()=>`<h2 style="margin-top:22px">${X("Starting a tone","So beginnt ein Ton","Ses nasıl başlar")}</h2><p class="lead" style="margin-bottom:0">${X("On the ney the tone starts with the breath, like a soft whispered “hu”. Don't push hard. Later you can start notes with the tongue (“tu”) for clear attacks.","Auf der Ney beginnt der Ton mit dem Atem, wie ein sanft geflüstertes „hu“. Nicht hart pusten. Später kannst du Töne auch mit der Zunge („tu“) beginnen.","Neyde ses nefesle başlar, yumuşakça fısıldanan bir “hu” gibi. Sert üfleme. Sonra notaları dille de (“tu”) başlatabilirsin.")}</p>`;
N.care=()=>`<div class="two">
 <div class="panel"><h2>${X("Holding the ney","Die Ney halten","Ney nasıl tutulur")}</h2><ol class="plain">
  <li>${X("Upper hand (usually left): thumb on the hole at the back, index, middle and ring on holes 1 to 3.","Obere Hand (meist links): Daumen auf das Loch hinten, Zeige-, Mittel- und Ringfinger auf Loch 1 bis 3.","Üst el (genelde sol): başparmak arkadaki delikte, işaret, orta ve yüzük 1-3. deliklerde.")}</li>
  <li>${X("Lower hand: index, middle and ring on holes 4 to 6. Cover the holes with the flat middle part of the fingers, not the tips.","Untere Hand: Zeige-, Mittel- und Ringfinger auf Loch 4 bis 6. Löcher mit dem flachen Mittelglied abdecken, nicht mit den Spitzen.","Alt el: işaret, orta ve yüzük 4-6. deliklerde. Delikleri parmak uçlarıyla değil, parmağın düz orta kısmıyla kapat.")}</li>
  <li>${X("Hold the ney at an angle of about 30 to 45 degrees to the side, not straight down.","Ney schräg zur Seite halten, etwa 30 bis 45 Grad, nicht gerade nach unten.","Neyi yana doğru yaklaşık 30-45 derece eğik tut, dümdüz aşağı değil.")}</li>
  <li>${X("Neys are made for left or right hand on top. Check which hand your thumb hole suits.","Neys gibt es für links oder rechts oben. Prüf, zu welcher Hand dein Daumenloch passt.","Neyler sol ya da sağ el üstte olacak şekilde yapılır. Başparmak deliğinin hangi ele uyduğunu kontrol et.")}</li></ol></div>
 <div class="panel"><h2>${X("Care","Pflege","Bakım")}</h2><ol class="plain">
  <li>${X("Keep the ney away from heaters, direct sun and big temperature changes. Reed can crack.","Ney von Heizung, direkter Sonne und starken Temperaturwechseln fernhalten. Rohr kann reißen.","Neyi kaloriferden, doğrudan güneşten ve ani sıcaklık değişimlerinden uzak tut. Kamış çatlayabilir.")}</li>
  <li>${X("After playing, wipe the başpare and let the ney dry upright or in an open case.","Nach dem Spielen die Başpare abwischen und die Ney aufrecht oder im offenen Etui trocknen lassen.","Çaldıktan sonra başpareyi sil ve neyi dik ya da açık kılıfta kurut.")}</li>
  <li>${X("Store it in a padded case. Plastic beginner neys are less sensitive.","In einem gepolsterten Etui aufbewahren. Kunststoff-Neys für Anfänger sind weniger empfindlich.","Yastıklı bir kılıfta sakla. Plastik başlangıç neyleri daha az hassastır.")}</li></ol></div>
</div>
<div class="panel"><h2>${X("The ney sound and makam","Der Ney-Klang und Makam","Ney sesi ve makam")}</h2><div class="facts">
  <div><b>${X("Breath is the sound","Der Atem ist der Klang","Ses nefestir")}</b><span>${X("The ney has no reed. Part of the breath noise belongs to its sound. Don't fight it, shape it.","Die Ney hat kein Blatt. Ein Teil des Atemgeräuschs gehört zum Klang. Nicht dagegen kämpfen, sondern formen.","Neyde kamış (dil) yoktur. Nefes sesinin bir kısmı sesine aittir. Ona karşı savaşma, şekil ver.")}</span></div>
  <div><b>${X("Angle changes pitch","Winkel ändert die Tonhöhe","Açı perdeyi değiştirir")}</b><span>${X("Turning the ney towards you lowers the pitch, turning it away raises it. Players use this to shape the fine intervals of makam.","Ney zu dir drehen macht den Ton tiefer, wegdrehen höher. So formen Spieler die feinen Abstände im Makam.","Neyi kendine çevirmek sesi pesleştirir, uzaklaştırmak tizleştirir. Neyzenler makamın ince aralıklarını böyle şekillendirir.")}</span></div>
  <div><b>${X("Notes between the piano keys","Töne zwischen den Klaviertasten","Piyano tuşlarının arasındaki sesler")}</b><span>${X("Segah sits a little below B, Kürdi a little below B♭. The tuner on this page already accounts for that.","Segah liegt etwas unter H, Kürdi etwas unter B. Das Stimmgerät hier berücksichtigt das.","Segah Si'nin biraz altında, Kürdi Si♭'nin biraz altındadır. Buradaki akort cihazı bunu hesaba katar.")}</span></div>
  <div><b>${X("Listen a lot","Viel hören","Bolca dinle")}</b><span>${X("Listen to ney recordings every day, especially taksim (free improvisation). The ear leads the breath.","Hör dir jeden Tag Ney-Aufnahmen an, besonders Taksim (freie Improvisation). Das Ohr führt den Atem.","Her gün ney kayıtları dinle, özellikle taksim. Kulak nefese yol gösterir.")}</span></div></div></div>`;
N.chartNote=()=>`<p class="muted" style="margin-top:10px">${X("Fingerings for the first register as commonly taught for Mansur ney. The second register uses the same fingering with more breath. Teachers may use alternative fingerings, and half-covered holes come later.","Griffe für die erste Lage, wie sie für die Mansur-Ney üblich gelehrt werden. Die zweite Lage nutzt denselben Griff mit mehr Atem. Lehrer nutzen teils andere Griffe, halb abgedeckte Löcher kommen später.","Mansur ney için yaygın öğretilen birinci bölge pozisyonları. İkinci bölge aynı pozisyonla daha çok nefes kullanır. Hocalar farklı pozisyonlar da kullanabilir, yarım kapalı delikler daha sonra gelir.")}</p>`;
N.factsHead=()=>`<h2 style="margin-top:18px">${X("How the ney works","So funktioniert die Ney","Ney nasıl çalışır")}</h2>`;
N.keyFacts=()=>`<div class="facts">
 <div><b>${X("7 holes","7 Löcher","7 delik")}</b><span>${X("Six on the front, one thumb hole at the back. No keys, everything is done with fingers, lips and breath.","Sechs vorne, ein Daumenloch hinten. Keine Klappen, alles geht mit Fingern, Lippen und Atem.","Önde altı, arkada bir başparmak deliği. Anahtar yok, her şey parmak, dudak ve nefesle.")}</span></div>
 <div><b>${X("Same fingering, two registers","Gleicher Griff, zwei Lagen","Aynı pozisyon, iki bölge")}</b><span>${X("Soft breath gives the low register, stronger and faster breath the middle register an octave higher.","Sanfter Atem ergibt die tiefe Lage, kräftigerer und schnellerer Atem die mittlere, eine Oktave höher.","Yumuşak nefes pes bölgeyi, daha güçlü ve hızlı nefes bir oktav tiz olan orta bölgeyi verir.")}</span></div>
 <div><b>${X("Ney sizes","Ney-Größen","Ney boyları")}</b><span>${X("Neys come in sizes like Mansur, Kız, Şah or Davud. Each sounds at a different pitch. This page uses Mansur; other sizes use the same fingerings but sound higher or lower.","Neys gibt es in Größen wie Mansur, Kız, Şah oder Davud, jede klingt anders hoch. Diese Seite nutzt Mansur; andere Größen haben die gleichen Griffe, klingen aber höher oder tiefer.","Mansur, Kız, Şah ya da Davud gibi boylar vardır, her biri farklı perdede çalar. Bu sayfa Mansur kullanır; diğer boylarda pozisyonlar aynıdır ama ses daha tiz ya da pes çıkar.")}</span></div>
 <div><b>${X("Cross fingerings","Gabelgriffe","Çatal pozisyonlar")}</b><span>${X("Some perdes keep a lower hole closed while upper ones are open (e.g. hole 5 for Segah). That is correct.","Manche Perden lassen ein unteres Loch zu, obwohl obere offen sind (z. B. Loch 5 bei Segah). Das ist richtig so.","Bazı perdelerde üst delikler açıkken alttaki bir delik kapalı kalır (örneğin Segah'ta 5. delik). Bu doğrudur.")}</span></div></div>`;
N.readLead=()=>`<h2>${X("Ney notes on the staff","Ney-Töne auf den Notenlinien","Porte üzerinde ney sesleri")}</h2><p class="lead">${X("Turkish music is written on the normal treble staff. Rast sits on the second line (G). Tap a note to see the perde name, the fingering and to hear it. The low register is written an octave lower.","Türkische Musik wird auf normalen Notenlinien im Violinschlüssel geschrieben. Rast steht auf der zweiten Linie (G). Tippe eine Note an: Du siehst Perde-Name und Griff und hörst sie. Die tiefe Lage steht eine Oktave tiefer.","Türk müziği normal sol anahtarlı porteye yazılır. Rast ikinci çizgidedir (Sol). Bir notaya dokun: perde adını, pozisyonu gör ve sesini duy. Pes bölge bir oktav aşağıda yazılır.")}</p>`;
N.readLegend=()=>`<p class="muted" style="margin-top:12px">${X("↓ and orange = low register (soft breath). Blue = middle register. In real Turkish notation Segah and Kürdi carry special koma accidentals; here they are shown as B and B♭.","↓ und orange = tiefe Lage (sanfter Atem). Blau = mittlere Lage. In echter türkischer Notation haben Segah und Kürdi besondere Koma-Vorzeichen; hier stehen sie als H und B.","↓ ve turuncu = pes bölge (yumuşak nefes). Mavi = orta bölge. Gerçek Türk notasında Segah ve Kürdi özel koma işaretleri taşır; burada Si ve Si♭ olarak gösterilir.")}</p>`;
N.songsFoot=()=>`<p class="muted">${X("Ney sheet music (search “ney nota”) is written in Turkish notation. Use the perde names under “Read music” to copy it note by note.","Ney-Noten (z. B. „ney nota“) stehen in türkischer Notation. Mit den Perde-Namen unter „Noten lesen“ überträgst du sie Ton für Ton.","Ney notaları (“ney nota” diye ara) Türk notasıyla yazılır. “Nota okuma”daki perde adlarıyla nota nota aktar.")}</p>`;
N.tunerNote=()=>`<p class="muted small" style="margin-top:12px">${X("Set up for Mansur ney (Rast = G). Segah and Kürdi are expected slightly below the piano note. The microphone is only analysed in your browser.","Eingestellt auf Mansur-Ney (Rast = G). Segah und Kürdi werden etwas unter dem Klavierton erwartet. Das Mikrofon wird nur im Browser ausgewertet.","Mansur ney'e göre ayarlı (Rast = Sol). Segah ve Kürdi'nin piyano sesinden biraz pes olması beklenir. Mikrofon sadece tarayıcında işlenir.")}</p>`;
N.tips=()=>`<div class="facts">
 <div><b>${X("1. First sound without fingers","1. Erster Ton ohne Finger","1. Parmaksız ilk ses")}</b><span>${X("Hold the ney with the thumb only and look for any tone. Getting the first sound can take days, that is normal.","Ney nur mit dem Daumen halten und irgendeinen Ton suchen. Der erste Ton kann Tage dauern, das ist normal.","Neyi sadece başparmakla tut ve herhangi bir ses ara. İlk sesi bulmak günler sürebilir, bu normaldir.")}</span></div>
 <div><b>${X("2. Lips and başpare","2. Lippen und Başpare","2. Dudak ve başpare")}</b><span>${X("Rest the başpare lightly on the lips so your lip covers about half of the opening. No pressure: a light touch seals enough.","Başpare leicht an die Lippen legen, sodass die Lippe etwa die Hälfte der Öffnung abdeckt. Kein Druck: leichte Berührung dichtet genug ab.","Başpareyi dudaklarına hafifçe dayar, dudağın açıklığın yaklaşık yarısını kapatsın. Baskı yok: hafif temas yeterince kapatır.")}</span></div>
 <div><b>${X("3. Like whistling","3. Wie pfeifen","3. Islık çalar gibi")}</b><span>${X("Purse your lips as if to whistle and aim a thin airstream across the edge, into the pipe.","Lippen spitzen wie zum Pfeifen und einen dünnen Luftstrom über die Kante ins Rohr lenken.","Islık çalacakmış gibi dudaklarını büz ve ince bir hava akımını kenarın üstünden boruya yönlendir.")}</span></div>
 <div><b>${X("4. Angle","4. Winkel","4. Açı")}</b><span>${X("Hold the ney about 30 to 45 degrees off to the side. Try small changes of angle until the tone appears.","Ney etwa 30 bis 45 Grad zur Seite halten. Kleine Winkeländerungen ausprobieren, bis der Ton kommt.","Neyi yaklaşık 30-45 derece yana tut. Ses çıkana kadar açıyı biraz biraz değiştir.")}</span></div>
 <div><b>${X("5. Gentle breath","5. Sanfter Atem","5. Yumuşak nefes")}</b><span>${X("Not forceful. Too much air jumps to the higher register or only rushes. For the low register relax the lips and widen the airstream.","Nicht kräftig. Zu viel Luft springt in die höhere Lage oder rauscht nur. Für die tiefe Lage Lippen lockern und den Luftstrom breiter machen.","Sert değil. Çok fazla hava üst bölgeye atlar ya da sadece hışırdar. Pes bölge için dudakları gevşet ve hava akımını genişlet.")}</span></div>
 <div><b>${X("6. Holes fully covered","6. Löcher ganz zu","6. Delikler tam kapalı")}</b><span>${X("Use the flat middle part of the fingers. If a note won't come, a hole is usually not fully covered.","Mit dem flachen Mittelglied abdecken. Kommt ein Ton nicht, ist meist ein Loch nicht ganz zu.","Parmağın düz orta kısmını kullan. Bir ses çıkmıyorsa genelde bir delik tam kapanmamıştır.")}</span></div>
 <div><b>${X("7. Short sessions","7. Kurze Einheiten","7. Kısa çalışmalar")}</b><span>${X("The ney can make you dizzy at first because you blow out a lot of air. Rest often, sit down if needed.","Die Ney kann anfangs schwindelig machen, weil viel Luft rausgeht. Oft Pause machen, notfalls hinsetzen.","Başta çok hava harcadığın için ney başını döndürebilir. Sık mola ver, gerekirse otur.")}</span></div></div>`;

 {m:3,t:X("Breathe and find the tone","Atmen und Ton finden","Nefes al ve sesi bul"),d:X("Three deep breaths. Then a few soft tones with the thumb hole only, until the sound comes easily.","Drei tiefe Atemzüge. Dann ein paar sanfte Töne nur mit dem Daumenloch, bis der Klang leicht kommt.","Üç derin nefes. Sonra ses kolay çıkana kadar sadece başparmak deliğiyle birkaç yumuşak ses.")},

 {m:6,t:X("Perdes of your week","Perden deiner Woche","Haftanın perdeleri"),d:X("Your level under “Practice”, checked with the tuner.","Deine Stufe unter „Üben“, mit dem Stimmgerät prüfen.","“Pratik”teki seviyen, akort cihazıyla kontrol.")},
