<script>
(function(){
"use strict";
/* ============================================================
   First Notes – beginner lessons for classical guitar and the
   Turkish G clarinet. Single file, no build step, no tracking.
   ============================================================ */

// ---------- storage ----------
const store={
  get(k,d){ try{ const v=localStorage.getItem(k); return v==null?d:JSON.parse(v); }catch(e){ return d; } },
  set(k,v){ try{ localStorage.setItem(k,JSON.stringify(v)); }catch(e){} }
};

// ---------- i18n ----------
const LANGS=[["en","EN"],["de","DE"],["tr","TR"]];
let lang=store.get("fn-lang","en"); if(!LANGS.some(l=>l[0]===lang)) lang="en";
/** Pick the current language from a {en,de,tr} object (falls back to English). */
const L=o=>(o&&typeof o==="object"&&!Array.isArray(o))?(o[lang]??o.en):o;
/** Inline translation: X("English","Deutsch","Türkçe"). */
const X=(en,de,tr)=>L({en,de,tr});
const fill=(s,p)=>s.replace(/\{(\w+)\}/g,(_,k)=>p[k]??"");

// ---------- note names ----------
const NAMES={
  en:["C","C♯","D","E♭","E","F","F♯","G","G♯","A","B♭","B"],
  de:["C","Cis","D","Es","E","F","Fis","G","Gis","A","B","H"],
  tr:["Do","Do♯","Re","Mi♭","Mi","Fa","Fa♯","Sol","Sol♯","La","Si♭","Si"]
};
const SOLF=NAMES.tr, LETTER_EN=NAMES.en;
const pc=m=>((m%12)+12)%12;
const noteName=m=>NAMES[lang][pc(m)];
/** Chord root names: German uses H/B, Turkish chord charts use English letters. */
const CHORD_ROOT={en:["C","C♯","D","E♭","E","F","F♯","G","G♯","A","B♭","B"],de:["C","Cis","D","Es","E","F","Fis","G","Gis","A","B","H"],tr:["C","C♯","D","E♭","E","F","F♯","G","G♯","A","B♭","B"]};
const chordName=(root,suffix)=>CHORD_ROOT[lang][pc(root)]+suffix;

// ---------- audio ----------
let actx=null;
function ctx(){ if(!actx) actx=new (window.AudioContext||window.webkitAudioContext)(); if(actx.state==="suspended") actx.resume(); return actx; }
const hz=m=>440*Math.pow(2,(m-69)/12);
/** Soft woodwind-like tone (odd harmonics). Returns a stop() function. */
function windTone(m,dur=1.4,vol=.22){
  try{
    const c=ctx(), t=c.currentTime, g=c.createGain(), oscs=[];
    const rel=Math.min(.25,dur*.3);

const pluckCache={};
function pluckBuffer(m){

  const N=Math.max(2,Math.round(sr/hz(m))), r=new Float32Array(N);

  for(let i=0;i<len;i++){ const a=r[k], nb=r[(k+1)%N]; r[k]=decay*.5*(a+nb); d[i]=a*.6; k=(k+1)%N; }

function detectPitch(buf,rate,minF,maxF){
  let rms=0; for(const v of buf) rms+=v*v; rms=Math.sqrt(rms/buf.length); if(rms<.011) return -1;
  const n=buf.length, minL=Math.floor(rate/maxF), maxL=Math.floor(rate/minF), c=new Float32Array(maxL+2);
  let e=0; for(let i=0;i<n;i++) e+=buf[i]*buf[i];
  for(let l=minL;l<=maxL+1;l++){ let s=0; for(let i=0;i<n-l;i++) s+=buf[i]*buf[i+l]; c[l]=s; }
  let best=-1,bv=0;
  for(let l=minL+1;l<=maxL;l++){ const v=c[l]/e; if(v>.5&&c[l]>c[l-1]&&c[l]>=c[l+1]){ if(v>bv){bv=v;best=l;} if(v>.85) break; } }
  if(best<0) return -1;
  const a=c[best-1],b=c[best],d=c[best+1],sh=(a-d)/(2*(a-2*b+d)||1);
  return rate/(best+(isFinite(sh)?sh:0));
}

G.byId=Object.fromEntries(G.CH.map(c=>[c.id,c]));
G.name=c=>chordName(c.r,c.q);
G.midi=(s,f,capo=0)=>G.OPEN[s]+f+capo;
G.chordSVG=(c,hiStr=-1)=>{
  const W=240,H=308,x0=40,dx=32,y0=60,dy=50, sx=s=>x0+s*dx;
  let o=`<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="${c.single?"":G.name(c)}">`;
  o+=`<rect x="${x0-6}" y="${y0-8}" width="${dx*5+12}" height="9" rx="3" fill="var(--ink)"/>`;
  for(let fr=1;fr<=4;fr++){ o+=`<line x1="${x0}" y1="${y0+fr*dy}" x2="${x0+dx*5}" y2="${y0+fr*dy}" stroke="var(--muted)" stroke-width="2"/><text x="${x0-14}" y="${y0+fr*dy-dy/2+5}" font-size="12" fill="var(--muted)" text-anchor="end">${fr}</text>`; }
  for(let s=0;s<6;s++) o+=`<line x1="${sx(s)}" y1="${y0}" x2="${sx(s)}" y2="${y0+4*dy}" stroke="${s===hiStr?"var(--hi)":"var(--string)"}" stroke-width="${s===hiStr?4:(3.2-s*.35)}"/>`;
  c.f.forEach((f,s)=>{ const x=sx(s);
    if(f<0){ if(!c.single) o+=`<text x="${x}" y="${y0-18}" font-size="20" font-weight="700" fill="var(--warn)" text-anchor="middle">×</text>`; }
    else if(f===0) o+=`<circle cx="${x}" cy="${y0-24}" r="8" fill="none" stroke="var(--accent)" stroke-width="2.5"/>`;
    else { const y=y0+f*dy-dy/2; o+=`<circle cx="${x}" cy="${y}" r="14" fill="var(--ink)"/><text x="${x}" y="${y+5}" font-size="15" font-weight="700" fill="var(--bg)" text-anchor="middle">${c.g[s]}</text>`; }
    o+=`<text x="${x}" y="${y0+4*dy+24}" font-size="14" font-weight="700" fill="var(--ink)" text-anchor="middle">${G.str(s)}</text>`; });
  o+=`<text x="${x0}" y="${H-6}" font-size="11" fill="var(--muted)">${X("thick","dick","kalın")}</text><text x="${x0+dx*5}" y="${H-6}" font-size="11" fill="var(--muted)" text-anchor="end">${X("thin","dünn","ince")}</text>`;
  return o+`</svg>`;
};
G.steps=c=>{
  const pressed=c.f.map((f,s)=>({f,s,g:c.g[s]})).filter(x=>x.f>0).sort((a,b)=>a.g-b.g);
  let h=pressed.map(x=>`<li><span class="n">${x.g}</span><span><b>${G.finger(x.g)}</b>: ${G.strLong(x.s)}, ${fill(X("fret {n}","{n}. Bund","{n}. perde"),{n:x.f})}</span></li>`).join("");
  const open=c.f.map((f,s)=>f===0?G.str(s):null).filter(Boolean), mute=c.f.map((f,s)=>f<0?G.str(s):null).filter(Boolean);
  if(open.length) h+=`<li><span class="n o">O</span><span>${X("Play open:","Leer mitklingen:","Boş çal:")} ${open.join(", ")}</span></li>`;
  if(mute.length) h+=`<li><span class="n x">×</span><span>${X("Do not play:","Nicht anschlagen:","Çalma:")} ${mute.join(", ")}</span></li>`;
  return h;
};
G.strum=(c,dir="D",when=0,vol=.5,capo=0,bassOnly=false)=>{
  if(bassOnly){ pluck(G.midi(c.b,c.f[c.b],capo),when,vol*1.2); return; }
  const idx=c.f.map((f,s)=>f>=0?s:-1).filter(s=>s>=0);
  const order=dir==="U"?idx.filter(s=>s>=2).reverse():idx;
  order.forEach((s,i)=>pluck(G.midi(s,c.f[s],capo),when+i*(dir==="U"?.012:.016),vol*(dir==="U"?.75:1)));
};

G.WEEKS=()=>[
 {t:X("Sitting, tuning, Em and Am","Sitzen, stimmen, Em und Am","Oturuş, akort, Em ve Am"),why:X("The two easiest chords. Check every string: does it ring clean or buzz?","Die zwei leichtesten Akkorde. Prüf jede Saite einzeln: Klingt sie sauber oder schnarrt sie?","En kolay iki akor. Her teli tek tek kontrol et: temiz mi çalıyor, cızırdıyor mu?"),items:[
  {t:X("Sit correctly","Richtig sitzen","Doğru otur"),d:[

    X("Left foot on a small footstool (or a thick book).","Linker Fuß auf eine kleine Fußbank (oder ein dickes Buch).","Sol ayak küçük bir ayak taburesine (ya da kalın bir kitaba)."),
    X("The guitar rests on the left thigh, the neck points up at an angle.","Die Gitarre liegt auf dem linken Oberschenkel, der Hals zeigt schräg nach oben.","Gitar sol uyluğun üstünde, sap yukarı doğru eğik."),
    X("Right forearm rests on the edge, the hand hangs over the sound hole.","Rechter Unterarm liegt locker auf der Kante, die Hand hängt über dem Schallloch.","Sağ önkol kenarda durur, el ses deliğinin üstünde sarkar."),
    X("Left thumb behind the neck, roughly behind the middle finger. Don't wrap it around.","Linker Daumen hinten am Hals, etwa hinter dem Mittelfinger. Nicht um den Hals greifen.","Sol başparmak sapın arkasında, orta parmağın arkasında. Sapı sarma."),
    X("Cut left-hand nails short, otherwise you cannot press cleanly.","Linke Fingernägel kurz schneiden, sonst kannst du nicht sauber drücken.","Sol el tırnaklarını kısa kes, yoksa temiz basamazsın.")]},
  {t:X("Tune with the reference tones","Mit den Vergleichstönen stimmen","Referans seslerle akort et"),go:"tune",d:[
    X("Open “Tuning” and tap the low E. Pluck your own low E string at the same time.","„Stimmen“ öffnen und die tiefe E antippen. Gleichzeitig deine tiefe E-Saite zupfen.","“Akort” bölümünü aç ve kalın Mi'ye dokun. Aynı anda kendi kalın Mi telini çek."),
    X("Your string sounds lower: turn the peg so the string gets tighter. Higher: looser.","Klingt deine Saite tiefer: Wirbel so drehen, dass sie straffer wird. Höher: lockerer.","Telin daha pes: teli gerecek yöne çevir. Daha tiz: gevşet."),
    X("Turn in small steps and listen again after each turn.","In kleinen Schritten drehen und nach jedem Dreh neu hören.","Küçük adımlarla çevir ve her seferinde tekrar dinle."),
    X("Then A, D, G, B and high e. At the end check all six once more.","Dann A, D, G, H und hohe e. Zum Schluss alle 6 noch einmal prüfen.","Sonra La, Re, Sol, Si ve ince Mi. Sonunda altısını bir kez daha kontrol et.")]},
  {t:X("Em: all six strings ring clean","Em: alle 6 Saiten klingen sauber","Em: altı tel de temiz çalıyor"),go:"chords",set:{chord:"Em"},show:{chord:"Em"},d:[

    X("Strum all six strings from thick to thin.","Alle 6 Saiten von dick nach dünn anschlagen.","Altı teli kalından inceye çal."),
    X("Now pluck each string on its own. Every string should ring, nothing buzzes.","Jetzt jede Saite einzeln zupfen. Jede soll klingen, nichts schnarrt.","Şimdi her teli tek tek çek. Her tel çalmalı, cızırtı olmamalı."),
    X("A string buzzes or sounds dead? Look at “Problem? Here's the fix” below.","Schnarrt eine Saite oder klingt dumpf? Unten bei „Problem? Hier die Lösung“ nachsehen.","Bir tel cızırdıyor ya da ses vermiyor mu? Aşağıdaki “Sorun mu var?” bölümüne bak.")]},
  {t:X("Am: skip the low E string","Am: tiefe E-Saite auslassen","Am: kalın Mi telini atla"),go:"chords",set:{chord:"Am"},show:{chord:"Am"},d:[
    X("Index on the B string fret 1, middle on the D string fret 2, ring on the G string fret 2.","Zeigefinger H-Saite 1. Bund, Mittelfinger D-Saite 2. Bund, Ringfinger G-Saite 2. Bund.","İşaret Si teli 1. perde, orta Re teli 2. perde, yüzük Sol teli 2. perde."),
    X("Start the strum on the A string, the low E stays silent.","Den Anschlag bei der A-Saite beginnen, die tiefe E bleibt stumm.","Ritmi La telinden başlat, kalın Mi sessiz kalır."),

  {t:X("One-minute drill Em ↔ Am: 15 changes","1-Minuten-Übung Em ↔ Am: 15 Wechsel","Bir dakika çalışması Em ↔ Am: 15 geçiş"),go:"chords",set:{pair:0},d:[
    X("Under “Chords” at the bottom choose Em ↔ Am and start the minute.","Unter „Akkorde“ ganz unten Em ↔ Am wählen und die Minute starten.","“Akorlar” bölümünün en altında Em ↔ Am seç ve dakikayı başlat."),
    X("Trick: the Em shape moves down one string each, then the index finger joins.","Trick: Die Em-Form rutscht je eine Saite tiefer, dann kommt der Zeigefinger dazu.","Püf noktası: Em şekli birer tel aşağı kayar, sonra işaret parmağı eklenir."),
    X("Tap “+1 change” for every clean change. Goal: 15 in one minute.","Für jeden sauberen Wechsel „+1 Wechsel“ tippen. Ziel: 15 in einer Minute.","Her temiz geçişte “+1 geçiş”e dokun. Hedef: bir dakikada 15.")]},
  {t:X("Strum pattern 1 with Em and Am","Anschlag 1 mit Em und Am","Em ve Am ile ritim 1"),go:"strum",set:{pat:0,prog:6,bpm:60},d:[
    X("Four even downstrokes per bar: “1, 2, 3, 4”.","Vier gleichmäßige Abschläge pro Takt: „1, 2, 3, 4“.","Ölçü başına dört düzenli aşağı vuruş: “1, 2, 3, 4”."),

    X("Press “Play”, listen once, then play along.","„Abspielen“ drücken, einmal zuhören, dann mitspielen.","“Çal”a bas, bir kez dinle, sonra birlikte çal.")]}]},

    X("The number is the fret. 0 means open.","Die Zahl ist der Bund. 0 heißt leer.","Sayı perdedir. 0 boş demek."),
    X("Read from left to right, one column after another.","Von links nach rechts lesen, Spalte für Spalte.","Soldan sağa, sütun sütun oku.")]}]},
 {t:X("Minor colours: Dm, E, E7","Moll-Farben: Dm, E, E7","Minör renkler: Dm, E, E7"),why:X("Am – Dm – E is the typical sad sound of many Turkish songs.","Am – Dm – E ist der typische traurige Klang vieler türkischer Lieder.","Am – Dm – E birçok Türkçe şarkının tipik hüzünlü sesidir."),items:[
  {t:X("Dm clean","Dm sauber","Dm temiz"),go:"chords",set:{chord:"Dm"},show:{chord:"Dm"},d:[
    X("Middle G fret 2, ring B fret 3, index high e fret 1.","Mittelfinger G 2. Bund, Ringfinger H 3. Bund, Zeigefinger hohe e 1. Bund.","Orta Sol 2. perde, yüzük Si 3. perde, işaret ince Mi 1. perde."),
    X("Strum from the D string only.","Erst ab der D-Saite anschlagen.","Sadece Re telinden itibaren çal.")]},
  {t:X("E and E7","E und E7","E ve E7"),go:"chords",set:{chord:"E7"},show:{chord:"E7"},d:[
    X("E: like Em plus the index finger on the G string fret 1.","E: wie Em plus Zeigefinger auf G-Saite 1. Bund.","E: Em gibi, artı işaret parmağı Sol teli 1. perdede."),
    X("E7: lift the ring finger off E. The D string rings open.","E7: Bei E den Ringfinger weglassen. Die D-Saite klingt leer.","E7: E'den yüzük parmağını kaldır. Re teli boş çalar."),
    X("Listen: E7 wants to move on to Am.","Hör hin: E7 will weiter nach Am.","Dinle: E7 Am'ye gitmek ister.")]},
  {t:X("Am – Dm – E – Am with pattern 1","Am – Dm – E – Am mit Anschlag 1","Ritim 1 ile Am – Dm – E – Am"),go:"strum",set:{pat:0,prog:0,bpm:60},d:[
    X("One chord per bar, four downstrokes each.","Ein Akkord pro Takt, je vier Abschläge.","Ölçü başına bir akor, dörder aşağı vuruş."),
    X("Am → Dm: the index stays close, the shape moves up.","Am → Dm: Zeigefinger bleibt nah, die Form rutscht hoch.","Am → Dm: işaret yakın kalır, şekil yukarı kayar."),
    X("Dm → E: whole hand moves, practise it alone first.","Dm → E: ganze Hand wandert, zuerst einzeln üben.","Dm → E: bütün el hareket eder, önce ayrı çalış.")]},
  {t:X("Am – Dm – E – Am picked with pattern 2","Am – Dm – E – Am gezupft mit Muster 2","Kalıp 2 ile Am – Dm – E – Am"),go:"pick",set:{ppat:1,pchord:"Am",pbpm:60},d:[
    X("Pattern p i m a m i, once per chord.","Muster p i m a m i, einmal pro Akkord.","Akor başına bir kez p i m a m i."),
    X("Thumb: A string for Am, D string for Dm, low E for E.","Daumen: A-Saite bei Am, D-Saite bei Dm, tiefe E bei E.","Başparmak: Am'de La, Dm'de Re, E'de kalın Mi."),
    X("This already sounds like a real Turkish ballad intro.","Das klingt schon wie das Intro einer echten türkischen Ballade.","Bu şimdiden gerçek bir Türk baladının girişi gibi duyulur.")]}]},
 {t:X("Reading notes in first position","Noten lesen in der 1. Lage","Birinci pozisyonda nota okuma"),why:X("From here you can play melodies, not only chords.","Ab hier kannst du Melodien spielen statt nur Akkorde.","Buradan itibaren sadece akor değil melodi de çalabilirsin."),items:[
  {t:X("Find E F G and B C D on the two thin strings","E F G und H C D auf den zwei dünnen Saiten finden","İki ince telde Mi Fa Sol ve Si Do Re bul"),go:"notes",d:[
    X("High e string: E open, F fret 1, G fret 3.","Hohe e-Saite: E leer, F 1. Bund, G 3. Bund.","İnce Mi teli: Mi boş, Fa 1. perde, Sol 3. perde."),
    X("B string: B open, C fret 1, D fret 3.","H-Saite: H leer, C 1. Bund, D 3. Bund.","Si teli: Si boş, Do 1. perde, Re 3. perde."),
    X("Tap each note under “Notes” and play it after the sound.","Jede Note unter „Noten“ antippen und nach dem Ton nachspielen.","“Notalar”da her notaya dokun ve sesten sonra çal.")]},
  {t:X("Note values: whole, half, quarter","Notenwerte: Ganze, Halbe, Viertel","Nota değerleri: birlik, ikilik, dörtlük"),go:"notes",d:[
    X("Whole = 4 beats, half = 2, quarter = 1.","Ganze = 4 Schläge, Halbe = 2, Viertel = 1.","Birlik = 4 vuruş, ikilik = 2, dörtlük = 1."),
    X("Use the “Listen” buttons and clap along.","Die „Anhören“-Knöpfe nutzen und mitklatschen.","“Dinle” düğmelerini kullan ve alkışla.")]},
  {t:X("Play a simple melody from notes","Eine einfache Melodie aus Noten spielen","Notadan basit bir melodi çal"),go:"notes",d:[
    X("“Ode to Joy” (Beethoven), quarter notes: E E F G | G F E D | C C D E | E D D.","„Ode an die Freude“ (Beethoven), in Vierteln: E E F G | G F E D | C C D E | E D D.","“Neşeye Övgü” (Beethoven), dörtlükler: Mi Mi Fa Sol | Sol Fa Mi Re | Do Do Re Mi | Mi Re Re."),
    X("All these notes are on the e and B strings.","Alle Töne liegen auf der e- und H-Saite.","Bu notaların hepsi ince Mi ve Si telinde."),
    X("Slow and even. Count “1, 2, 3, 4” per bar.","Langsam und gleichmäßig. Pro Takt „1, 2, 3, 4“ zählen.","Yavaş ve düzenli. Ölçü başına “1, 2, 3, 4” say.")]},
  {t:X("Add the G string (G, A)","Töne auf der G-Saite dazu (G, A)","Sol telini ekle (Sol, La)"),go:"notes",d:[
    X("G string: G open, A fret 2.","G-Saite: G leer, A 2. Bund.","Sol teli: Sol boş, La 2. perde."),
    X("Play the scale G A B C D E F G up and down.","Die Tonleiter G A H C D E F G rauf und runter.","Sol La Si Do Re Mi Fa Sol gamını yukarı ve aşağı çal.")]}]},
 {t:X("Capo and your first song","Kapodaster und erstes Lied","Kapo ve ilk şarkın"),why:X("A real song from a chord sheet. Use a capo if the sheet says so.","Ein echtes Lied mit Akkordblatt. Kapo, wenn das Blatt es sagt.","Akor sayfasından gerçek bir şarkı. Sayfa diyorsa kapo kullan."),items:[
  {t:X("Clamp the capo and retune","Kapo richtig klemmen und nachstimmen","Kapoyu tak ve yeniden akort et"),go:"capo",d:[
    X("Just behind the fret wire, straight across all strings.","Kurz vor dem Bundstäbchen, gerade über alle Saiten.","Perde telinin hemen arkasına, tüm tellerin üstüne düz."),
    X("Firm enough that nothing buzzes, not tighter.","So fest, dass nichts schnarrt, nicht fester.","Hiçbir şey cızırdamayacak kadar sıkı, daha fazla değil."),
    X("Check the tuning again afterwards.","Danach die Stimmung nochmal prüfen.","Sonra akordu tekrar kontrol et.")]},
  {t:X("Find a chord sheet for a song","Akkordblatt für ein Lied finden","Bir şarkının akor sayfasını bul"),d:[
    X("Search for “song name chords” or “şarkı adı akor”.","Suche nach „Liedname chords“ oder „şarkı adı akor“.","“şarkı adı akor” ya da “song name chords” diye ara."),
    X("Choose a version with chords you know (Am, Dm, E, C, G, D).","Nimm eine Version mit Akkorden, die du kennst (Am, Dm, E, C, G, D).","Bildiğin akorlarla bir versiyon seç (Am, Dm, E, C, G, D)."),
    X("Note the capo fret if one is given.","Den Kapo-Bund merken, falls einer angegeben ist.","Varsa kapo perdesini not et.")]},
  {t:X("Verse with one strum pattern","Strophe mit einem Anschlagmuster","Bir ritimle kıta"),go:"strum",d:[
    X("Pick pattern 1 or 3 and keep it the whole verse.","Muster 1 oder 3 wählen und die ganze Strophe beibehalten.","Ritim 1 ya da 3'ü seç ve bütün kıta boyunca koru."),
    X("Change on the word under the new chord.","Beim Wort unter dem neuen Akkord wechseln.","Yeni akorun altındaki kelimede geç."),
    X("Sing or hum along quietly, it helps the timing.","Leise mitsingen oder summen, das hilft beim Timing.","Sessizce eşlik et ya da mırıldan, zamanlamaya yardım eder.")]},
  {t:X("Whole song slowly without stopping","Ganzes Lied langsam ohne Stopp","Bütün şarkı yavaşça durmadan"),d:[
    X("Slow tempo, but never stop. Skip a chord rather than stop.","Langsames Tempo, aber nie anhalten. Lieber einen Akkord auslassen.","Yavaş tempo ama asla durma. Durmak yerine bir akoru atla."),
    X("Record yourself on the phone and listen back.","Nimm dich mit dem Handy auf und hör es dir an.","Kendini telefonla kaydet ve dinle.")]}]},
 {t:X("Waltz and alternating bass","Walzer und Wechselbass","Vals ve değişen bas"),why:X("More variety for the right hand.","Mehr Abwechslung für die rechte Hand.","Sağ el için daha fazla çeşit."),items:[
  {t:X("Pattern 5 (waltz) with Am – Dm – E – Am","Anschlag 5 (Walzer) mit Am – Dm – E – Am","Am – Dm – E – Am ile ritim 5 (vals)"),go:"strum",set:{pat:4,prog:0,bpm:70},d:[
    X("Count in threes: “1 2 3, 1 2 3”.","In Dreiern zählen: „1 2 3, 1 2 3“.","Üçlü say: “1 2 3, 1 2 3”."),
    X("1 = bass note with the thumb, 2 and 3 = chord strokes.","1 = Bass-Ton mit dem Daumen, 2 und 3 = Akkord-Schläge.","1 = başparmakla bas, 2 ve 3 = akor vuruşları.")]},
  {t:X("Picking 5 (p + chord) in 3/4","Picking 5 (p + Akkord) im 3er-Takt","3/4'te kalıp 5 (p + akor)"),go:"pick",set:{ppat:4,pchord:"Am",pbpm:70},d:[
    X("Thumb first, then i, m and a pluck together twice.","Erst Daumen, dann i, m und a zweimal gleichzeitig.","Önce başparmak, sonra i, m ve a iki kez birlikte."),
    X("The three fingers sound like one.","Die drei Finger klingen wie einer.","Üç parmak tek ses gibi duyulsun.")]},
  {t:X("Picking 6 (alternating bass) with C and G","Picking 6 (Wechselbass) mit C und G","C ve G ile kalıp 6 (değişen bas)"),go:"pick",set:{ppat:5,pchord:"C",pbpm:60},d:[
    X("The thumb alternates between two bass strings.","Der Daumen wechselt zwischen zwei Bass-Saiten.","Başparmak iki bas teli arasında gidip gelir."),
    X("Keep the thumb steady like a clock, the fingers fill the gaps.","Daumen gleichmäßig wie eine Uhr, die Finger füllen die Lücken.","Başparmak saat gibi düzenli, parmaklar boşlukları doldurur.")]},
  {t:X("Your song picked instead of strummed","Dein Lied gezupft statt geschlagen","Şarkını ritim yerine parmakla çal"),d:[
    X("Take your song from week 7 and replace the strumming with pattern 1 or 2.","Nimm dein Lied aus Woche 7 und ersetze den Anschlag durch Muster 1 oder 2.","7. haftadaki şarkını al ve ritmi kalıp 1 ya da 2 ile değiştir."),
    X("One pattern per chord. Slow first.","Ein Muster pro Akkord. Erst langsam.","Akor başına bir kalıp. Önce yavaş.")]}]}
];
G.ROUTINE=()=>[
 {m:2,t:X("Tune","Stimmen","Akort"),d:X("Check each string with its reference tone.","Jede Saite mit dem Vergleichston prüfen.","Her teli referans sesiyle kontrol et.")},
 {m:4,t:X("Chords of the week","Akkorde der Woche","Haftanın akorları"),d:X("Press each chord and pluck every string: does it all ring clean?","Jeden Akkord greifen, jede Saite einzeln anzupfen: Klingt alles sauber?","Her akoru bas, her teli tek tek çal: hepsi temiz mi?")},
 {m:4,t:X("One-minute changes","1-Minuten-Wechsel","Bir dakika geçiş"),d:X("Two rounds with your hardest pair.","Zwei Runden mit deinem schwierigsten Paar.","En zor çiftinle iki tur.")},
 {m:5,t:X("Right hand","Rechte Hand","Sağ el"),d:X("A strum or picking pattern, slowly with the click.","Anschlag- oder Picking-Muster langsam mit Klick.","Bir ritim ya da parmak kalıbı, metronomla yavaşça.")},
 {m:5,t:X("A song","Ein Lied","Bir şarkı"),d:X("Your song from start to end. Slow but without stopping.","Dein Lied von vorne bis hinten, lieber langsam ohne Stopp.","Şarkını baştan sona. Yavaş ama durmadan.")}
];
G.PROBS=()=>[
 {p:X("A string buzzes","Eine Saite schnarrt","Bir tel cızırdıyor"),f:[[X("Finger too far from the fret","Finger zu weit weg vom Bundstäbchen","Parmak perde telinden çok uzak"),X("Press just behind the metal fret wire, not in the middle of the space.","Kurz vor dem Metallstäbchen drücken, nicht in der Mitte.","Metal perde telinin hemen arkasına bas, ortaya değil.")],[X("Not enough pressure","Zu wenig Druck","Yetersiz baskı"),X("Press a little harder. The thumb behind the neck gives counter-pressure.","Etwas fester drücken. Der Daumen hinten am Hals gibt Gegendruck.","Biraz daha sıkı bas. Sapın arkasındaki başparmak karşı baskı verir.")],[X("Out of tune or crooked capo","Verstimmt oder Kapo schief","Akort bozuk ya da kapo eğri"),X("Retune and set the capo straight.","Nachstimmen, Kapo gerade setzen.","Yeniden akort et, kapoyu düz tak.")]]},
 {p:X("A string sounds dead","Eine Saite klingt dumpf","Bir tel ses vermiyor"),f:[[X("A finger touches the next string","Ein Finger berührt die Nachbarsaite","Bir parmak yan tele değiyor"),X("Place fingers more upright, only with the tip.","Finger steiler aufsetzen, nur mit der Fingerkuppe.","Parmakları daha dik, sadece uçlarıyla bas.")],[X("Left-hand nails too long","Linke Nägel zu lang","Sol el tırnakları çok uzun"),X("Cut them short.","Kurz schneiden.","Kısa kes.")],[X("Thumb wrapped around the neck","Daumen um den Hals","Başparmak sapın etrafında"),X("Put the thumb in the middle of the back of the neck.","Daumen hinten in die Mitte des Halses.","Başparmağı sapın arkasının ortasına koy.")]]},
 {p:X("Fingertips hurt","Fingerkuppen tun weh","Parmak uçları acıyor"),f:[[X("Completely normal at first","Ganz normal am Anfang","Başta tamamen normal"),X("The skin gets harder within 2 to 4 weeks.","Die Haut wird in 2 bis 4 Wochen härter.","Deri 2-4 hafta içinde sertleşir.")],[X("Too long in one go","Zu lange am Stück","Tek seferde çok uzun"),X("Three times 10 minutes a day beats one hour.","Lieber 3 mal 10 Minuten am Tag als 1 Stunde.","Günde üç kez 10 dakika, bir saatten iyidir.")],[X("Pressing too hard","Zu fest gedrückt","Çok sert basmak"),X("Find the least pressure that still sounds clean.","Teste, wie wenig Druck gerade noch sauber klingt.","Temiz ses veren en az baskıyı bul.")]]},
 {p:X("Chord changes too slow","Akkordwechsel zu langsam","Akor geçişleri çok yavaş"),f:[[X("Placing fingers one by one","Finger einzeln setzen","Parmakları tek tek koymak"),X("Move all fingers together as one shape. Practise the shape in the air.","Alle Finger gleichzeitig als Form bewegen. Übe die Form in der Luft.","Tüm parmakları tek bir şekil olarak birlikte hareket ettir. Şekli havada çalış.")],[X("Not using anchor fingers","Ankerfinger nicht genutzt","Sabit parmakları kullanmamak"),X("Fingers that stay the same remain on the string.","Finger, die gleich bleiben, liegen lassen.","Aynı kalan parmaklar telde kalsın.")],[X("Practising too fast","Zu schnell geübt","Çok hızlı çalışmak"),X("Slow tempo, but without pauses. Do the one-minute drill daily.","Langsames Tempo, dafür ohne Pause. Die 1-Minuten-Übung täglich.","Yavaş tempo ama durmadan. Bir dakika çalışmasını her gün yap.")]]},
 {p:X("Rhythm is shaky","Rhythmus wackelt","Ritim düzensiz"),f:[[X("Hand stops between strokes","Hand stoppt zwischen den Schlägen","El vuruşlar arasında duruyor"),X("Keep the hand swinging, even through gaps.","Hand pendelt immer weiter, auch bei Lücken.","El boşluklarda bile sallanmaya devam etsin.")],[X("Not counting","Ohne Zählen","Saymadan çalmak"),X("Count out loud: 1 and 2 and.","Laut „1 und 2 und“ mitzählen.","Yüksek sesle say: 1 ve 2 ve.")],[X("Too fast","Zu schnell","Çok hızlı"),X("Lower the tempo, use the click. Five times clean, then faster.","Tempo runter, Klick an. 5 Mal fehlerfrei, dann schneller.","Tempoyu düşür, metronom aç. Beş kez temiz, sonra hızlan.")]]},
 {p:X("Guitar keeps going out of tune","Gitarre verstimmt sich ständig","Gitarın akordu sürekli bozuluyor"),f:[[X("New nylon strings","Neue Nylonsaiten","Yeni naylon teller"),X("They stretch for 1 to 2 weeks. Retuning often is normal.","Die dehnen sich 1 bis 2 Wochen. Oft nachstimmen ist normal.","1-2 hafta esnerler. Sık akort etmek normaldir.")],[X("Temperature","Temperatur","Sıcaklık"),X("Tune every time before you practise.","Vor jedem Üben stimmen.","Her çalışmadan önce akort et.")]]}
];
G.PATS=()=>[
 {n:X("1 · Four downstrokes","1 · Vier Abschläge","1 · Dört aşağı vuruş"),p:"D-D-D-D-",info:X("The start. One downstroke on every number. Stress beat 1 a little.","Der Anfang. Auf jede Zahl ein Schlag nach unten. Die 1 etwas betonen.","Başlangıç. Her sayıda bir aşağı vuruş. 1'i biraz vurgula.")},
 {n:X("2 · Train","2 · Eisenbahn","2 · Tren"),p:"DUDUDUDU",info:X("Down on the number, up on the “and”. Even like a running train.","Runter auf der Zahl, hoch auf dem „und“. Gleichmäßig wie ein Zug.","Sayıda aşağı, “ve”de yukarı. Giden bir tren gibi düzenli.")},
 {n:X("3 · Western","3 · Westernschlag","3 · Western"),p:"D-DUD-DU",info:X("“1 – 2 and 3 – 4 and”. In the gaps the hand moves up without hitting.","„1 – 2 und 3 – 4 und“. Bei den Lücken geht die Hand leer hoch.","“1 – 2 ve 3 – 4 ve”. Boşluklarda el tellere değmeden yukarı gider.")},
 {n:X("4 · Campfire","4 · Lagerfeuer","4 · Kamp ateşi"),p:"D-DU-UDU",info:X("The best-known pop pattern. Skip beat 3, the hand still moves.","Das bekannteste Pop-Muster. Auf der 3 nichts treffen, Hand bewegt sich trotzdem.","En bilinen pop ritmi. 3'te tellere vurma, el yine de hareket eder.")},
 {n:X("5 · Waltz (3/4)","5 · Walzer (3er-Takt)","5 · Vals (3/4)"),p:"B-D-D-",info:X("Three beats per bar: bass note first, then two chord strokes. “Boom – chick – chick”. ♪ = bass note only (thumb).","3 Schläge pro Takt: erst der Bass-Ton, dann zwei Akkord-Schläge. ♪ = nur der Bass-Ton (Daumen).","Ölçüde üç vuruş: önce bas notası, sonra iki akor vuruşu. ♪ = sadece bas notası (başparmak).")}
];
G.PROGS=[["Am","Dm","E","Am"],["Em","Am","D","G"],["D","A","D","A"],["G","C","D","G"],["Am","G","Fmaj7","E"],["Em","D","C","D"],["Em","Am","Em","Am"],["D","G","A","D"]];
G.PPAT=()=>[
 {n:"1 · p i m a",s:["p","i","m","a"],info:X("Thumb plays the bass, then index, middle, ring one after another. The basic pattern.","Daumen Bass, dann Zeige-, Mittel-, Ringfinger nacheinander. Das Grundmuster.","Başparmak bas, sonra işaret, orta, yüzük sırayla. Temel kalıp.")},
 {n:"2 · p i m a m i",s:["p","i","m","a","m","i"],info:X("Up and back down. Flowing, good for calm songs.","Hoch und wieder runter. Klingt fließend, gut für ruhige Lieder.","Yukarı ve geri aşağı. Akıcı, sakin şarkılar için iyi.")},
 {n:"3 · p i m i",s:["p","i","m","i"],info:X("Only three upper strings. Easy and even.","Nur drei Saiten oben. Sehr leicht und gleichmäßig.","Sadece üstteki üç tel. Kolay ve düzenli.")},
 {n:"4 · p a m i",s:["p","a","m","i"],info:X("From top to bottom. Sounds like a falling arc.","Von oben nach unten. Klingt wie ein fallender Bogen.","Yukarıdan aşağıya. Düşen bir kavis gibi.")},
 {n:X("5 · p + chord","5 · p + Akkord","5 · p + akor"),s:["p","ima","ima"],info:X("Bass first, then i, m and a together. Good for 3/4 (waltz).","Erst Bass, dann i, m und a gleichzeitig. Gut für 3er-Takt (Walzer).","Önce bas, sonra i, m ve a birlikte. 3/4 (vals) için iyi.")},
 {n:X("6 · Alternating bass","6 · Wechselbass","6 · Değişen bas"),s:["p","i","m","i","p2","i","m","i"],info:X("The thumb alternates between two bass strings. Sounds like a walking bass.","Der Daumen wechselt zwischen zwei Bass-Saiten. Klingt wie ein laufender Bass.","Başparmak iki bas teli arasında gidip gelir. Yürüyen bas gibi.")}
];
G.STR_OF={i:3,m:4,a:5};
G.NOTES=[[40,0,0],[41,0,1],[43,0,3],[45,1,0],[47,1,2],[48,1,3],[50,2,0],[52,2,2],[53,2,3],[55,3,0],[57,3,2],[59,4,0],[60,4,1],[62,4,3],[64,5,0],[65,5,1],[67,5,3]];

G.state={view:"start",chord:"Am",pat:0,prog:0,bpm:70,metro:true,ppat:0,pchord:"Am",pbpm:70,capo:0,target:-1,note:0,pair:0};
G.VIEWS=()=>[["start",X("Start here","Start hier","Buradan başla")],["chords",X("Chords","Akkorde","Akorlar")],["strum",X("Strumming","Anschlag","Ritim")],["pick",X("Picking","Picking","Parmakla çalma")],["capo",X("Capo","Kapodaster","Kapo")],["songs",X("Songs","Lieder","Şarkılar")],["notes",X("Read music","Noten lesen","Nota okuma")],["tune",X("Tuner","Stimmgerät","Akort")],["tips",X("Tips","Tipps","İpuçları")]];
G.title=()=>X("Learn guitar","Gitarre lernen","Gitar öğren");
G.intro=()=>X("Classical guitar from zero: reading chord diagrams, strumming, picking, capo and notes. Everything with sound.","Klassische Gitarre von null: Griffbilder lesen, Anschlag, Picking, Kapodaster und Noten. Alles mit Ton zum Anhören.","Sıfırdan klasik gitar: akor şeması okuma, ritim, parmakla çalma, kapo ve notalar. Hepsi sesli.");

G.render={
start:()=>`
<div class="panel"><h2>${X("Your path in 8 weeks","Dein Weg in 8 Wochen","8 haftalık yolun")}</h2><p class="lead">${X("A little every day. Tick off what works. Move on only when a week feels solid. Your progress stays in this browser.","Jeden Tag ein bisschen. Hak ab, was klappt. Erst wenn eine Woche sitzt, weiter. Dein Fortschritt bleibt in diesem Browser gespeichert.","Her gün biraz. Olanları işaretle. Bir hafta oturunca devam et. İlerlemen bu tarayıcıda kalır.")}</p>${pathHTML()}</div>
${coachHTML()}
<div class="two">
<div class="panel"><h2>${X("Daily practice (20 min)","Tägliche Übe-Runde (20 Min.)","Günlük çalışma (20 dk)")}</h2><p class="lead">${X("Short and regular beats rare and long. Sore fingertips at the start are normal and get better after 2 to 4 weeks.","Kurz und regelmäßig bringt mehr als selten und lang. Am Anfang tun die Fingerkuppen weh. Das ist normal und wird nach 2 bis 4 Wochen besser.","Kısa ve düzenli, seyrek ve uzundan iyidir. Başta parmak uçlarının acıması normaldir, 2-4 haftada geçer.")}</p>${routineHTML()}</div>

<b>E</b>                  <b>Am</b>
Sadece benim için çalar`})}</div>
<p class="lead" style="margin-top:10px">${X("“Capo 2” at the top means: clamp the capo at fret 2 and play the shapes exactly as written. More under “Capo”.","„Kapo 2“ ganz oben heißt: Kapodaster in den 2. Bund klemmen und die Griffe genau so spielen, wie sie dastehen. Mehr unter „Kapodaster“.","En üstte “Kapo 2” yazıyorsa: kapoyu 2. perdeye tak ve akorları yazıldığı gibi çal. Daha fazlası “Kapo” bölümünde.")}</p></div>

chords:()=>`
<div class="panel"><h2>${X("How to read a chord diagram","Ein Griffbild lesen","Akor şeması nasıl okunur")}</h2><div class="two">
 <div class="legend">
  <span class="k" style="border-radius:4px">│</span><span><b>${X("Vertical lines = strings.","Senkrechte Linien = Saiten.","Dikey çizgiler = teller.")}</b> ${X("Left is the thick low E, right the thin high e. As if the guitar stands in front of you.","Links die dicke tiefe E-Saite, rechts die dünne hohe e-Saite. So, als stünde die Gitarre vor dir.","Solda kalın Mi, sağda ince Mi. Gitar önünde dik duruyormuş gibi.")}</span>
  <span class="k" style="border-radius:4px">─</span><span><b>${X("Horizontal lines = frets.","Waagerechte Linien = Bundstäbchen.","Yatay çizgiler = perdeler.")}</b> ${X("The thick bar on top is the nut (end of the neck). Below are frets 1, 2, 3.","Der dicke Balken oben ist der Sattel. Darunter der 1., 2., 3. Bund.","Üstteki kalın çizgi eşiktir (sapın ucu). Altında 1., 2., 3. perde.")}</span>
  <span class="k" style="background:var(--ink);color:var(--bg)">2</span><span><b>${X("Dot with number = which finger.","Punkt mit Zahl = welcher Finger.","Sayılı nokta = hangi parmak.")}</b> ${X("1 index, 2 middle, 3 ring, 4 little finger. Press just behind the fret.","1 Zeige-, 2 Mittel-, 3 Ring-, 4 kleiner Finger. Kurz vor dem Bundstäbchen drücken.","1 işaret, 2 orta, 3 yüzük, 4 serçe. Perde telinin hemen arkasına bas.")}</span>
  <span class="k" style="color:var(--accent);border-color:var(--accent)">O</span><span><b>${X("O = play open.","O = leer spielen.","O = boş çal.")}</b> ${X("Strike the string without pressing.","Saite anschlagen, aber nicht drücken.","Tele basmadan çal.")}</span>
  <span class="k" style="color:var(--warn);border-color:var(--warn)">×</span><span><b>${X("× = don't play.","× = nicht spielen.","× = çalma.")}</b> ${X("Leave this string out.","Diese Saite auslassen.","Bu teli atla.")}</span>
 </div>
 <div class="facts">
  <div><b>${X("String names","Saitennamen","Tel adları")}</b><span>${L({en:"Thick to thin: E – A – D – G – B – e. “Eddie Ate Dynamite, Good Bye Eddie.”",de:"Von dick nach dünn: E – A – D – G – H – e. „Eine Alte Dame Geht Heute einkaufen.“",tr:"Kalından inceye: E – A – D – G – B – e (Mi – La – Re – Sol – Si – Mi)."})}</span></div>
  <div><b>${X("Major and minor","Dur und Moll","Majör ve minör")}</b><span>${X("A letter alone (A) is major and sounds bright. With “m” (Am) it is minor and sounds sad. Turkish songs use a lot of minor.","Buchstabe allein (A) = Dur, klingt hell. Mit „m“ (Am) = Moll, klingt traurig. Türkische Lieder nutzen viel Moll.","Tek harf (A) majördür, parlak duyulur. “m” ile (Am) minördür, hüzünlü duyulur. Türkçe şarkılarda çok minör var.")}</span></div>
  <div><b>${X("The 7","Die 7","7'li akorlar")}</b><span>${X("A7, E7 etc. sound “unfinished” and want to move on. E7 leads nicely to Am.","A7, E7 usw. klingen „unfertig“ und wollen weiter. E7 führt schön nach Am.","A7, E7 vb. “bitmemiş” duyulur ve ilerlemek ister. E7 güzelce Am'ye gider.")}</span></div>
 </div></div></div>
<div class="panel"><div class="chips" id="gChips">${G.CH.map(c=>`<button class="chip" data-c="${c.id}" aria-pressed="false">${G.name(c)}</button>`).join("")}</div>
 <div class="tool" style="margin-top:16px"><div class="diagram" id="gChordDiag"></div><div>
  <div class="row" style="justify-content:space-between;align-items:flex-end"><div><div class="big" id="gChordName"></div><div class="muted" id="gChordSub"></div></div>
  <div class="row"><button class="btn go" id="gStrum">${X("Strum","Anschlagen","Çal")}</button><button class="btn alt" id="gSlow">${X("One by one","Einzeln","Tek tek")}</button></div></div>
  <h3>${X("How to press it:","So greifst du:","Nasıl basılır:")}</h3><ol class="steps" id="gChordSteps"></ol><p class="muted" id="gChordTip" style="margin-top:10px"></p></div></div></div>
<div class="panel"><h2>${X("Practise changes: the one-minute drill","Akkordwechsel üben: die 1-Minuten-Übung","Geçiş çalış: bir dakika çalışması")}</h2><p class="lead">${X("Chords are not the hard part, the change is. Pick two chords, start the timer and switch back and forth for one minute. Every clean change counts. Tomorrow, try to beat it.","Nicht die Akkorde sind schwer, sondern der Wechsel. Nimm zwei Akkorde, stell den Timer und wechsle eine Minute lang hin und her. Jeder saubere Wechsel zählt. Morgen versuchst du, mehr zu schaffen.","Zor olan akorlar değil, geçiştir. İki akor seç, sayacı başlat ve bir dakika boyunca gidip gel. Her temiz geçiş sayılır. Yarın daha fazlasını dene.")}</p>
 <div class="row"><select id="gPair" aria-label="${X("Chord pair","Akkordpaar","Akor çifti")}"></select><button class="btn go" id="gMinStart">${X("Start 1 minute","1 Minute starten","1 dakika başlat")}</button><span class="clock" id="gMinClock" style="font-size:2rem">60</span></div>
 <div class="row" style="margin-top:10px"><button class="btn alt" id="gMinPlus">${X("+1 change","+1 Wechsel","+1 geçiş")}</button><span class="muted" id="gMinCount"></span><span class="muted" id="gMinBest"></span></div>
 <p class="muted" style="margin-top:10px">${X("Tip: fingers that stay the same in both chords (anchor fingers) stay down. Between Am and C, index and middle stay, only the ring finger moves.","Tipp: Finger, die in beiden Akkorden gleich bleiben (Ankerfinger), liegen lassen. Bei Am und C bleiben Zeige- und Mittelfinger liegen, nur der Ringfinger wandert.","İpucu: İki akorda da aynı kalan parmaklar (sabit parmaklar) yerinde kalsın. Am ile C arasında işaret ve orta kalır, sadece yüzük parmağı hareket eder.")}</p></div>`,

strum:()=>`
<div class="panel"><h2>${X("Understanding strum patterns","Anschlagmuster verstehen","Ritim kalıplarını anlamak")}</h2><p class="lead">${X("A bar has 4 beats with an “and” between each. Count aloud: “1 and 2 and 3 and 4 and”. Your hand moves down and up all the time like a pendulum: down (↓) on numbers, up (↑) on “and”. At a gap (·) the hand still moves but misses the strings.","Ein Takt hat 4 Schläge, dazwischen jeweils ein „und“. Zähl laut: „1 und 2 und 3 und 4 und“. Die Hand geht die ganze Zeit auf und ab wie ein Pendel: runter (↓) auf den Zahlen, hoch (↑) auf dem „und“. Bei einer Lücke (·) bewegt sie sich trotzdem, trifft aber die Saiten nicht.","Bir ölçüde 4 vuruş ve aralarında “ve” var. Yüksek sesle say: “1 ve 2 ve 3 ve 4 ve”. Elin sarkaç gibi sürekli aşağı yukarı gider: sayılarda aşağı (↓), “ve”de yukarı (↑). Boşlukta (·) el yine hareket eder ama tellere değmez.")}</p>
 <div class="row"><label for="gPat">${X("Pattern","Muster","Kalıp")}</label><select id="gPat"></select><label for="gProg">${X("Chords","Akkorde","Akorlar")}</label><select id="gProg"></select></div>
 <p class="muted" id="gPatInfo" style="margin:8px 0 0"></p><div class="beats" id="gBeats"></div><div class="prog" id="gProgView"></div>
 <div class="row" style="margin-top:14px"><label for="gBpm">${X("Tempo","Tempo","Tempo")}</label><input type="range" id="gBpm" min="40" max="130"><span class="muted" id="gBpmVal"></span><label><input type="checkbox" id="gMetro"> ${X("Click","Klick","Metronom")}</label></div>
 <div class="row" style="margin-top:10px"><button class="btn go" id="gSPlay">${X("Play","Abspielen","Çal")}</button><button class="btn alt" id="gSStop">${X("Stop","Stopp","Durdur")}</button></div></div>
<div class="two"><div class="panel"><h3 style="margin-top:0">${X("Current chord","Aktueller Akkord","Şu anki akor")}</h3><div class="diagram" id="gSDiag"></div></div>
 <div class="panel"><h3 style="margin-top:0">${X("How to practise a pattern","So übst du ein Muster","Bir kalıp nasıl çalışılır")}</h3><ol class="plain">
  <li>${X("First play the rhythm on muted strings (left hand resting lightly on them).","Erst den Rhythmus auf gedämpften Saiten spielen (linke Hand liegt locker drauf).","Önce ritmi susturulmuş tellerde çal (sol el hafifçe üstünde).")}</li>
  <li>${X("Then with one chord, without changing.","Dann mit einem Akkord, ohne zu wechseln.","Sonra tek akorla, değiştirmeden.")}</li>
  <li>${X("Then with changes, very slowly. Change already on the last “and” so beat 1 lands on time.","Dann mit Wechsel, ganz langsam. Schon auf dem letzten „und“ wechseln, damit die 1 pünktlich kommt.","Sonra geçişle, çok yavaş. 1 zamanında gelsin diye son “ve”de geçmeye başla.")}</li>
  <li>${X("Only when it works five times without stopping, raise the tempo by 5.","Erst wenn es 5 Mal ohne Stopp klappt, das Tempo um 5 erhöhen.","Beş kez durmadan olunca tempoyu 5 artır.")}</li>
  <li>${X("On classical guitar: thumb strums down, index nail strums up, no pick.","Bei Klassikgitarre: Daumen schlägt runter, Zeigefinger-Nagel hoch, kein Plektrum.","Klasik gitarda: başparmak aşağı, işaret parmağı tırnağı yukarı, pena yok.")}</li></ol></div></div>`,

pick:()=>`
<div class="panel"><h2>${X("What does “pick a G” mean?","Was heißt „G picken“?","“G'yi parmakla çal” ne demek?")}</h2><p class="lead">${X("The left hand holds the chord (for example G) and simply stays. The right hand does not strike all strings at once, it plucks them one after another in a fixed pattern. That is picking. On classical guitar each finger has its own string:","Die linke Hand hält den Akkord (zum Beispiel G) und bleibt einfach liegen. Die rechte Hand schlägt nicht alle Saiten auf einmal an, sondern zupft sie einzeln nacheinander in einem festen Muster. Das ist Picking. Bei der klassischen Gitarre hat jeder Finger seine eigene Saite:","Sol el akoru (örneğin G) tutar ve öyle kalır. Sağ el tüm tellere birden vurmaz, belli bir kalıpla teker teker çeker. Buna parmakla çalma denir. Klasik gitarda her parmağın kendi teli vardır:")}</p>
 <div class="fingers">
  <div><i style="background:var(--p)">p</i><span><b>${X("Thumb","Daumen","Başparmak")}</b><br>${X("Bass string: E, A or D. Always the root of the chord.","Bass-Saite: E, A oder D. Immer der Grundton des Akkords.","Bas teli: E, A ya da D. Her zaman akorun kök sesi.")}</span></div>
  <div><i style="background:var(--i)">i</i><span><b>${X("Index","Zeigefinger","İşaret")}</b><br>${G.strLong(3)}</span></div>
  <div><i style="background:var(--m)">m</i><span><b>${X("Middle","Mittelfinger","Orta")}</b><br>${G.strLong(4)}</span></div>
  <div><i style="background:var(--a)">a</i><span><b>${X("Ring","Ringfinger","Yüzük")}</b><br>${G.strLong(5)}</span></div></div>
 <p class="muted" style="margin-top:10px">${X("The letters come from Spanish: pulgar, índice, medio, anular. Almost every guitar book uses them.","Die Buchstaben kommen aus dem Spanischen: pulgar, índice, medio, anular. Fast jedes Gitarrenbuch nutzt sie.","Harfler İspanyolcadan gelir: pulgar, índice, medio, anular. Neredeyse her gitar kitabı bunları kullanır.")}</p></div>
<div class="panel"><div class="row"><label for="gPP">${X("Pattern","Muster","Kalıp")}</label><select id="gPP"></select><label for="gPC">${X("Chord","Akkord","Akor")}</label><select id="gPC"></select></div>
 <p class="muted" id="gPInfo" style="margin:8px 0 10px"></p>
 <h3>${X("As a tab","Als Tabulatur","Tab olarak")}</h3><p class="lead">${X("A tab shows the six strings as lines. The thin e string is on top, the thick E at the bottom, the opposite of a chord diagram. The number is the fret (0 = open). The coloured letter above tells which finger plucks. Read left to right.","Eine Tabulatur zeigt die 6 Saiten als Linien. Oben ist die dünne e-Saite, unten die dicke E-Saite, also umgekehrt wie im Griffbild. Die Zahl ist der Bund (0 = leer). Der farbige Buchstabe darüber sagt, welcher Finger zupft. Von links nach rechts lesen.","Tab altı teli çizgi olarak gösterir. İnce Mi üstte, kalın Mi altta, yani akor şemasının tersi. Sayı perdeyi gösterir (0 = boş). Üstteki renkli harf hangi parmağın çektiğini söyler. Soldan sağa oku.")}</p>
 <div class="scroll-x" id="gTab"></div>
 <div class="row" style="margin-top:12px"><label for="gPBpm">${X("Tempo","Tempo","Tempo")}</label><input type="range" id="gPBpm" min="40" max="140"><span class="muted" id="gPBpmVal"></span><button class="btn go" id="gPPlay">${X("Play","Abspielen","Çal")}</button><button class="btn alt" id="gPStop">${X("Stop","Stopp","Durdur")}</button></div></div>
<div class="two"><div class="panel"><h3 style="margin-top:0">${X("Chord","Akkord","Akor")}</h3><div class="diagram" id="gPDiag"></div></div>
 <div class="panel"><h3 style="margin-top:0">${X("Picking tips","Tipps fürs Zupfen","Parmakla çalma ipuçları")}</h3><ol class="plain">
  <li>${X("i, m and a rest ready on “their” strings, the thumb a bit further left on the bass strings.","i, m, a liegen schon auf „ihren“ Saiten bereit, der Daumen etwas weiter links auf den Bass-Saiten.","i, m ve a kendi tellerinde hazır bekler, başparmak biraz solda bas tellerinde.")}</li>
  <li>${X("Fingers pluck towards the palm, not upwards. The thumb pushes forward and down.","Die Finger zupfen zur Handfläche hin, nicht nach oben weg. Der Daumen drückt nach vorne-unten.","Parmaklar avuç içine doğru çeker, yukarı değil. Başparmak ileri-aşağı iter.")}</li>
  <li>${X("The hand stays still, only the fingers move.","Die Hand bleibt ruhig, nur die Finger bewegen sich.","El sabit kalır, sadece parmaklar hareket eder.")}</li>
  <li>${X("Very slow and even at first. Every note equally loud.","Erst ganz langsam und gleichmäßig. Jeder Ton gleich laut.","Önce çok yavaş ve düzenli. Her nota eşit yükseklikte.")}</li>
  <li>${X("The thumb changes string with the chord: A string for Am and C, low E for Em and G, D string for D and Dm.","Der Daumen wechselt je nach Akkord: A-Saite bei Am und C, tiefe E-Saite bei Em und G, D-Saite bei D und Dm.","Başparmak akora göre tel değiştirir: Am ve C'de La teli, Em ve G'de kalın Mi, D ve Dm'de Re teli.")}</li></ol></div></div>`,

capo:()=>`
<div class="panel"><h2>${X("What does a capo do?","Was macht ein Kapodaster?","Kapo ne işe yarar?")}</h2><p class="lead">${X("A capo is a clamp you put across all strings at one fret. It works like a new nut: all strings sound higher. Each fret raises everything by a half step. You keep playing the same easy shapes, they just sound higher.","Ein Kapodaster (Kapo) ist eine Klemme, die du quer über alle Saiten an einen Bund klemmst. Er wirkt wie ein neuer Sattel: Alle Saiten klingen höher. Jeder Bund macht alles einen Halbton höher. Du greifst weiter die gleichen einfachen Griffe, sie klingen nur höher.","Kapo, tüm tellerin üzerine bir perdede takılan bir kıskaçtır. Yeni bir eşik gibi çalışır: tüm teller daha tiz çalar. Her perde her şeyi yarım ses yükseltir. Aynı kolay akorları basmaya devam edersin, sadece daha tiz duyulur.")}</p>
 <div class="facts">
  <div><b>${X("What for?","Wozu?","Ne için?")}</b><span>${X("So a song fits your voice or the original recording without learning hard shapes.","Damit ein Lied zu deiner Stimme oder zur Original-Aufnahme passt, ohne schwere Griffe zu lernen.","Zor akorlar öğrenmeden şarkı sesine ya da orijinal kayda uysun diye.")}</span></div>
  <div><b>${X("Where to clamp?","Wo klemmen?","Nereye takılır?")}</b><span>${X("Just behind the fret wire, straight and firm enough that nothing buzzes. Retune afterwards.","Kurz vor dem Bundstäbchen, gerade und fest genug, dass nichts schnarrt. Danach kurz nachstimmen.","Perde telinin hemen arkasına, düz ve hiçbir şey cızırdamayacak kadar sıkı. Sonra akordu kontrol et.")}</span></div>
  <div><b>${X("How to count?","Wie zählen?","Nasıl sayılır?")}</b><span>${X("With a capo, count frets from the capo. The capo is now “0”. Diagrams apply from there.","Mit Kapo die Bünde ab dem Kapo neu zählen. Der Kapo ist jetzt „0“.","Kapoyla perdeleri kapodan itibaren say. Kapo artık “0”dır.")}</span></div>
  <div><b>${X("“Capo 3” on a sheet","„Kapo 3“ auf dem Blatt","Sayfada “Kapo 3”")}</b><span>${X("Capo at fret 3, then play the shapes shown above the lyrics. Don't convert anything.","Kapo in den 3. Bund, dann die Griffe spielen, die über dem Text stehen. Nicht umrechnen.","Kapo 3. perdeye, sonra sözlerin üstündeki akorları çal. Hiçbir şeyi dönüştürme.")}</span></div>
  <div><b>${X("“Capo 11” on a sheet?","„Kapo 11“ auf dem Blatt?","Sayfada “Kapo 11” mi?")}</b><span>${X("Some sites only calculate: easy shapes + 11 half steps = original key. On a classical guitar that's unplayable. 11 up is the same as 1 down: play the shapes without capo (a half step lower) or find a capo up to 5 with the calculator below or under Songs → My chord sheets.","Manche Seiten rechnen nur: leichte Griffe + 11 Halbtöne = Original-Tonart. Auf der Konzertgitarre ist das unspielbar. 11 hoch ist dasselbe wie 1 runter: Griffe ohne Kapo spielen (einen Halbton tiefer) oder mit dem Rechner unten bzw. unter Lieder → Eigene Akkordblätter einen Kapo bis 5 finden.","Bazı siteler sadece hesaplar: kolay akorlar + 11 yarım ses = orijinal ton. Klasik gitarda bu çalınmaz. 11 yukarı, 1 aşağı ile aynıdır: akorları kaposuz çal (yarım ses pes) ya da aşağıdaki hesaplayıcıyla veya Şarkılar → Kendi akor sayfalarım bölümünde 5'e kadar bir kapo bul.")}</span></div></div></div>
<div class="panel"><h2>${X("Capo calculator","Kapo-Rechner","Kapo hesaplayıcı")}</h2><p class="lead">${X("Choose a fret. The table shows which chord really sounds when you play a shape.","Wähle den Bund. Die Tabelle zeigt, welcher Akkord wirklich erklingt, wenn du einen Griff spielst.","Perdeyi seç. Tablo, bir akor şeklini çaldığında gerçekte hangi akorun duyulduğunu gösterir.")}</p>
 <div class="row"><label for="gCapo">${X("Capo at","Kapo im","Kapo")}</label><select id="gCapo"></select><button class="btn alt" id="gCapoPlay"></button></div>
 <div class="scroll-x" style="margin-top:12px"><table><thead><tr><th>${X("You press","Du greifst","Bastığın")}</th><th>${X("It sounds","Es klingt","Duyulan")}</th></tr></thead><tbody id="gCapoTable"></tbody></table></div>
 <h3>${X("The other way round: the song uses a hard chord","Andersrum: Das Lied hat einen schweren Akkord","Tersi: Şarkıda zor bir akor var")}</h3>
 <div class="row"><label for="gTarget">${X("Wanted chord","Gesuchter Akkord","İstenen akor")}</label><select id="gTarget"></select></div><div class="fix" id="gCapoFind"></div></div>`,

notes:()=>`
<div class="panel"><h2>${X("Notes on the guitar (first position)","Noten auf der Gitarre (1. Lage)","Gitarda notalar (birinci pozisyon)")}</h2><p class="lead">${X("Every note on the staff has a fixed place on the fretboard. Tap a note to see the string and fret and to hear it. The small 8 under the clef means the guitar sounds an octave lower than written. Nothing changes for you.","Jede Note auf den Linien hat einen festen Platz auf dem Griffbrett. Tippe eine Note an: Du siehst Saite und Bund und hörst sie. Die kleine 8 unter dem Schlüssel heißt: Die Gitarre klingt eine Oktave tiefer als geschrieben. Für dich ändert sich nichts.","Portedeki her notanın klavyede sabit bir yeri vardır. Bir notaya dokun: teli ve perdeyi gör, sesini duy. Anahtarın altındaki küçük 8, gitarın yazılandan bir oktav pes çaldığı anlamına gelir. Senin için bir şey değişmez.")}</p>

G.bind={
start(root){ bindPath(root,G.WEEKS(),"fn-g-path",G,v=>v&&v.chord?{svg:G.chordSVG(G.byId[v.chord])}:null); bindRoutine(root,G.ROUTINE()); bindFix(root,G.PROBS()); },
chords(root){
  const S=G.state, $=id=>root.querySelector("#"+id);
  const show=id=>{ S.chord=id; const c=G.byId[id];
    $("gChips").querySelectorAll("button").forEach(b=>b.setAttribute("aria-pressed",b.dataset.c===id));
    $("gChordDiag").innerHTML=G.chordSVG(c); $("gChordName").textContent=G.name(c);
    $("gChordSub").textContent=(c.q==="m"?X("Minor","Moll","Minör"):c.q==="7"?X("Seventh chord","Sept-Akkord","Yedili akor"):c.q==="maj7"?X("Major seventh","Major-Sept","Majör yedili"):X("Major","Dur","Majör"));
    $("gChordSteps").innerHTML=G.steps(c); $("gChordTip").textContent=c.tip(); };
  $("gChips").onclick=e=>{ const b=e.target.closest("button"); if(b){ show(b.dataset.c); G.strum(G.byId[b.dataset.c]); } };
  $("gStrum").onclick=()=>G.strum(G.byId[S.chord]);
  $("gSlow").onclick=()=>{ const c=G.byId[S.chord]; c.f.forEach((f,s)=>{ if(f>=0) pluck(G.midi(s,f),s*.45); }); };
  show(S.chord);
  const PAIRS=[["Em","Am"],["Am","E"],["Am","Dm"],["D","A"],["D","G"],["G","C"],["Am","C"],["Dm","E"]];
  $("gPair").innerHTML=PAIRS.map((p,i)=>`<option value="${i}">${G.name(G.byId[p[0]])} ↔ ${G.name(G.byId[p[1]])}</option>`).join(""); $("gPair").value=S.pair;
  let t=null,left=60,n=0;
  const best=()=>{ const b=store.get("fn-g-min-"+$("gPair").value,0); $("gMinBest").textContent=b?"· "+X("Record:","Rekord:","Rekor:")+" "+b:""; };
  const cnt=()=>$("gMinCount").textContent=fill(X("{n} changes","{n} Wechsel","{n} geçiş"),{n});
  $("gPair").onchange=()=>{ S.pair=+$("gPair").value; best(); }; best(); cnt();
  $("gMinStart").onclick=()=>{ if(t) return; left=60; n=0; cnt(); $("gMinClock").textContent="60"; ctx(); click(true);
    t=setInterval(()=>{ left--; $("gMinClock").textContent=left; if(left<=0){ clearInterval(t); t=null; click(true); click(true,.2); const k="fn-g-min-"+$("gPair").value; if(n>store.get(k,0)) store.set(k,n); best(); } },1000);
    running.add(()=>{ if(t){clearInterval(t); t=null;} }); };
  $("gMinPlus").onclick=()=>{ if(!t) return; n++; cnt(); };
},
strum(root){
  const S=G.state, $=id=>root.querySelector("#"+id), P=G.PATS();
  $("gPat").innerHTML=P.map((p,i)=>`<option value="${i}">${p.n}</option>`).join(""); $("gPat").value=S.pat;
  $("gProg").innerHTML=G.PROGS.map((p,i)=>`<option value="${i}">${p.map(id=>G.name(G.byId[id])).join(" – ")}</option>`).join(""); $("gProg").value=S.prog;
  $("gBpm").value=S.bpm; $("gBpmVal").textContent=S.bpm; $("gMetro").checked=S.metro;
  const cnt=(i,len)=>{ const a=X("and","und","ve"); return (len===6?["1",a,"2",a,"3",a]:["1",a,"2",a,"3",a,"4",a])[i]; };
  const beats=(cur=-1)=>{ const p=P[S.pat].p; $("gBeats").style.setProperty("--n",p.length);
    $("gBeats").innerHTML=[...p].map((c,i)=>`<div class="beat ${i%2===0?"main":""} ${i===cur?"cur":""}"><span class="ar">${c==="D"?"↓":c==="U"?"↑":c==="B"?"♪":"·"}</span><span class="ct">${cnt(i,p.length)}</span></div>`).join("");
    $("gPatInfo").textContent=P[S.pat].info; };
  const prog=(cur=0)=>{ const pr=G.PROGS[S.prog]; $("gProgView").innerHTML=pr.map((id,i)=>`<span class="${i===cur?"cur":""}">${G.name(G.byId[id])}</span>`).join(""); $("gSDiag").innerHTML=G.chordSVG(G.byId[pr[cur]]); };
  let t=null; const stop=()=>{ if(t){clearInterval(t); t=null;} beats(); };
  $("gPat").onchange=()=>{ S.pat=+$("gPat").value; stop(); }; $("gProg").onchange=()=>{ S.prog=+$("gProg").value; stop(); prog(); };
  $("gBpm").oninput=()=>{ S.bpm=+$("gBpm").value; $("gBpmVal").textContent=S.bpm; }; $("gMetro").onchange=()=>S.metro=$("gMetro").checked;
  $("gSPlay").onclick=()=>{ stop(); ctx(); const p=P[S.pat].p, pr=G.PROGS[S.prog]; let step=0;
    const tick=()=>{ const i=step%p.length, bar=Math.floor(step/p.length)%pr.length, c=G.byId[pr[bar]];
      if(i===0) prog(bar); beats(i); if(S.metro&&i%2===0) click(i===0);
      const ch=p[i]; if(ch==="D"||ch==="U") G.strum(c,ch,0,.45); if(ch==="B") G.strum(c,"D",0,.5,0,true); step++; };
    tick(); t=setInterval(tick,60/S.bpm/2*1000); running.add(stop); };
  $("gSStop").onclick=stop; beats(); prog();
},
pick(root){
  const S=G.state, $=id=>root.querySelector("#"+id), P=G.PPAT(), chords=["Am","Em","C","G","D","Dm","E","A"];
  $("gPP").innerHTML=P.map((p,i)=>`<option value="${i}">${p.n}</option>`).join(""); $("gPP").value=S.ppat;
  $("gPC").innerHTML=chords.map(id=>`<option value="${id}">${G.name(G.byId[id])}</option>`).join(""); $("gPC").value=S.pchord;
  $("gPBpm").value=S.pbpm; $("gPBpmVal").textContent=S.pbpm;
  const cols=()=>{ const c=G.byId[S.pchord], alt=c.b===0?2:3;
    return P[S.ppat].s.map(tok=>tok==="p"?[{s:c.b,f:"p"}]:tok==="p2"?[{s:alt,f:"p"}]:[...tok].map(ch=>({s:G.STR_OF[ch],f:ch}))); };
  const tab=(cur=-1)=>{ const c=G.byId[S.pchord], cs=cols(), x0=46, dx=52, W=x0+cs.length*dx+20, top=40, dy=24, H=top+5*dy+30;
    let o=`<svg viewBox="0 0 ${W} ${H}" width="${W}" role="img" aria-label="Tab">`;
    for(let r=0;r<6;r++){ const s=5-r, y=top+r*dy; o+=`<line x1="${x0-10}" y1="${y}" x2="${W-10}" y2="${y}" stroke="var(--string)" stroke-width="1.5"/><text x="${x0-18}" y="${y+5}" font-size="13" font-weight="700" fill="var(--muted)" text-anchor="end">${G.str(s)}</text>`; }
    cs.forEach((col,ci)=>{ const x=x0+ci*dx+dx/2;
      if(ci===cur) o+=`<rect x="${x-dx/2+3}" y="4" width="${dx-6}" height="${H-8}" rx="8" fill="var(--hi-soft)" stroke="var(--hi)"/>`;
      const fl=[...new Set(col.map(n=>n.f))].join("");
      o+=`<text x="${x}" y="22" font-size="16" font-weight="700" text-anchor="middle" fill="var(--${col[0].f==="p"?"p":col.length>1?"ink":col[0].f})">${fl}</text>`;
      col.forEach(n=>{ const y=top+(5-n.s)*dy, fr=Math.max(0,c.f[n.s]); o+=`<rect x="${x-11}" y="${y-11}" width="22" height="22" rx="5" fill="var(--surface)"/><text x="${x}" y="${y+5}" font-size="15" font-weight="700" fill="var(--ink)" text-anchor="middle">${fr}</text>`; });
      o+=`<text x="${x}" y="${H-8}" font-size="11" fill="var(--muted)" text-anchor="middle">${ci+1}</text>`; });
    $("gTab").innerHTML=o+`</svg>`; $("gPInfo").textContent=P[S.ppat].info; $("gPDiag").innerHTML=G.chordSVG(c); };
  let t=null; const stop=()=>{ if(t){clearInterval(t); t=null;} tab(); };
  $("gPP").onchange=()=>{ S.ppat=+$("gPP").value; stop(); }; $("gPC").onchange=()=>{ S.pchord=$("gPC").value; stop(); };
  $("gPBpm").oninput=()=>{ S.pbpm=+$("gPBpm").value; $("gPBpmVal").textContent=S.pbpm; };
  $("gPPlay").onclick=()=>{ stop(); ctx(); const c=G.byId[S.pchord], cs=cols(); let k=0;
    const tick=()=>{ const ci=k%cs.length; tab(ci); cs[ci].forEach(n=>pluck(G.midi(n.s,Math.max(0,c.f[n.s])),0,n.f==="p"?.7:.5)); k++; };
    tick(); t=setInterval(tick,60/S.pbpm/2*1000); running.add(stop); };
  $("gPStop").onclick=stop; tab();
},
capo(root){
  const S=G.state, $=id=>root.querySelector("#"+id);
  const shapes=G.CH.filter(c=>["Em","Am","E","Dm","D","A","G","C"].includes(c.id));
  $("gCapo").innerHTML=Array.from({length:8},(_,i)=>`<option value="${i}">${i===0?X("no capo","ohne Kapo","kapo yok"):fill(X("fret {n}","{n}. Bund","{n}. perde"),{n:i})}</option>`).join(""); $("gCapo").value=S.capo;
  const draw=()=>{ const k=S.capo; $("gCapoTable").innerHTML=shapes.map(c=>`<tr><td>${G.name(c)}</td><td class="strong">${chordName(c.r+k,c.q)}</td></tr>`).join("");
    $("gCapoPlay").textContent=fill(X("Hear Am with capo {n}","Am mit Kapo {n} anhören","Kapo {n} ile Am dinle"),{n:k}); };
  $("gCapo").onchange=()=>{ S.capo=+$("gCapo").value; draw(); }; draw();
  $("gCapoPlay").onclick=()=>G.strum(G.byId.Am,"D",0,.5,S.capo);
  const targets=[]; for(let r=0;r<12;r++){ targets.push({r,q:""}); targets.push({r,q:"m"}); }
  $("gTarget").innerHTML=targets.map((t,i)=>`<option value="${i}">${chordName(t.r,t.q)}</option>`).join("");
  if(S.target<0) S.target=targets.findIndex(t=>t.r===11&&t.q==="m"); $("gTarget").value=S.target;
  const find=()=>{ const t=targets[S.target], res=[];
    shapes.filter(c=>c.q===t.q).forEach(c=>{ const k=pc(t.r-c.r); if(k<=7) res.push({c,k}); }); res.sort((a,b)=>a.k-b.k);
    $("gCapoFind").innerHTML=res.length?res.map(r=>`<div><b>${r.k===0?X("No capo","Ohne Kapo","Kapo yok"):fill(X("Capo at fret {n}","Kapo im {n}. Bund","Kapo {n}. perdede"),{n:r.k})}, ${X("shape","Griff","şekil")} ${G.name(r.c)}</b><span>${fill(X("Sounds as {c}.","Klingt als {c}.","{c} olarak duyulur."),{c:chordName(t.r,t.q)})}</span></div>`).join(""):`<div><b>${X("No easy option","Keine einfache Lösung","Kolay bir yol yok")}</b><span>${X("No easy shape with a capo up to fret 7.","Mit Kapo bis Bund 7 gibt es keinen leichten Griff.","7. perdeye kadar kapoyla kolay bir şekil yok.")}</span></div>`; };
  $("gTarget").onchange=()=>{ S.target=+$("gTarget").value; find(); }; find();
},
notes(root){
  const S=G.state, $=id=>root.querySelector("#"+id);
  const items=()=>G.NOTES.map(([m])=>({w:m+12,label:noteName(m)}));
  const show=i=>{ S.note=i; const [m,s,f]=G.NOTES[i];
    $("gStaff").innerHTML=staffSVG(items(),i,{octaveBelow:true,dx:40});
    const one={single:true,f:[-1,-1,-1,-1,-1,-1],g:[0,0,0,0,0,0]}; one.f[s]=f; one.g[s]=f;
    $("gNoteDiag").innerHTML=G.chordSVG(one,s); $("gNoteName").textContent=noteName(m);
    $("gNoteWhere").innerHTML=`<b>${G.strLong(s)}</b>, ${f===0?X("open (don't press)","leer (nicht drücken)","boş (basma)"):fill(X("fret {n} with the {f}","{n}. Bund mit dem {f}","{n}. perde, {f} ile"),{n:f,f:G.finger(f).toLowerCase()})}.`; };
  const act=e=>{ const g=e.target.closest(".staff-note"); if(!g) return; show(+g.dataset.i); pluck(G.NOTES[+g.dataset.i][0]); };

  $("gNotePlay").onclick=()=>pluck(G.NOTES[S.note][0]); show(S.note);
  bindDurs(root,d=>pluck(55,0,.6));

tune(root){
  const $=id=>root.querySelector("#"+id); let src=null,t=null,on=-1;
  const stopRef=()=>{ try{src&&src.stop();}catch(e){} src=null; if(t){clearInterval(t); t=null;} on=-1; $("gStr").querySelectorAll("button").forEach(b=>b.classList.remove("cur")); $("gRefStop").hidden=true; };
  $("gStr").onclick=e=>{ const b=e.target.closest("button"); if(!b) return; const s=+b.dataset.s, same=on===s; stopRef(); if(same) return;
    on=s; b.classList.add("cur"); $("gRefStop").hidden=false; let n=0;
    const hit=()=>{ try{src&&src.stop();}catch(e){} src=pluck(G.OPEN[s],0,.7); if(++n>=8) setTimeout(stopRef,1800); };
    hit(); t=setInterval(()=>{ if(n<8) hit(); },2000); running.add(stopRef); };
  $("gRefStop").onclick=stopRef;
  $("gMic").onclick=async()=>{
    if(mic.on){ mic.stop(); $("gMic").textContent=X("Start listening","Zuhören starten","Dinlemeye başla"); return; }
    const ok=await mic.start(f=>{ if(f<0) return; const m=69+12*Math.log2(f/440); let bs=0; G.OPEN.forEach((o,s)=>{ if(Math.abs(m-o)<Math.abs(m-G.OPEN[bs])) bs=s; }); const cents=(m-G.OPEN[bs])*100;
      $("gTunName").textContent=G.str(bs);
      $("gTunSub").textContent=Math.abs(cents)<8?"✓ "+X("in tune","passt","doğru"):cents<0?fill(X("too low ({c} cents): tighten","zu tief ({c} Cent): straffer drehen","pes ({c} sent): ger"),{c:cents.toFixed(0)}):fill(X("too high (+{c} cents): loosen","zu hoch (+{c} Cent): lockerer drehen","tiz (+{c} sent): gevşet"),{c:cents.toFixed(0)});
      setNeedle($("gTunNeedle"),cents); },70,500);
    if(!ok){ $("gMicNote").textContent=micBlocked(); $("gMicNote").hidden=false; return; }
    $("gMicNote").hidden=true; $("gMic").textContent=X("Stop listening","Zuhören stoppen","Dinlemeyi durdur"); }
}};

/* =====================================================================
   CHORD SHEETS – paste a song like on chord websites (chord line above the
   lyric line, or ChordPro [Am]inline). Stored only in this browser.
   Sounding chords = written shape + capo on the sheet. You choose your own
   capo (0–7) and a transposition; the page shows which shapes to play.
   ===================================================================== */
const CS_PC={C:0,D:2,E:4,F:5,G:7,A:9,B:11,H:11};
const CS_EN=["C","C#","D","Eb","E","F","F#","G","G#","A","Bb","B"];
const CS_RE=/^([A-H])([#b♯♭]?)((?:maj|min|dim|aug|sus|add|m|M|\d|[#b+°ø()])*)(?:\/([A-H])([#b♯♭]?))?$/;
const csEsc=s=>s.replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
function csChord(tok){ const m=tok.match(CS_RE); if(!m) return null;
  const acc=a=>a==="#"||a==="♯"?1:a==="b"||a==="♭"?-1:0;
  let q=m[3].replace(/^min/,"m"); if(q==="M") q="";
  return {r:pc(CS_PC[m[1]]+acc(m[2])),q,bass:m[4]?pc(CS_PC[m[4]]+acc(m[5])):null}; }
const csIsChordLine=l=>{ const t=l.trim().split(/\s+/).filter(x=>!/^(\||-|x\d+|\(|\)|\/)$/i.test(x)); return t.length>0&&t.every(x=>csChord(x.replace(/[()]/g,""))); };
const csName=(c,k=0)=>chordName(c.r+k,c.q)+(c.bass!=null?"/"+CHORD_ROOT[lang][pc(c.bass+k)]:"");
const csShape=(c,k)=>G.byId[CS_EN[pc(c.r+k)]+c.q]||null;
/** text → lines: {t:"chords",items:[{col,c}]} | {t:"text",s} */
function csParse(txt){ const out=[];
  txt.replace(/\r/g,"").split("\n").forEach(l=>{
    if(/\[[A-H][^\]]*\]/.test(l)&&!csIsChordLine(l)){ // ChordPro inline
      let text="", items=[]; l.split(/(\[[^\]]+\])/).forEach(p=>{ const m=p.match(/^\[([^\]]+)\]$/); const c=m&&csChord(m[1].trim()); if(c) items.push({col:text.length,c}); else text+=p; });
      if(items.length){ out.push({t:"chords",items}); out.push({t:"text",s:text}); return; } }

/** Parse the simple song notation for a wind instrument M (uses M.PC, M.RANGES, M.N). */
function parseWind(txt,M){
  const bars=[]; let cur=[];
  txt.replace(/\n/g," | ").split(/\s+/).filter(Boolean).forEach(tok=>{
    if(tok==="|"){ if(cur.length){bars.push(cur);cur=[];} return; }
    const m=tok.match(/^([^:]+?)(?::([\d.,/]+))?$/); if(!m) return;
    let name=m[1], beats=1;
    if(m[2]){ const v=m[2].includes("/")?m[2].split("/").reduce((a,b)=>a/b):parseFloat(m[2].replace(",",".")); if(v>0) beats=v; }
    let reg="mid";
    if(/[,↓]$/.test(name)){ reg="low"; name=name.replace(/[,↓]+$/,""); }
    else if(/['’↑^]$/.test(name)){ reg="high"; name=name.replace(/['’↑^]+$/,""); }
    const key=name.toLowerCase().replace("♯","#").replace("♭","b");
    if(["p","pause","rest","r","sus"].includes(key)){ cur.push({rest:true,beats}); return; }
    // letter "b": in German it means B-flat, in English it means B natural
    const p=key==="b"?(lang==="de"?10:11):key==="h"?11:M.PC[key];
    if(p===undefined){ cur.push({bad:true,beats,label:name}); return; }
    const [lo,hi]=M.RANGES[reg]||M.RANGES.mid;
    let midi=null; for(let x=lo;x<=hi;x++) if(pc(x)===p&&M.byMidi(x)){ midi=x; break; }
    if(midi===null){ // not in that register: closest playable note with the same name
      const centre=(lo+hi)/2, alt=M.N.filter(n=>pc(n.m)===p).sort((x,y)=>Math.abs(x.m-centre)-Math.abs(y.m-centre))[0];
      if(!alt){ cur.push({bad:true,beats,label:tok}); return; } midi=alt.m; }
    cur.push({m:midi,beats});
  });
  if(cur.length) bars.push(cur); return bars;
}

/** Breathy end-blown flute tone (sine + filtered noise). */
function neyTone(m,dur=1.4,vol=.2){
  try{
    const c=ctx(), t=c.currentTime, out=c.createGain(), f=hz(m), rel=Math.min(.3,dur*.3);
    out.gain.setValueAtTime(0,t); out.gain.linearRampToValueAtTime(vol,t+.12); out.gain.setValueAtTime(vol,t+dur-rel); out.gain.linearRampToValueAtTime(0,t+dur); out.connect(c.destination);
    [[1,1],[2,.18],[3,.08]].forEach(([h,a])=>{ const o=c.createOscillator(), g=c.createGain(); o.frequency.value=f*h; g.gain.value=a; o.connect(g); g.connect(out); o.start(t); o.stop(t+dur+.05); });
    const len=Math.floor(c.sampleRate*(dur+.1)), nb=c.createBuffer(1,len,c.sampleRate), d=nb.getChannelData(0); for(let i=0;i<len;i++) d[i]=Math.random()*2-1;
    const ns=c.createBufferSource(), bp=c.createBiquadFilter(), ng=c.createGain(); ns.buffer=nb; bp.type="bandpass"; bp.frequency.value=f*2; bp.Q.value=1.2; ng.gain.value=.12;
    ns.connect(bp); bp.connect(ng); ng.connect(out); ns.start(t); ns.stop(t+dur+.05);
  }catch(e){}
}
